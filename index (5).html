// ── Excluir / editar vendas (individual e em grupo) ───────────────────────────
async function excluirVenda(id){
  const v=vendasState.historico.find(x=>x.id===id);
  if(!v)return;
  const ok=await confirmarAcao({
    titulo:'Excluir venda?',
    mensagem:`A venda de ${v.cliente} (${fmtM(valorTotalPedido(v))}, ${v.data||'sem data'}) será removida permanentemente. Essa ação não pode ser desfeita.`,
    textoConfirmar:'Excluir venda'
  });
  if(!ok)return;
  vendasState.historico=vendasState.historico.filter(x=>x.id!==id);
  relatorioSel.delete(id);
  await salvarVendasHistorico();
  removerContaReceberDeVenda(id);
  await salvarContasReceber();
  mostrarToast('Venda excluída.','sucesso');
  renderRelatorioFinanceiro();
}

async function excluirVendasSelecionadas(){
  const ids=[...relatorioSel];
  if(ids.length===0)return;
  const totalSel=vendasState.historico.filter(v=>ids.includes(v.id)).reduce((s,v)=>s+valorTotalPedido(v),0);
  const ok=await confirmarAcao({
    titulo:`Excluir ${ids.length} venda${ids.length>1?'s':''}?`,
    mensagem:`${ids.length} venda${ids.length>1?'s selecionadas somam':' selecionada soma'} ${fmtM(totalSel)} e ${ids.length>1?'serão removidas':'será removida'} permanentemente. Essa ação não pode ser desfeita.`,
    textoConfirmar:`Excluir ${ids.length} venda${ids.length>1?'s':''}`
  });
  if(!ok)return;
  vendasState.historico=vendasState.historico.filter(x=>!ids.includes(x.id));
  relatorioSel.clear();
  await salvarVendasHistorico();
  ids.forEach(removerContaReceberDeVenda);
  await salvarContasReceber();
  mostrarToast(`${ids.length} venda${ids.length>1?'s excluídas':' excluída'}.`,'sucesso');
  renderRelatorioFinanceiro();
}

// Edição individual: cliente, forma de pagamento, valor total, NF/boleto e
// observação. O mix de pneus por medida não é editado aqui (fica só na venda
// original) — é um ajuste rápido para corrigir erros de lançamento.
function abrirEditarVenda(id){
  const v=vendasState.historico.find(x=>x.id===id);
  if(!v)return;
  const crsVinculadas=CONTAS_RECEBER.filter(c=>c.vendaId===id);
  // Venda parcelada (mais de uma Conta a Receber vinculada, uma por parcela):
  // edição simplificada aqui (só cliente/NF/observação) — o valor e o
  // vencimento de cada parcela já são editados individualmente em Contas a
  // Receber, então não duplicamos esse controle neste modal.
  if(crsVinculadas.length>1){
    abrirModal(`
      <h3>Editar venda parcelada</h3>
      <p class="modal-desc">${v.data||''} ${v.hora?'· '+v.hora:''} · ${v.pneus||0} pneus · parcelada em ${crsVinculadas.length}x (${fmtM(valorTotalPedido(v))}). Valor e vencimento de cada parcela são editados em Contas a Receber.</p>
      <div class="form-group"><label class="login-label">Cliente</label><input class="login-input" id="edit-vnd-cliente" value="${escapeHtml(v.cliente||'')}"></div>
      <div class="form-group"><label class="login-label">Nº NF/boleto (opcional)</label><input class="login-input" id="edit-vnd-nf" value="${escapeHtml(v.numeroNF||'')}"></div>
      <div class="form-group"><label class="login-label">Observação</label><input class="login-input" id="edit-vnd-obs" value="${escapeHtml(v.obs||'')}"></div>
      <div class="login-erro" id="edit-vnd-erro"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1;justify-content:center" id="edit-vnd-cancelar">Cancelar</button>
        <button class="btn btn-primary" style="flex:1;justify-content:center" id="edit-vnd-salvar"><i class="ti ti-device-floppy"></i> Salvar</button>
      </div>`);
    document.getElementById('edit-vnd-cancelar').addEventListener('click', fecharModal);
    document.getElementById('edit-vnd-salvar').addEventListener('click', async ()=>{
      const cliente=document.getElementById('edit-vnd-cliente').value.trim();
      const nf=document.getElementById('edit-vnd-nf').value.trim();
      const obs=document.getElementById('edit-vnd-obs').value;
      const erroEl=document.getElementById('edit-vnd-erro');
      if(!cliente){ erroEl.textContent='Preencha o cliente.'; erroEl.style.display='block'; return; }
      v.cliente=cliente; v.numeroNF=nf; v.obs=obs;
      crsVinculadas.forEach(c=>{ c.cliente=cliente; });
      await salvarVendasHistorico();
      await salvarContasReceber();
      fecharModal();
      mostrarToast('Venda atualizada.','sucesso');
      renderRelatorioFinanceiro();
    });
    return;
  }
  const crVinculada=crsVinculadas[0];
  abrirModal(`
    <h3>Editar venda</h3>
    <p class="modal-desc">${v.data||''} ${v.hora?'· '+v.hora:''} · ${v.pneus||0} pneus (mix não é editável aqui)</p>
    <div class="form-group"><label class="login-label">Cliente</label><input class="login-input" id="edit-vnd-cliente" value="${escapeHtml(v.cliente||'')}"></div>
    <div class="form-group"><label class="login-label">Forma de pagamento</label>
      <select class="login-input" id="edit-vnd-pagamento">
        ${PAGS.map(p=>`<option value="${p.nome}" ${v.pagamento===p.nome?'selected':''}>${p.nome}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label class="login-label">Valor total (R$)</label><input class="login-input" id="edit-vnd-valor" type="number" step="0.01" min="0" value="${valorTotalPedido(v)}"></div>
    <div class="form-group"><label class="login-label">Banco / conta (se pagamento à vista)</label>
      <select class="login-input" id="edit-vnd-banco">
        <option value="">Selecione...</option>
        ${BANCOS.map(b=>`<option value="${escapeHtml(b.nome)}" ${(v.pagamentos&&v.pagamentos[0]&&v.pagamentos[0].banco===b.nome)?'selected':''}>${escapeHtml(b.nome)}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label class="login-label">Vencimento (se boleto/fiado)</label><input class="login-input" id="edit-vnd-vencimento" type="date" value="${crVinculada?crVinculada.vencISO:vencimentoPadrao30Dias()}"></div>
    <div class="form-group"><label class="login-label">Nº NF/boleto (opcional)</label><input class="login-input" id="edit-vnd-nf" value="${escapeHtml(v.numeroNF||'')}"></div>
    <div class="form-group"><label class="login-label">Observação</label><input class="login-input" id="edit-vnd-obs" value="${escapeHtml(v.obs||'')}"></div>
    <div class="login-erro" id="edit-vnd-erro"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1;justify-content:center" id="edit-vnd-cancelar">Cancelar</button>
      <button class="btn btn-primary" style="flex:1;justify-content:center" id="edit-vnd-salvar"><i class="ti ti-device-floppy"></i> Salvar</button>
    </div>`);
  document.getElementById('edit-vnd-cancelar').addEventListener('click', fecharModal);
  document.getElementById('edit-vnd-salvar').addEventListener('click', async ()=>{
    const cliente=document.getElementById('edit-vnd-cliente').value.trim();
    const pagamento=document.getElementById('edit-vnd-pagamento').value;
    const valorNovo=parseFloat(document.getElementById('edit-vnd-valor').value);
    const banco=document.getElementById('edit-vnd-banco').value;
    const vencISO=document.getElementById('edit-vnd-vencimento').value;
    const nf=document.getElementById('edit-vnd-nf').value.trim();
    const obs=document.getElementById('edit-vnd-obs').value;
    const erroEl=document.getElementById('edit-vnd-erro');
    if(!cliente||!(valorNovo>=0)||isNaN(valorNovo)){
      erroEl.textContent='Preencha o cliente e um valor válido.';
      erroEl.style.display='block';
      return;
    }
    const pagoAVista=pagamentoEhAVista(pagamento);
    if(pagoAVista&&!banco){ erroEl.textContent='Selecione o banco que recebeu o pagamento.'; erroEl.style.display='block'; return; }
    if(!pagoAVista&&!vencISO){ erroEl.textContent='Informe o vencimento da venda a prazo.'; erroEl.style.display='block'; return; }
    // Se a venda já tinha um pagamento único "à vista", mantém o valor/forma
    // sincronizados para o saldo (valorTotal - pago) continuar correto.
    if(v.pagamentos&&v.pagamentos.length===1){
      v.pagamentos[0].valor=valorNovo;
      v.pagamentos[0].forma=pagamento;
      v.pagamentos[0].banco=banco;
    }
    v.cliente=cliente;
    v.pagamento=pagamento;
    v.valor=valorNovo;
    v.valorTotal=valorNovo;
    v.numeroNF=nf;
    v.obs=obs;
    if(nf && v.notasFiscais && v.notasFiscais.length===1){ v.notasFiscais[0].numero=nf; v.notasFiscais[0].valor=valorNovo; }
    // Sincroniza a Conta a Receber vinculada com a forma de pagamento atual
    if(pagoAVista){
      if(crVinculada) removerContaReceberDeVenda(id);
    } else if(crVinculada){
      crVinculada.cliente=cliente; crVinculada.valor=valorNovo; crVinculada.tipo=pagamento;
      crVinculada.vencISO=vencISO; crVinculada.vencimento=fmtDataBr(vencISO);
    } else {
      criarContaReceberDeVenda({id, cliente, valor:valorNovo}, vencISO, pagamento);
    }
    await salvarVendasHistorico();
    await salvarContasReceber();
    fecharModal();
    mostrarToast('Venda atualizada.','sucesso');
    renderRelatorioFinanceiro();
  });
}

// Edição em grupo: só troca a forma de pagamento das vendas selecionadas (ex:
// corrigir várias vendas lançadas como "Fiado" por engano para "PIX").
function abrirTrocarPagamentoLote(){
  const ids=[...relatorioSel];
  if(ids.length===0)return;
  abrirModal(`
    <h3>Trocar forma de pagamento</h3>
    <p class="modal-desc">Aplica a nova forma de pagamento às ${ids.length} venda${ids.length>1?'s selecionadas':' selecionada'}.</p>
    <div class="form-group"><label class="login-label">Nova forma de pagamento</label>
      <select class="login-input" id="lote-pagamento">
        ${PAGS.map(p=>`<option value="${p.nome}">${p.nome}</option>`).join('')}
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1;justify-content:center" id="lote-cancelar">Cancelar</button>
      <button class="btn btn-primary" style="flex:1;justify-content:center" id="lote-salvar"><i class="ti ti-check"></i> Aplicar</button>
    </div>`);
  document.getElementById('lote-cancelar').addEventListener('click', fecharModal);
  document.getElementById('lote-salvar').addEventListener('click', async ()=>{
    const novaForma=document.getElementById('lote-pagamento').value;
    const pagoAVista=pagamentoEhAVista(novaForma);
    const vencPadrao=vencimentoPadrao30Dias();
    vendasState.historico.forEach(v=>{
      if(!ids.includes(v.id))return;
      v.pagamento=novaForma;
      if(v.pagamentos&&v.pagamentos.length===1) v.pagamentos[0].forma=novaForma;
      // Sincroniza a Conta a Receber vinculada com a nova forma de pagamento
      // (troca em lote não pede banco/vencimento individual — usa vencimento
      // padrão de 30 dias quando vira venda a prazo; ajuste depois se precisar)
      const crsVinculadas=CONTAS_RECEBER.filter(c=>c.vendaId===v.id);
      if(crsVinculadas.length>1){
        // Venda parcelada: só atualiza o rótulo de cada parcela, não mexe em
        // valor/vencimento nem apaga as parcelas por uma troca em lote.
        crsVinculadas.forEach(c=>{ c.tipo=novaForma; });
        return;
      }
      const crVinculada=crsVinculadas[0];
      if(pagoAVista){
        if(crVinculada) removerContaReceberDeVenda(v.id);
      } else if(crVinculada){
        crVinculada.tipo=novaForma;
      } else {
        criarContaReceberDeVenda({id:v.id,cliente:v.cliente,valor:valorTotalPedido(v)}, vencPadrao, novaForma);
      }
    });
    await salvarVendasHistorico();
    await salvarContasReceber();
    fecharModal();
    mostrarToast(`Forma de pagamento atualizada em ${ids.length} venda${ids.length>1?'s':''}.`,'sucesso');
    relatorioSel.clear();
    renderRelatorioFinanceiro();
  });
}

function addMesesISO(iso, n){
  const d=new Date(iso+'T12:00:00');

}

// Liga o checkbox "Parcelar" (mostra/esconde os blocos) e o botão "Gerar
// parcelas" (monta N linhas editáveis de valor+vencimento, distribuindo o
// valor total igualmente e sugerindo vencimentos mensais a partir da 1ª data
// — mas o usuário pode alterar cada valor/data individualmente depois).
function _bindParcelamentoToggle(prefixo){
  const chk=document.getElementById(`${prefixo}-parcelar`);
  const blocoUnico=document.getElementById(`${prefixo}-bloco-unico`);
  const blocoParcelas=document.getElementById(`${prefixo}-bloco-parcelas`);
  chk.addEventListener('change', ()=>{
    blocoUnico.classList.toggle('hidden', chk.checked);
    blocoParcelas.classList.toggle('hidden', !chk.checked);
  });
  document.getElementById(`${prefixo}-gerar-parcelas`).addEventListener('click', ()=>{
    const n=Math.max(2,parseInt(document.getElementById(`${prefixo}-nparc`).value)||2);
    const total=parseFloat(document.getElementById(`${prefixo}-valor-total`).value)||0;
    const primeiroVenc=document.getElementById(`${prefixo}-primeiro-venc`).value||new Date().toISOString().slice(0,10);
    const base=Math.floor((total/n)*100)/100;
    let somaParcial=0;
    const linhas=[];
    for(let i=0;i<n;i++){
      const valorParc=(i===n-1)?+(total-somaParcial).toFixed(2):base;
      somaParcial+=valorParc;
      linhas.push({valor:valorParc, venc:addMesesISO(primeiroVenc,i)});
    }
    document.getElementById(`${prefixo}-parcelas-lista`).innerHTML=linhas.map((l,i)=>`
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <span style="font-size:11px;color:var(--text2);width:22px">${i+1}ª</span>
        <input class="${prefixo}-parc-valor" type="number" step="0.01" min="0" data-i="${i}" value="${l.valor}" style="flex:1;margin-bottom:0">
        <input class="${prefixo}-parc-venc" type="date" data-i="${i}" value="${l.venc}" style="flex:1;margin-bottom:0">
      </div>`).join('');
  });
}

  const sel=document.getElementById('cp-conta');

    if(parcelar){
      const parcelas=_lerParcelasForm('vm');
      if(parcelas.length<2||parcelas.some(p=>!(p.valor>0)||!p.vencISO)){
        erroEl.textContent='Clique em "Gerar parcelas" e preencha valor e vencimento de todas.'; erroEl.style.display='block'; return;
      }
      const valor=+(parcelas.reduce((s,p)=>s+p.valor,0)).toFixed(2);
      vendasState.historico.push({
        id:vid, cliente, cliId:'', pneus,
        pagamento:formaNome, valor, valorTotal:valor, obs, hora:now(),
        data:fmtDataBr(dataISO), dataISO,
        qtds:{}, dev:null, numeroNF:nf, numeroBoleto:'',
        pagamentos:[], parcelamento:{total:parcelas.length},
        notasFiscais:nf?[{numero:nf,valor}]:[]
      });
      criarContasReceberParceladasDeVenda({id:vid,cliente}, parcelas, formaNome);
      await salvarContasReceber();
      await salvarVendasHistorico();
      fecharModal();
      mostrarToast('Venda parcelada lançada.','sucesso');
      renderRelatorioFinanceiro();
      return;
    }

    const valor=parseFloat(document.getElementById('vm-valor').value);
    const banco=document.getElementById('vm-banco').value;
    const vencISO=document.getElementById('vm-vencimento').value;
    if(!(valor>0)){ erroEl.textContent='Preencha um valor válido.'; erroEl.style.display='block'; return; }
    // Mesma regra usada no fluxo guiado: pagamentos "à vista" já entram como
    // recebidos (com banco); boleto/fiado viram Conta a Receber vinculada.
    const pagoAVista=pagamentoEhAVista(pagId);
    if(pagoAVista&&!banco){ erroEl.textContent='Selecione o banco que recebeu o pagamento.'; erroEl.style.display='block'; return; }
    if(!pagoAVista&&!vencISO){ erroEl.textContent='Informe o vencimento da venda a prazo.'; erroEl.style.display='block'; return; }
    vendasState.historico.push({
      id:vid, cliente, cliId:'', pneus,
      pagamento:formaNome, valor, valorTotal:valor, obs, hora:now(),
      data:fmtDataBr(dataISO), dataISO,
      qtds:{}, dev:null, numeroNF:nf, numeroBoleto:'',
      pagamentos:pagoAVista?[{valor,forma:formaNome,banco,hora:now(),data:dataISO}]:[],
      notasFiscais:nf?[{numero:nf,valor}]:[]
    });
    if(!pagoAVista){
      criarContaReceberDeVenda({id:vid,cliente,valor}, vencISO, formaNome);
      await salvarContasReceber();
    }
    await salvarVendasHistorico();
    fecharModal();
    mostrarToast('Venda lançada manualmente.','sucesso');
    renderRelatorioFinanceiro();
  });
}

// ── Filtro de período genérico (usado pelo Consolidado e Pagos/Recebidos) ───
function _dentroPeriodo(iso, de, ate){
  if(!de && !ate) return true;
  if(!iso) return false;
  if(de && iso<de) return false;
  if(ate && iso>ate) return false;
  return true;
}

// ── Aba "Consolidado" — a receber + a pagar numa lista só, filtrável por período ──
function _linhasConsolidado(){
  const {dataDe:de, dataAte:ate, tipo, situacao} = consolState;
  let receber = tipo==='pagar' ? [] : CONTAS_RECEBER.filter(c=>_dentroPeriodo(vencimentoISOConta(c), de, ate));
  let pagar = tipo==='receber' ? [] : contasPagarState.itens.filter(c=>_dentroPeriodo(vencimentoISOConta(c), de, ate));
  if(situacao==='aberto'){ receber=receber.filter(c=>saldoConta(c)>0.009); pagar=pagar.filter(c=>saldoConta(c)>0.009); }
  else if(situacao==='pago'){ receber=receber.filter(c=>saldoConta(c)<=0.009); pagar=pagar.filter(c=>saldoConta(c)<=0.009); }
  else if(situacao==='vencido'){ receber=receber.filter(c=>statusConta(c)==='vencido'); pagar=pagar.filter(c=>statusConta(c)==='vencido'); }
  const linhas=[
    ...receber.map(c=>({tipo:'receber', item:c, nome:c.cliente, venc:vencimentoISOConta(c)})),
    ...pagar.map(c=>({tipo:'pagar', item:c, nome:c.fornecedor, venc:vencimentoISOConta(c)})),
  ];
  linhas.sort((a,b)=>(a.venc||'9999').localeCompare(b.venc||'9999'));
  return linhas;
}

// ── Aba "Pagos/Recebidos" — ledger de transações reais, filtrável por período/dia ──
function _eventosPagamento(){
  const eventos=[];
  // Vendas pagas na hora (dinheiro/PIX/cartão/cheque) também são dinheiro
  // entrando num banco — sem isso a conciliação bancária ficaria incompleta,
  // faltando justamente as vendas à vista do dia a dia.
  // Cada evento guarda origemTipo/origemId/pagIndex — chave estável usada pela
  // Conciliação com IA pra saber exatamente qual pagamento já foi conferido
  // contra o extrato, sem precisar alterar o registro original.
  vendasState.historico.forEach(v=>{
    (v.pagamentos||[]).forEach((pg,i)=>{
      eventos.push({tipo:'recebido', nome:v.cliente, data:pg.data||v.dataISO||'', forma:pg.forma||'', banco:pg.banco||'', valor:parseFloat(pg.valor)||0, hora:pg.hora||'', origemTipo:'venda', origemId:v.id, pagIndex:i});
    });
  });
  CONTAS_RECEBER.forEach(c=>{
    (c.pagamentos||[]).forEach((pg,i)=>{
      eventos.push({tipo:'recebido', nome:c.cliente, data:pg.data||'', forma:pg.forma||'', banco:pg.banco||'', valor:parseFloat(pg.valor)||0, hora:pg.hora||'', origemTipo:'receber', origemId:c.id, pagIndex:i});
    });
  });
  contasPagarState.itens.forEach(c=>{
    (c.pagamentos||[]).forEach((pg,i)=>{
      eventos.push({tipo:'pago', nome:c.fornecedor, data:pg.data||'', forma:pg.forma||'', banco:pg.banco||'', valor:parseFloat(pg.valor)||0, hora:pg.hora||'', origemTipo:'pagar', origemId:c.id, pagIndex:i});
    });
  });
  return eventos;
}
function _chaveEvento(e){ return `${e.origemTipo}:${e.origemId}:${e.pagIndex}`; }
function _eventosPagamentoFiltrados(){
  const {dataDe:de, dataAte:ate, banco} = pagosState;
  return _eventosPagamento()
    .filter(e=>_dentroPeriodo(e.data, de, ate))
    .filter(e=>!banco || e.banco===banco)
    .sort((a,b)=>(a.data||'').localeCompare(b.data||'') || (a.hora||'').localeCompare(b.hora||''));
}

          <label>Até</label>
          <input type="date" id="pagos-data-ate" value="${pagosState.dataAte}" min="${pagosState.dataDe||''}">

      <div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">

// ── Conciliação Bancária com IA ──────────────────────────────────────────────
// Sobe um extrato .ofx do banco e casa cada transação com os pagamentos já
// lançados no sistema (vendas, contas a receber, contas a pagar), usando um
// algoritmo de pontuação por valor + proximidade de data + parecença de texto
// (sem depender de nenhuma API de IA externa — roda 100% no navegador).
// Nada é gravado como conciliado até o usuário revisar e confirmar na tela.
let conciliacaoIAState={
  etapa:'config', // config | revisao | concluido | historico
  banco:'',
  dataDe:'',
  dataAte:'',
  arquivoNome:'',
  transacoes:[],
  pareamentos:[], // {ofx, evento, dias, simTexto, confianca, aceito}
  eventosSemPar:[],
  resumoConfirmado:null,
};
function resetConciliacaoIAState(){
  conciliacaoIAState={etapa:'config',banco:'',dataDe:'',dataAte:'',arquivoNome:'',transacoes:[],pareamentos:[],eventosSemPar:[],resumoConfirmado:null};
}
let conciliacoesConfirmadas=[]; // {chave, banco, dataExtrato, valorExtrato, descricaoExtrato, valorSistema, nomeSistema, confirmadoEm}
async function salvarConciliacoesConfirmadas(){

// ── Parser de extrato .ofx ───────────────────────────────────────────────────
// OFX antigo (SGML) não fecha as tags de valor (ex.: <TRNAMT>-62.00 sem
// </TRNAMT>), só as de bloco (<STMTTRN>...</STMTTRN> sempre fecham). Por isso
// pegamos cada bloco STMTTRN inteiro e, dentro dele, lemos cada tag até a
// próxima tag ou fim de linha — funciona tanto no formato antigo quanto no
// OFX 2.x (XML), que fecha tudo normalmente.
function parseOFX(texto){
  const blocos=[...texto.matchAll(/<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi)].map(m=>m[1]);
  const pegar=(bloco,tag)=>{ const m=bloco.match(new RegExp(`<${tag}>([^<\\r\\n]*)`,'i')); return m?m[1].trim():''; };
  return blocos.map(b=>{
    const dt=pegar(b,'DTPOSTED');
    const iso=dt.length>=8?`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`:'';
    const amt=parseFloat(pegar(b,'TRNAMT').replace(',','.'))||0;
    return{
      data:iso,
      valor:+Math.abs(amt).toFixed(2),
      tipo:amt>=0?'recebido':'pago',
      descricao:pegar(b,'MEMO')||pegar(b,'NAME')||pegar(b,'PAYEE')||'',
      fitid:pegar(b,'FITID')||'',
    };
  }).filter(t=>t.data && t.valor>0.009);
}

// ── Motor de matching heurístico ("IA" sem custo/API externa) ───────────────
// Pontua cada par transação-do-extrato × lançamento-do-sistema por: valor
// (tem que ser praticamente igual), proximidade da data (compensação bancária
// costuma atrasar alguns dias) e parecença de texto entre o nome do cliente/
// fornecedor no sistema e o histórico/memo do banco. Só marca "alta confiança"
// (pré-selecionado) quando a data bate exatamente ou é muito próxima e ainda
// tem alguma parecença de texto — o resto fica como sugestão pro usuário decidir.
function similaridadeTexto(a,b){
  const wa=new Set(normalizarTexto(a).split(/\s+/).filter(w=>w.length>2));
  const wb=new Set(normalizarTexto(b).split(/\s+/).filter(w=>w.length>2));
  if(!wa.size||!wb.size) return 0;
  let inter=0; wa.forEach(w=>{ if(wb.has(w)) inter++; });
  return inter/Math.max(wa.size,wb.size);
}
function diasEntreISO(iso1,iso2){
  if(!iso1||!iso2) return 999;
  return Math.round(Math.abs((new Date(iso1+'T12:00:00') - new Date(iso2+'T12:00:00'))/86400000));
}
function conciliarTransacoesOFX(transacoes, eventos){
  const usados=new Set();
  const pareamentos=[];
  transacoes.forEach(t=>{
    let melhor=null, melhorScore=-1;
    eventos.forEach((e,idx)=>{
      if(usados.has(idx)) return;
      if(e.tipo!==t.tipo) return;
      const diffValor=Math.abs(e.valor-t.valor);
      if(diffValor>0.02) return; // valor tem que bater (tolerância de centavo de arredondamento)
      const dias=diasEntreISO(e.data,t.data);
      if(dias>5) return; // além de 5 dias não é compensação, é outra coisa
      const simTexto=similaridadeTexto(e.nome, t.descricao);
      const score=(5-Math.min(dias,5))*2 + simTexto*3;
      if(score>melhorScore){ melhorScore=score; melhor={evento:e, idx, dias, simTexto}; }
    });
    if(melhor){
      usados.add(melhor.idx);
      const altaConfianca=melhor.dias<=1 || (melhor.dias<=2 && melhor.simTexto>0.15);
      pareamentos.push({ofx:t, evento:melhor.evento, dias:melhor.dias, simTexto:melhor.simTexto, confianca:altaConfianca?'alta':'media', aceito:altaConfianca});
    } else {
      pareamentos.push({ofx:t, evento:null, dias:null, simTexto:0, confianca:'sem-par', aceito:false});
    }
  });
  const eventosSemPar=eventos.filter((e,idx)=>!usados.has(idx));
  return {pareamentos, eventosSemPar};
}

  }
  const done=ROTA_MOTORISTA.lojas.filter(l=>motorState.checkins[l.id]?.done).length;

  const prox=ROTA_MOTORISTA.lojas.find(l=>!motorState.checkins[l.id]?.done);

        <div style="padding-top:4px"><strong style="font-size:13px;display:block">Base — Osasco</strong><span style="font-size:11px;color:var(--text2)">CEP 06233-040 · Partida</span></div>
      </div>

        return `<div style="display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border-light)">
          <div style="width:30px;height:30px;border-radius:50%;background:${done2?'var(--green)':isProx?'var(--blue-bg)':'var(--bg)'};border:${isProx?'2px solid var(--blue)':done2?'none':'1px solid var(--border)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;color:${done2?'#fff':isProx?'var(--blue)':'var(--text2)'}">

          <div style="flex:1;padding-top:3px;min-width:0">
            <strong style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.nome}</strong>
            <span style="font-size:11px;color:var(--text2)">${l.cidade}</span>
            ${done2?`<div style="font-size:11px;color:var(--green);margin-top:3px">✓ Coletado às ${ci.hora}</div>`:''}
            ${isProx&&motorState.viagemIniciada?`<button class="btn btn-primary btn-sm" id="btn-checkin-${l.id}" style="margin-top:6px"><i class="ti ti-clipboard-check"></i> Fazer check-in</button>`:''}

      <div style="display:flex;gap:10px;padding:10px 12px;background:var(--bg)">
        <div style="width:30px;height:30px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff"><i class="ti ti-home" style="font-size:13px"></i></div>
        <div style="flex:1;padding-top:4px"><strong style="font-size:13px;display:block">Retorno — Base Osasco</strong></div>
        <span style="font-size:11px;padding:2px 7px;border-radius:20px;background:var(--orange-bg);color:var(--orange);align-self:flex-start;flex-shrink:0;margin-top:4px">${ROTA_MOTORISTA.distVolta} km</span>

          <div style="height:8px;border-radius:20px;background:${cor};width:${pctOcup}%"></div>

        <div style="font-size:10px;color:${cor};font-weight:600;text-align:right;margin-top:3px">${pctOcup}% do baú ocupado</div>
      </div>`;
    })()}

  document.getElementById('btn-iniciar-viagem')?.addEventListener('click',()=>{

    ROTA_MOTORISTA.status='em_rota';
    ROTA_MOTORISTA.iniciadaEm=new Date().toISOString();

  });

    ROTA_MOTORISTA.status='aguardando_conferencia';

    document.getElementById(`btn-checkin-${l.id}`)?.addEventListener('click',()=>renderCheckinModal(l.id));
  });

// ── MOTORISTA: Check-in modal ─────────────────────────────────────────────────
let ciLoja=null,ciEtapa=1,ciFotos={},ciItens={},ciNF=null,ciResp='',ciSigned=false;
const ITENS_CI=[{id:'pneus_passeio',nome:'Pneus passeio',un:'un'},{id:'pneus_estourado',nome:'Pneus estourado',un:'un'},{id:'amortecedor',nome:'Amortecedor',un:'un'},{id:'bandeja',nome:'Bandeja',un:'un'},{id:'disco',nome:'Disco',un:'un'},{id:'filtro_oleo',nome:'Filtro óleo',un:'kg'},{id:'frascos_oleo',nome:'Frascos óleo',un:'un'},{id:'mola',nome:'Mola',un:'un'},{id:'papelao',nome:'Papelão',un:'kg'},{id:'pastilha',nome:'Pastilha',un:'un'},{id:'plasticos',nome:'Plásticos',un:'kg'},{id:'roda',nome:'Roda',un:'un'},{id:'sucata',nome:'Sucata ferrosa',un:'kg'}];

// ── Volumes m³ por item (editável em Cadastros) ───────────────────────────────
let VOLUMES_M3 = {
  pneus_passeio:  0.05,
  pneus_estourado:0.05,
  amortecedor:    0.02,
  bandeja:        0.01,
  disco:          0.01,
  filtro_oleo:    0.00, // por kg — não computa volume
  frascos_oleo:   0.00,
  mola:           0.01,
  papelao:        0.00, // por kg — não computa volume
  pastilha:       0.00,
  plasticos:      0.00, // por kg — não computa volume
  roda:           0.04,
  sucata:         0.00, // por kg — não computa volume
};

// ── Capacidade do baú por veículo m³ (editável em Cadastros) ─────────────────
let CAPACIDADE_BAU = {
  'FPW-9J58': 45,
  'DEU-8A98': 40,
  'GGA-0262': 50,
  'EEK-1A92': 18,
  'TJX-4G17': 55,
  'FNY-0G23': 18,
};

// Calcula m³ ocupado de um objeto {id: quantidade}
function calcM3(itens){
  return Object.entries(itens||{}).reduce((s,[id,qtd])=>{
    return s + (VOLUMES_M3[id]||0) * (parseFloat(qtd)||0);
  }, 0);
}

// Calcula m³ acumulado de todas as lojas já coletadas numa rota
function calcM3Rota(rota){
  return (rota?.lojas||[]).reduce((s,l)=>s+calcM3(l.itens||{}),0);
}

function renderCheckinModal(lojaId){
  sincronizarViagemMotorista();
  ciLoja=ROTA_MOTORISTA?.lojas?.find(l=>l.id===lojaId);
  if(!ciLoja) return;
  ciEtapa=1;ciFotos={};ciItens={};ciNF=null;ciResp='';ciSigned=false;
  renderCI();
}

  let body='';
  if(ciEtapa===1) body=`
    <div class="card" style="margin-bottom:12px">
      <div class="fin-row"><span class="fl">Data</span><span class="fv">${today()}</span></div>
      <div class="fin-row"><span class="fl">Horário chegada</span><span class="fv">${now()}</span></div>
      <div class="fin-row"><span class="fl">Loja</span><span class="fv">${ciLoja.nome}</span></div>

function attachSig(){
  const c=document.getElementById('sig-canvas');if(!c||sigCtx)return;
  sigCtx=c.getContext('2d');sigCtx.strokeStyle='#1A5FA8';sigCtx.lineWidth=2.5;sigCtx.lineCap='round';
  const pos=(e)=>{const r=c.getBoundingClientRect();const s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*(c.width/r.width),y:(s.clientY-r.top)*(c.height/r.height)};};
  c.addEventListener('mousedown',e=>{drawing=true;const p=pos(e);lx=p.x;ly=p.y;});
  c.addEventListener('mousemove',e=>{if(!drawing)return;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(lx,ly);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();lx=p.x;ly=p.y;ciSigned=true;});
  c.addEventListener('mouseup',()=>drawing=false);
  c.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=pos(e);lx=p.x;ly=p.y;},{passive:false});
  c.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(lx,ly);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();lx=p.x;ly=p.y;ciSigned=true;},{passive:false});
  c.addEventListener('touchend',()=>drawing=false);
}

function renderMotoristaHist(){
  const nome=usuarioAtual?.nome||'';
  const agora=new Date();
  const minhasViagens=(rotState.rotasSalvas||[])
    .filter(r=>nomesIguais(r.motoristaNome,nome) && r.finalizadaEm)
    .sort((a,b)=>new Date(b.finalizadaEm)-new Date(a.finalizadaEm));
  const doMes=minhasViagens.filter(r=>{
    const d=new Date(r.finalizadaEm);
    return d.getMonth()===agora.getMonth() && d.getFullYear()===agora.getFullYear();
  });
  const pneusMes=doMes.reduce((s,r)=>s+totalPneusRota(r),0);
  document.getElementById('content-area').innerHTML=`
    ${btnBack()}
    <div class="mod-header"><div class="mod-header-icon laranja"><i class="ti ti-history"></i></div><div><h2>Histórico</h2><span>Viagens anteriores</span></div></div>

      <div class="stat-box verde"><div class="sv">${pneusMes.toLocaleString('pt-BR')}</div><div class="sl">Pneus coletados</div></div>
    </div>
    ${minhasViagens.length===0?`<div class="empty"><i class="ti ti-history-toggle"></i><p>Nenhuma viagem finalizada ainda.</p></div>`:''}
    ${minhasViagens.map(r=>`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <strong style="font-size:14px">${r.nome}</strong>
        <span class="badge verde">Concluída</span>
      </div>
      <div style="font-size:13px;color:var(--text2)">${new Date(r.finalizadaEm).toLocaleDateString('pt-BR')} · ${totalPneusRota(r)} pneus · ~${Math.round(r.kmTotal)} km</div>

  bindBack();
}

function renderConferenciaNotas(camId){
  const cam=CAMINHOES_CONF.find(c=>c.id===camId);
  if(!confState.conferencias[camId]){

    cam.lojas.forEach(l=>{confState.conferencias[camId][l.nome]={fechada:false,itens:{},aberta:false};});
  }
  const conf=confState.conferencias[camId];
  const fechadas=Object.values(conf).filter(c=>c.fechada).length;
  const todas=fechadas===cam.lojas.length;
  document.getElementById('content-area').innerHTML=`
    <button class="btn btn-secondary btn-sm" id="btn-back-conf" style="margin-bottom:1rem"><i class="ti ti-arrow-left"></i> Caminhões</button>

    ${cam.lojas.map(l=>{
      const lConf=conf[l.nome];
      const pneusMot=l.pneus;

      return `<div style="border:1.5px solid ${lConf.fechada?'var(--green)':'var(--border)'};border-radius:var(--radius);overflow:hidden;margin-bottom:8px">

            <span style="font-size:11px;color:var(--text2)">${l.marca} · Motorista lançou: ${pneusMot} pneus</span>
            ${lConf.fechada?`<div style="font-size:11px;color:var(--green);margin-top:2px">✓ Conferido</div>`:''}

          ${!lConf.fechada?`<button class="btn btn-primary btn-sm" id="btn-conferir-${l.nome.replace(/\s/g,'_')}">Conferir</button>`:''}
          <i class="ti ti-chevron-${isOpen?'up':'down'}" style="font-size:14px;color:var(--text2)"></i>
        </div>

          <table class="conf-table" style="width:100%">
            <thead><tr><th style="text-align:left">Item</th><th>Motorista</th><th>Conferido</th></tr></thead>
            <tbody>
              ${ITENS_CI.map(it=>{
                // Antes era um número aleatório (Math.random) — agora usa o
                // que o motorista realmente lançou no check-in dessa loja.
                const qMot=parseInt(motorState.checkins[l.id]?.itens?.[it.id])||0;
                const qConf=lConf.itens[it.id]||'';
                const diverge=qConf!==''&&parseInt(qConf)!==qMot;

    // render (que recalcula CAMINHOES_CONF do zero a partir das rotas salvas).
    const rota=rotState.rotasSalvas.find(r=>r.id===camId);

}

    triagemState.salvas[lojaId]={grade:triagemGrade[lojaId],confirmadoEm:new Date().toISOString(),loja:loja.nome,placa:cam.placa,totalPneus:totalLoja,camId};

      if(todasTriadas) rota.status='triado';
      salvarRotasSalvas();

    sincronizarCaminhoesConf();
    mostrarToast('Triagem da loja confirmada!'+(pctLixo>=(window.wppCfg?.limiteTriagem||30)?' Alerta WhatsApp enviado ('+pctLixo+'% lixo).':''),'sucesso');
    renderTriagemLojas(camId);
  });
}

// ── Custos de coleta por rede (com vigência/contrato) ───────────────────────
// Estrutura: { 'CAMPNEUS': [ {id, vigenciaInicio:'YYYY-MM-DD', vigenciaFim:'YYYY-MM-DD'|'', custos:{itemId:valor}} ], ... }
let CUSTOS_REDE={};
async function salvarCustosRede(){ try{ await window.storage?.set('cad_custos_rede', JSON.stringify(CUSTOS_REDE)); }catch(e){console.warn('salvarCustosRede',e);} }
function vigenciaStatus(v){
  const hoje=new Date().toISOString().slice(0,10);
  if(v.vigenciaInicio&&hoje<v.vigenciaInicio) return {status:'futura',label:'Futura'};
  if(v.vigenciaFim&&hoje>v.vigenciaFim) return {status:'expirada',label:'Expirada'};
  return {status:'vigente',label:'Vigente agora'};
}
function custoVigenteRede(rede,dataISO){
  const lista=CUSTOS_REDE[rede]||[];
  const validas=lista.filter(v=>v.vigenciaInicio&&dataISO>=v.vigenciaInicio&&(!v.vigenciaFim||dataISO<=v.vigenciaFim));
  if(!validas.length)return null;
  return validas.sort((a,b)=>b.vigenciaInicio.localeCompare(a.vigenciaInicio))[0];
}
// Gera automaticamente uma conta a pagar (no mesmo sistema de Contas a Pagar do Financeiro)
// a partir dos itens coletados num check-in, usando a vigência de custo ativa da rede da loja.
async function gerarContaPagarCheckin(loja,itens){
  if(!loja)return;
  const rede=loja.rede||loja.marca||'';
  const agora=new Date();
  const dataISO=agora.toISOString().slice(0,10);
  const vig=rede?custoVigenteRede(rede,dataISO):null;
  let valor=0;
  if(vig){
    Object.keys(itens||{}).forEach(itemId=>{
      const qtd=parseFloat(itens[itemId])||0;
      const custoUnit=vig.custos?.[itemId]||0;
      valor+=qtd*custoUnit;
    });
  }
  const vencDate=new Date(agora); vencDate.setDate(vencDate.getDate()+30);
  const vencISO=vencDate.toISOString().slice(0,10);
  const semTabela=!vig||!rede;
  contasPagarState.itens.push({
    id:'cp'+Date.now(),
    fornecedor:loja.nome+(rede?` (${rede})`:'')+(semTabela?' ⚠️ sem tabela de custo':''),
    valor:Math.round(valor*100)/100,
    vencimento:fmtDataBr(vencISO),vencISO,
    contaId:'pc8', // "Compra de pneus / insumos" no plano de contas padrão
    pagamentos:[],
    origem:'coleta',rede,loja:loja.nome,lojaId:loja.id,
    dataColeta:fmtDataBr(dataISO),dataColetaISO:dataISO,
    itensColetados:{...itens},
    semTabela,
  });
  await salvarContasPagar();
}

function totalVnd(){return Object.values(vndQtds).reduce((s,v)=>s+(parseInt(v)||0),0);}
function valorVnd(){
  const cad=vndCad[vendasState.cliSel?.id];if(!cad)return 0;
  if(cad.tipo==='medidas'){
    let t=0;
    Object.entries(cad.tabela).forEach(([aro,meds])=>{meds.forEach((m,i)=>{t+=(parseInt(vndQtds[`${aro}|${i}`])||0)*m.p;});});
    return t;
  }
  return AROS_PADRAO.reduce((s,a)=>s+(parseInt(vndQtds[a])||0)*(parseFloat(cad.precos?.[a])||0),0);
}
const AROS_PADRAO=['13','14','15','16','17','SUV','Camionete','Caminhão'];

}

    vendasState.tela='confirmado';renderVendasConfirmado();
  });

      <div class="fin-row" style="font-size:16px"><span class="fl">Valor</span><span class="fv" style="color:var(--teal)">${fmtM(v.valor)}</span></div>

    </div>
    <div class="section-title">Resumo do mix de venda</div>
    <div class="card">
      ${mix.length?mix.map(m=>`<div class="fin-row">
        <span class="fl">Aro ${m.aro}${m.limite!=null?` <span style="color:var(--text3);font-size:11px">(limite ${m.limite}%)</span>`:''}</span>
        <span class="fv" style="color:${m.excedeu?'var(--red)':'var(--text)'}">${m.qtd} un · ${m.pct}%${m.excedeu?' ⚠️':''}</span>
      </div>`).join(''):'<p class="dash-date">Sem itens no mix.</p>'}
    </div>
    ${v.foto?`<div id="foto-confirmado-preview" style="margin-bottom:1rem"><p style="font-size:11px;color:var(--text2);text-align:center">Carregando foto...</p></div>`:''}
    <div style="background:var(--teal-bg);border:1px solid var(--teal-light);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:10px;font-size:13px;color:var(--teal)">
      <i class="ti ti-info-circle" style="margin-right:5px"></i>Se houver devolução no futuro, acesse o <strong>Histórico</strong> e toque nesta venda. O valor já aparece no módulo <strong>Financeiro</strong>.
    </div>
    <button class="btn btn-secondary btn-block" id="btn-imprimir-pedido" style="font-size:15px;padding:13px;margin-bottom:8px"><i class="ti ti-printer"></i> Imprimir pedido de venda</button>

    });

    const cli=CLIENTES_VND.find(c=>c.id===v.cliId)||CLIENTES_VND.find(c=>c.nome===v.cliente);
    nfForm={
      ...nfForm,
      cliente:v.cliente,
      cnpjTomador:cli?.cnpj||'',

}

// ── Mix helpers ───────────────────────────────────────────────────────────────
// ── Regra de mix de venda (limites recomendados por aro, sobre o total de pneus) ──
// Aro 13 e 14 têm limite de participação no mix; os demais aros são livres.
// A regra é apenas um alerta (não bloqueia a venda). Limites configuráveis em Alertas → Alertas.
function checarRegraMix(qtds){
  const mix=calcMixVnd(qtds);
  const limites={'13':window.wppCfg?.limiteMixAro13??20,'14':window.wppCfg?.limiteMixAro14??30};
  return mix.map(m=>{
    const limite=limites[m.aro]??null;
    return {...m,limite,excedeu:limite!=null&&m.pct>limite};
  });
}
// Itens de uma venda no nível de detalhe original — por MEDIDA específica quando o
// cliente usa tabela detalhada por medida, por ARO quando usa tabela simples por aro.
// Usado na devolução: agregar tudo por aro (como fazia antes) perdia a medida
// específica devolvida sempre que o cliente tinha preços diferentes por medida no
// mesmo aro, o que tornava o crédito calculado impreciso.
function itensDetalheVnd(v){
  const cad=vndCad[v.cliId];
  const qtds=v.qtds||{};
  return Object.entries(qtds)
    .filter(([,q])=>(parseInt(q)||0)>0)
    .map(([key,q])=>{
      const qtd=parseInt(q)||0;
      if(key.includes('|')){
        const[aro,idx]=key.split('|');
        const nomeMedida=cad?.tabela?.[aro]?.[parseInt(idx)]?.m||MEDIDAS[aro]?.[parseInt(idx)]||'';
        const preco=cad?.tabela?.[aro]?.[parseInt(idx)]?.p||0;
        return{key,aro,label:nomeMedida?`Aro ${aro} — ${nomeMedida}`:`Aro ${aro}`,qtd,preco};
      } else {
        const preco=parseFloat(cad?.precos?.[key])||0;
        return{key,aro:key,label:`Aro ${key}`,qtd,preco};
      }
    })
    .sort((a,b)=>a.aro.localeCompare(b.aro,undefined,{numeric:true})||a.label.localeCompare(b.label));
}
function calcMixVnd(qtds){
  const porAro={};
  Object.entries(qtds||{}).forEach(([k,v])=>{
    const aro=k.includes('|')?k.split('|')[0]:k;
    porAro[aro]=(porAro[aro]||0)+(parseInt(v)||0);
  });
  const total=Object.values(porAro).reduce((s,v)=>s+v,0);
  return Object.entries(porAro).filter(([,q])=>q>0)
    .map(([aro,qtd])=>({aro,qtd,pct:total?Math.round(qtd/total*100):0}))
    .sort((a,b)=>b.qtd-a.qtd);
}

function calcValorDevVnd(v,qtdsDev){
  if(!qtdsDev)return 0;
  const cad=vndCad[v.cliId];if(!cad)return 0;
  let tot=0;
  if(cad.tipo==='medidas'){
    Object.entries(qtdsDev).forEach(([k,qtd])=>{
      const[aro,idx]=k.split('|');
      const preco=cad.tabela?.[aro]?.[parseInt(idx)]?.p||0;
      tot+=qtd*preco;
    });
  } else {
    Object.entries(qtdsDev).forEach(([aro,qtd])=>{
      tot+=qtd*(parseFloat(cad.precos?.[aro])||0);
    });
  }
  return tot;
}

function arrayBufferParaBase64(buf){
  let binary='';
  const bytes=new Uint8Array(buf);
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}

// ── Parsers tolerantes a formato brasileiro (vírgula decimal, datas DD/MM/AAAA) ──
function parseValorBR(v){
  if(v==null||v==='')return NaN;
  if(typeof v==='number')return v;
  let s=String(v).trim().replace(/^R\$\s?/i,'');
  // Se tem vírgula E ponto, assume ponto como separador de milhar (padrão BR: 1.234,56)
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s);
  return isNaN(n)?NaN:n;
}
function parseDataBR(v){
  if(v==null||v==='')return null;
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/); // DD/MM/AAAA
  if(m){
    let[,d,mo,y]=m; if(y.length===2)y='20'+y;
    return{iso:`${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`,br:`${d.padStart(2,'0')}/${mo.padStart(2,'0')}/${y}`};
  }
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); // AAAA-MM-DD
  if(m){
    let[,y,mo,d]=m;
    return{iso:`${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`,br:`${d.padStart(2,'0')}/${mo.padStart(2,'0')}/${y}`};
  }
  // Serial de data do Excel (número de dias desde 1899-12-30)
  if(/^\d+$/.test(s)){
    const dt=new Date(Date.UTC(1899,11,30)+parseInt(s)*86400000);
    const y=dt.getUTCFullYear(),mo=String(dt.getUTCMonth()+1).padStart(2,'0'),d=String(dt.getUTCDate()).padStart(2,'0');
    return{iso:`${y}-${mo}-${d}`,br:`${d}/${mo}/${y}`};
  }
  return null;
}
function matchFormaPagamento(v){
  if(!v)return'';
  const s=String(v).trim().toLowerCase();
  const achado=PAGS.find(p=>p.nome.toLowerCase()===s||p.id===s||s.includes(p.id)||p.nome.toLowerCase().includes(s));
  return achado?achado.nome:String(v).trim();
}
function normalizarTexto(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
// ── Situação da conta na importação: cada valor do sistema antigo (ex.: Sygecom)
// diz pra qual lado vai (a pagar/a receber) e se já está liquidada. Sem isso a
// importação não tinha como saber a diferença e caía tudo pro mesmo lugar.
const STATUS_CONTA_IMPORT={
  'pago':{direcao:'pagar', pago:true},
  'a pagar':{direcao:'pagar', pago:false},
  'recebido':{direcao:'receber', pago:true},
  'a receber':{direcao:'receber', pago:false},
  'recebido-dev':{direcao:'receber', pago:true},
  'recebido dev':{direcao:'receber', pago:true},
};
function interpretarSituacaoConta(v){
  const s=normalizarTexto(v);
  if(!s) return null;
  if(STATUS_CONTA_IMPORT[s]) return STATUS_CONTA_IMPORT[s];
  // fallback por palavra-chave, pra planilhas de outros sistemas com texto parecido
  if(s.includes('receb')) return{direcao:'receber', pago:!s.includes('a receber')&&!s.startsWith('a ')};
  if(s.includes('pag')) return{direcao:'pagar', pago:!s.includes('a pagar')&&!s.startsWith('a ')};
  return null;
}
// ── Aliases de auto-detecção — cada campo tem palavras-chave (em ordem de prioridade)
// e palavras que DESQUALIFICAM uma coluna (para não confundir "Valor NF" com "Valor Pago", por ex.)
const IMPORT_ALIASES={
  cliente:{inclui:['cliente','razaosocial','nomecliente','nome'],exclui:[]},
  data:{inclui:['datavenda','dataemissao','datanf','data'],exclui:['pgto','pagamento','vencimento']},
  valor:{inclui:['valornf','totalnf','valortotal','valor'],exclui:['pago','saldo','peso']},
  numeroNF:{inclui:['numeronf','notafiscal','numeronota','nnf','nf'],exclui:['valor','total']},
  numeroBoleto:{inclui:['numeroboleto','nboleto','documento','boleto'],exclui:[]},
  valorPago:{inclui:['valorpago','pago'],exclui:['saldo']},
  dataPagamento:{inclui:['datapgto','datapagamento','pagto'],exclui:['forma']},
  dataLancamento:{inclui:['datalancamento','dtlancamento','lancamento'],exclui:['tipo','status','usuario']},
  pagamento:{inclui:['formapagamento','condpagamento','condicao','pagamento'],exclui:['valor','data']},
  situacao:{inclui:['tiplancto','situacao','status'],exclui:[]},
  banco:{inclui:['banco'],exclui:['codbanco']},
  pneus:{inclui:['pneus','quantidade','qtd'],exclui:['peso']},
  filial:{inclui:['filial','loja','unidade'],exclui:[]},
  endereco:{inclui:['enderecocompleto','endereco','logradouro','rua'],exclui:[]},
  vencimento:{inclui:['vencimento'],exclui:[]},
  tipo:{inclui:['tipo'],exclui:[]},
  nome:{inclui:['nomeloja','razaosocial','loja','fornecedor','cliente','nome'],exclui:[]},
  cidade:{inclui:['cidade','municipio'],exclui:[]},
  uf:{inclui:['uf','estado'],exclui:[]},
  cep:{inclui:['cep'],exclui:[]},
  ciclo:{inclui:['ciclo','periodicidade','frequencia'],exclui:[]},
  ultimaColeta:{inclui:['ultimacoleta','dataultimacoleta','ultimavisita'],exclui:[]},
  rede:{inclui:['rede','bandeira','marca'],exclui:[]},
  codLoja:{inclui:['codloja','codigoloja','coddaloja','codigo'],exclui:[]},
  observacao:{inclui:['observacao','obs','notas'],exclui:[]},
  cnpj:{inclui:['cnpj','cpfcnpj'],exclui:[]},
  email:{inclui:['email','emailparanf','e-mail'],exclui:[]},
};
function autoMapearColuna(headers,campoId){
  const aliases=IMPORT_ALIASES[campoId];
  if(!aliases)return -1;
  for(const kw of aliases.inclui){
    const idx=headers.findIndex(h=>{
      const hs=h.replace(/\s/g,'');
      if(!hs.includes(kw))return false;
      return !aliases.exclui.some(ex=>hs.includes(ex));
    });
    if(idx>=0)return idx;
  }
  return -1;
}

// Converte as linhas brutas em registros prontos para o campo escolhido, com validação
// Converte as linhas brutas em registros prontos para o campo escolhido, com validação.
// Detecta duplicados tanto contra o que já existe no sistema quanto duplicidade dentro do
// próprio arquivo (a mesma linha exportada 2x): usa nº de documento (NF/boleto) quando
// disponível e, na ausência dele, uma chave composta (cliente + data + valor) como
// identificador — assim uma planilha sem número de documento também é protegida.
function processarLinhasImport(){
  const s=importState;
  const dados=s.linhas.slice(1); // pula cabeçalho
  const registros=[],erros=[],duplicados=[];
  const substituir=s.duplicadosSubstituir||new Set();

  // Mapa chave -> registro já existente no sistema (permite excluir e substituir depois)
  const existentesPorChave=new Map();
  if(s.tipo==='vendas'){
    vendasState.historico.forEach(v=>{
      const chave=v.numeroNF||v.numeroBoleto||`${normalizarTexto(v.cliente)}|${v.dataISO||''}|${(parseFloat(v.valor)||0).toFixed(2)}`;
      if(!existentesPorChave.has(chave)) existentesPorChave.set(chave, v);
    });
  } else if(s.tipo==='contas'){
    // Uma chave só, olhando pras duas listas (contas a receber E a pagar) — um
    // nº de documento não se repete entre as duas, então dá pra combinar sem risco.
    CONTAS_RECEBER.forEach(c=>{
      const chave=c.numeroBoleto||`${normalizarTexto(c.cliente)}|${vencimentoISOConta(c)}|${(parseFloat(c.valor)||0).toFixed(2)}`;
      if(!existentesPorChave.has(chave)) existentesPorChave.set(chave, c);
    });
    contasPagarState.itens.forEach(c=>{
      const chave=c.numeroBoleto||`${normalizarTexto(c.fornecedor)}|${vencimentoISOConta(c)}|${(parseFloat(c.valor)||0).toFixed(2)}`;
      if(!existentesPorChave.has(chave)) existentesPorChave.set(chave, c);
    });
  } else if(s.tipo==='fornecedores'){
    FORNS_ROT.forEach(f=>{
      const chave=`${normalizarTexto(f.nome)}|${normalizarTexto(f.cidade)}`;
      if(!existentesPorChave.has(chave)) existentesPorChave.set(chave, f);
    });
  } else if(s.tipo==='clientes'){
    CLIENTES_VND.forEach(c=>{
      const chave=normalizarTexto(c.nome);
      if(!existentesPorChave.has(chave)) existentesPorChave.set(chave, c);
    });
  }
  const chavesVistasNoArquivo=new Set();
  const existentesParaExcluir=[];

  dados.forEach((linha,i)=>{
    const nLinha=i+2; // +2 porque linha 1 é cabeçalho e arrays são 0-indexed
    const get=campo=>{const idx=s.mapeamento[campo];return idx!==undefined?linha[idx]:undefined;};
    if(s.tipo==='vendas'){
      const cliente=String(get('cliente')||'').trim();
      const valor=parseValorBR(get('valor'));
      const dataObj=parseDataBR(get('data'));
      if(!cliente||isNaN(valor)||!dataObj){erros.push({linha:nLinha,motivo:'Cliente, valor ou data inválidos/ausentes'});return;}
      // Valor pago é um campo separado do valor total da NF — só existe pagamento se a planilha
      // trouxer um valor pago > 0. Sem essa checagem, tudo era importado como "pago", o que é errado
      // sempre que o cliente ainda deve (valor pago = 0,00 na planilha original).
      const valorPagoRaw=get('valorPago');
      const valorPago=valorPagoRaw!==undefined?parseValorBR(valorPagoRaw):NaN;
      const houvePagamento=!isNaN(valorPago)&&valorPago>0;
      const dataPagObj=parseDataBR(get('dataPagamento'));
      const formaPag=matchFormaPagamento(get('pagamento'))||'Importado';
      const filial=String(get('filial')||'').trim();
      const numeroNF=String(get('numeroNF')||'').trim();
      const numeroBoletoRaw=String(get('numeroBoleto')||'').trim();
      const numeroBoleto=(numeroBoletoRaw&&numeroBoletoRaw!=='-')?numeroBoletoRaw:'';
      const chave=numeroNF||numeroBoleto||`${normalizarTexto(cliente)}|${dataObj.iso}|${valor.toFixed(2)}`;

      if(chavesVistasNoArquivo.has(chave)){
        duplicados.push({linha:nLinha, chave, cliente, valor, data:dataObj.br, origem:'arquivo', existenteId:null});
        return;
      }
      const existente=existentesPorChave.get(chave);
      if(existente){
        if(!substituir.has(chave)){
          duplicados.push({linha:nLinha, chave, cliente, valor, data:dataObj.br, origem:'existente', existenteId:existente.id});
          return;
        }
        existentesParaExcluir.push(existente.id);
      }
      chavesVistasNoArquivo.add(chave);

      registros.push({
        id:'imp'+Date.now()+i,cliente,cliId:'',pneus:parseInt(get('pneus'))||0,
        pagamento:formaPag,filial,numeroNF,numeroBoleto,
        valor,valorTotal:valor,obs:'Importado do Sygecom',hora:'--:--',
        data:dataObj.br,dataISO:dataObj.iso,
        qtds:{},dev:null,
        pagamentos:houvePagamento?[{valor:valorPago,forma:formaPag,hora:'--:--',data:dataPagObj?.br||''}]:[],
        notasFiscais:numeroNF?[{numero:numeroNF,valor}]:[]
      });
    } else if(s.tipo==='contas'){
      const cliente=String(get('cliente')||'').trim();
      const valor=parseValorBR(get('valor'));
      const vencObj=parseDataBR(get('vencimento'));
      if(!cliente||isNaN(valor)||!vencObj){erros.push({linha:nLinha,motivo:'Cliente/fornecedor, valor ou vencimento inválidos/ausentes'});return;}
      // Situação (Pago/A Pagar/Recebido/A Receber) decide pra qual lado a linha vai e se
      // já está liquidada. Sem coluna de situação mapeada, assume "a receber" em aberto
      // (comportamento antigo, preservado pra planilhas simples que não têm essa coluna).
      const situacaoRaw=get('situacao');
      const situacao=situacaoRaw!==undefined?interpretarSituacaoConta(situacaoRaw):{direcao:'receber',pago:false};
      if(situacaoRaw!==undefined&&!situacao){erros.push({linha:nLinha,motivo:`Situação "${situacaoRaw}" não reconhecida (esperado Pago/A Pagar/Recebido/A Receber)`});return;}
      const direcao=situacao.direcao;
      const formaPag=matchFormaPagamento(get('pagamento'))||'Importado';
      const banco=String(get('banco')||'').trim();
      const numeroBoleto=String(get('numeroBoleto')||'').trim();
      const chave=numeroBoleto||`${normalizarTexto(cliente)}|${vencObj.iso}|${valor.toFixed(2)}`;

      if(chavesVistasNoArquivo.has(chave)){
        duplicados.push({linha:nLinha, chave, cliente, valor, data:vencObj.br, origem:'arquivo', existenteId:null});
        return;
      }
      const existente=existentesPorChave.get(chave);
      if(existente){
        if(!substituir.has(chave)){
          duplicados.push({linha:nLinha, chave, cliente, valor, data:vencObj.br, origem:'existente', existenteId:existente.id});
          return;
        }
        existentesParaExcluir.push(existente.id);
      }
      chavesVistasNoArquivo.add(chave);

      let pagamentos=[];
      if(situacao.pago){
        const dataPagObj=parseDataBR(get('dataPagamento'))||vencObj;
        pagamentos=[{valor,forma:formaPag,banco,hora:'--:--',data:dataPagObj.iso}];
      }
      const dataLancObj=parseDataBR(get('dataLancamento'));
      const base={
        id:(direcao==='pagar'?'impcp':'impcr')+Date.now()+i,
        valor,vencimento:vencObj.br,vencISO:vencObj.iso,
        dataLancamento:dataLancObj?dataLancObj.iso:'',
        numeroBoleto,filial:String(get('filial')||'').trim(),
        contaId:'',pagamentos,
        _direcao:direcao,
      };
      registros.push(direcao==='pagar'
        ?{...base,fornecedor:cliente}
        :{...base,cliente,tipo:formaPag!=='Importado'?formaPag:'Outro'});
    } else if(s.tipo==='fornecedores'){
      const nome=String(get('nome')||'').trim();
      const cidade=String(get('cidade')||'').trim().toUpperCase();
      const uf=String(get('uf')||'').trim().toUpperCase().slice(0,2);
      if(!nome||!cidade||!uf){erros.push({linha:nLinha,motivo:'Loja, cidade ou UF inválidos/ausentes'});return;}
      const chave=`${normalizarTexto(nome)}|${normalizarTexto(cidade)}`;

      if(chavesVistasNoArquivo.has(chave)){
        duplicados.push({linha:nLinha, chave, cliente:nome, valor:0, data:'', origem:'arquivo', existenteId:null});
        return;
      }
      const existente=existentesPorChave.get(chave);
      if(existente){
        if(!substituir.has(chave)){
          duplicados.push({linha:nLinha, chave, cliente:nome, valor:0, data:'', origem:'existente', existenteId:existente.id});
          return;
        }
        existentesParaExcluir.push(existente.id);
      }
      chavesVistasNoArquivo.add(chave);

      const ultimaColetaObj=parseDataBR(get('ultimaColeta'));
      const rede=String(get('rede')||'').trim().toUpperCase();
      registros.push({
        id:'loja'+Date.now()+i,
        nome,cidade,uf,
        rede,marca:inferMarcaCode(rede),
        codLoja:String(get('codLoja')||'').trim().toUpperCase(),
        cep:String(get('cep')||'').trim(),
        endereco:String(get('endereco')||'').trim(),
        observacao:String(get('observacao')||'').trim(),
        uc:ultimaColetaObj?.iso||'',
        ciclo:parseInt(get('ciclo'))||30,
        valor:0,
      });
    } else if(s.tipo==='clientes'){
      const nome=String(get('nome')||'').trim();
      if(!nome){erros.push({linha:nLinha,motivo:'Nome do cliente ausente'});return;}
      const chave=normalizarTexto(nome);

      if(chavesVistasNoArquivo.has(chave)){
        duplicados.push({linha:nLinha, chave, cliente:nome, valor:0, data:'', origem:'arquivo', existenteId:null});
        return;
      }
      const existente=existentesPorChave.get(chave);
      if(existente){
        if(!substituir.has(chave)){
          duplicados.push({linha:nLinha, chave, cliente:nome, valor:0, data:'', origem:'existente', existenteId:existente.id});
          return;
        }
        existentesParaExcluir.push(existente.id);
      }
      chavesVistasNoArquivo.add(chave);

      registros.push({
        id:'cli'+Date.now()+i,
        nome,
        cnpj:String(get('cnpj')||'').trim(),
        endereco:String(get('endereco')||'').trim(),
        email:String(get('email')||'').trim(),
        valor:0,
      });
    }
  });
  return{registros,erros,duplicados,existentesParaExcluir};

}

      ${cl.email?`<div style="font-size:11px;color:var(--text2);margin-top:2px"><i class="ti ti-mail"></i> ${escapeHtml(cl.email)}</div>`:''}
    </div>`).join(''):s.tipo==='contas'?(()=>{
      const receber=registros.filter(c=>c._direcao==='receber').length;
      const pagar=registros.filter(c=>c._direcao==='pagar').length;
      const liquidadas=registros.filter(c=>(c.pagamentos||[]).length>0).length;

      renderImportarDados();
    });
  });
  document.getElementById('imp-confirmar')?.addEventListener('click',async()=>{
    const btn=document.getElementById('imp-confirmar');
    btn.innerHTML='<i class="ti ti-loader-2"></i> Importando...';btn.disabled=true;
    const excluirSet=new Set(existentesParaExcluir);
    if(s.tipo==='vendas'){
      if(excluirSet.size) vendasState.historico=vendasState.historico.filter(v=>!excluirSet.has(v.id));
      vendasState.historico.push(...registros);
      await salvarVendasHistorico();
    } else if(s.tipo==='contas'){
      const registrosReceber=registros.filter(c=>c._direcao==='receber').map(({_direcao,...c})=>c);
      const registrosPagar=registros.filter(c=>c._direcao==='pagar').map(({_direcao,...c})=>c);
      if(excluirSet.size){
        CONTAS_RECEBER=CONTAS_RECEBER.filter(c=>!excluirSet.has(c.id));
        contasPagarState.itens=contasPagarState.itens.filter(c=>!excluirSet.has(c.id));
      }
      CONTAS_RECEBER.push(...registrosReceber);
      contasPagarState.itens.push(...registrosPagar);
      await salvarContasReceber();
      await salvarContasPagar();
    } else if(s.tipo==='fornecedores'){
      if(excluirSet.size){
        for(let idx=FORNS_ROT.length-1; idx>=0; idx--){
          if(excluirSet.has(FORNS_ROT[idx].id)) FORNS_ROT.splice(idx,1);
        }
      }
      FORNS_ROT.push(...registros);
      await salvarLojas();
    } else if(s.tipo==='clientes'){
      if(excluirSet.size){
        for(let idx=CLIENTES_VND.length-1; idx>=0; idx--){
          if(excluirSet.has(CLIENTES_VND[idx].id)) CLIENTES_VND.splice(idx,1);
        }
      }
      CLIENTES_VND.push(...registros);
      await salvarClientesCad();
    }
    importState.resultado={importados:registros.length,ignorados:erros.length,duplicados:duplicados.length,substituidos:existentesParaExcluir.length};
    // Registra este upload no histórico de importações — inclui o arquivo original em
    // base64 (quando guardado) e o detalhe de cada duplicado encontrado, para consulta futura.
    historicoImportacoes.push({
      id:'log'+Date.now(),
      arquivoNome:s.arquivoNome,
      arquivoBase64:s.arquivoBase64||'',
      arquivoMime:s.arquivoMime||'',
      arquivoTamanho:s.arquivoTamanho||0,
      tipo:s.tipo,
      dataHora:new Date().toLocaleString('pt-BR'),
      dataISO:new Date().toISOString(),
      usuario:usuarioAtual?.nome||'—',
      totalLinhas:Math.max(0,s.linhas.length-1),
      importados:registros.length,
      ignorados:erros.length,
      duplicados:duplicados.length,
      substituidos:existentesParaExcluir.length,
      duplicadosDetalhe:duplicados.map(d=>({linha:d.linha,cliente:d.cliente,valor:d.valor,data:d.data,origem:d.origem})),
    });
    await salvarHistoricoImportacoes();
    importState.etapa='concluido';
    renderImportarDados();
  });
}

      ${r.substituidos?`<div class="fin-row"><span class="fl">Substituídos (existente excluído)</span><span class="fv warn">${r.substituidos}</span></div>`:''}
    </div>
    <div class="alert verde"><i class="ti ti-info-circle"></i><p>Os dados já estão salvos e aparecem ${importState.tipo==='vendas'?'no <strong>Histórico de vendas</strong> e no módulo <strong>Financeiro</strong>':importState.tipo==='fornecedores'?'em <strong>Cadastros → Fornecedores</strong>':importState.tipo==='clientes'?'em <strong>Cadastros → Clientes</strong>':'em <strong>Financeiro → Outras contas a receber</strong>'}. Este upload também ficou registrado no <strong>histórico de importações</strong>.</p></div>
    <div style="display:flex;gap:8px;margin-top:.5rem">
      <button class="btn btn-primary" style="flex:1;justify-content:center" id="imp-nova"><i class="ti ti-plus"></i> Importar outro arquivo</button>
      <button class="btn btn-secondary" style="flex:1;justify-content:center" id="imp-ver-historico"><i class="ti ti-history"></i> Ver histórico</button>
    </div>`;
  document.getElementById('btn-back-mod')?.addEventListener('click',renderDashboard);
  document.getElementById('imp-nova')?.addEventListener('click',()=>{resetImportState();renderImportarDados();});
  document.getElementById('imp-ver-historico')?.addEventListener('click',()=>{importState.etapa='historico';renderImportarDados();});
}

function _renderImportHistorico(){
  const itens=[...historicoImportacoes].reverse();
  document.getElementById('content-area').innerHTML=`
    <button class="btn btn-secondary btn-sm" id="imp-hist-voltar" style="margin-bottom:1rem"><i class="ti ti-arrow-left"></i> Voltar</button>
    <div class="mod-header"><div class="mod-header-icon azul"><i class="ti ti-history"></i></div><div><h2>Histórico de importações</h2><span>${itens.length} upload${itens.length!==1?'s':''} registrado${itens.length!==1?'s':''}</span></div></div>
    ${itens.length===0?`<div class="empty"><i class="ti ti-history"></i><p>Nenhuma importação feita ainda.</p></div>`:itens.map(h=>{
      const tipoNome=h.tipo==='vendas'?'Vendas':h.tipo==='fornecedores'?'Fornecedores':h.tipo==='clientes'?'Clientes':'Contas a receber/pagar';
      const dups=h.duplicadosDetalhe||[];
      const dupsExistentes=dups.filter(d=>d.origem==='existente');
      const dupsArquivo=dups.filter(d=>d.origem==='arquivo');
      const tamanhoKb=h.arquivoTamanho?Math.round(h.arquivoTamanho/1024):0;
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="min-width:0">
            <strong style="font-size:14px;display:block;word-break:break-all">${escapeHtml(h.arquivoNome||'(sem nome)')}</strong>
            <span style="font-size:11px;color:var(--text2)">${escapeHtml(h.dataHora||'')} · ${escapeHtml(h.usuario||'—')} · <span class="badge ${h.tipo==='vendas'?'azul':'vermelho'}" style="margin:0">${tipoNome}</span></span>
          </div>
          ${h.arquivoBase64?`<a class="btn btn-secondary btn-sm" style="flex-shrink:0" href="data:${escapeHtml(h.arquivoMime||'application/octet-stream')};base64,${h.arquivoBase64}" download="${escapeHtml(h.arquivoNome||'arquivo')}" title="Baixar arquivo original"><i class="ti ti-download"></i></a>`:`<span class="badge cinza" style="flex-shrink:0" title="Arquivo maior que 3MB ou não guardado">Sem arquivo</span>`}
        </div>
        <div class="fin-row"><span class="fl">Linhas no arquivo</span><span class="fv">${h.totalLinhas||0}</span></div>
        <div class="fin-row"><span class="fl">Importados</span><span class="fv pos">${h.importados||0}</span></div>
        <div class="fin-row"><span class="fl">Ignorados (erro)</span><span class="fv ${h.ignorados?'neg':''}">${h.ignorados||0}</span></div>
        <div class="fin-row"><span class="fl">Duplicados</span><span class="fv ${h.duplicados?'warn':''}">${h.duplicados||0}</span></div>
        ${h.substituidos?`<div class="fin-row"><span class="fl">Substituídos</span><span class="fv warn">${h.substituidos}</span></div>`:''}
        ${tamanhoKb?`<div style="font-size:11px;color:var(--text3);margin-top:4px">Arquivo original: ${tamanhoKb} KB</div>`:''}
        ${dups.length?`<details style="margin-top:8px">
          <summary style="font-size:12px;color:var(--blue);cursor:pointer">Ver ${dups.length} duplicado${dups.length!==1?'s':''} encontrado${dups.length!==1?'s':''}</summary>
          <div style="margin-top:6px">
            ${dupsExistentes.length?`<div style="font-size:11px;color:var(--text2);margin-bottom:4px">Já existiam no sistema:</div>${dupsExistentes.map(d=>`<div style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--border-light)">Linha ${d.linha} · ${escapeHtml(d.cliente)} · ${fmtM(d.valor)} · ${escapeHtml(d.data)}</div>`).join('')}`:''}
            ${dupsArquivo.length?`<div style="font-size:11px;color:var(--text2);margin:6px 0 4px">Repetidos dentro do próprio arquivo:</div>${dupsArquivo.map(d=>`<div style="font-size:12px;padding:4px 0;border-bottom:1px solid var(--border-light)">Linha ${d.linha} · ${escapeHtml(d.cliente)} · ${fmtM(d.valor)} · ${escapeHtml(d.data)}</div>`).join('')}`:''}
          </div>
        </details>`:''}
      </div>`;
    }).join('')}
  `;
  document.getElementById('imp-hist-voltar')?.addEventListener('click',()=>{importState.etapa='tipo';renderImportarDados();});
}


</script>
<script>
// ── Backend de alertas WhatsApp (Z-API) — persistido via window.storage ──────
window.wppCfg = {
  instanceId:'', instanceToken:'', clientToken:'', grupoId:'',
  ativoCheckin:true, ativoTriagem:true, limiteCheckin:30, limiteTriagem:30,
  limiteMixAro13:20, limiteMixAro14:30,
  emailPublicKey:'', emailServiceId:'', emailTemplateId:'', emailGestorTyre:'', emailAtivo:true,
  msgCheckin:'🚚 *Alerta — Check-in {loja}*\n\nRota: {rota}\nMotorista: {motorista}\nPlaca: {placa}\n\nTotal coletado: *{total}* pneus\nEstourados: *{estourados}* ({pct}%)\n\n_Limite configurado: {limite}%_\n_{hora}_',
  msgTriagem:'🔴 *Alerta — Triagem {placa}*\n\nMotorista: {motorista}\nTotal triado: *{total}* pneus\nLixo: *{lixo}* ({pct}%)\n\n_Limite configurado: {limite}%_\n_{hora}_',
};
window.wppLog = [];

// E-mail de contato por rede (portal de coleta) — { 'CAMPNEUS': {email:'...'}, ... }
let REDES_CONTATO = {};
async function salvarRedesContato(){
  try{ await window.storage?.set('redes_contato', JSON.stringify(REDES_CONTATO)); }catch(e){console.warn('salvarRedesContato',e);}
}
async function carregarRedesContato(){
  try{ const r=await window.storage?.get('redes_contato'); if(r) REDES_CONTATO=JSON.parse(r.value); }catch(e){/* mantém vazio */}
}
// Envia (via EmailJS, sem precisar de servidor próprio) o relatório de uma coleta
// recém-confirmada pro gestor Tyre Eco e pro contato cadastrado da rede da loja.
async function enviarEmailColeta(loja,itens,dados){
  const cfg=window.wppCfg||{};
  if(cfg.emailAtivo===false) return;
  if(!cfg.emailServiceId||!cfg.emailTemplateId||!cfg.emailPublicKey) return; // não configurado ainda
  const rede=loja.rede||loja.marca||'';
  const destinatarios=[cfg.emailGestorTyre, REDES_CONTATO?.[rede]?.email].filter(Boolean);
  if(!destinatarios.length) return;
  const itensTexto=Object.entries(itens||{}).filter(([,v])=>parseInt(v)>0)
    .map(([k,v])=>`${v} ${ITENS_CI.find(it=>it.id===k)?.nome||k}`).join(', ')||'—';
  for(const destino of destinatarios){
    try{
      await fetch('https://api.emailjs.com/api/v1.0/email/send',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          service_id:cfg.emailServiceId, template_id:cfg.emailTemplateId, user_id:cfg.emailPublicKey,
          template_params:{
            to_email:destino, loja:loja.nome, cidade:loja.cidade||'', rede,
            data:today(), hora:now(), motorista:dados?.motorista||'', itens:itensTexto,
          }
        })
      });
    }catch(e){ console.warn('enviarEmailColeta',e); }
  }
}

async function wppSalvarCfg(){
  try{ await window.storage?.set('wpp_cfg', JSON.stringify(window.wppCfg)); }catch(e){console.warn('wppSalvarCfg',e);}
}
async function wppSalvarLog(){
  try{ await window.storage?.set('wpp_log', JSON.stringify(window.wppLog.slice(-200))); }catch(e){console.warn('wppSalvarLog',e);}
}
async function wppCarregar(){
  try{
    const c=await window.storage?.get('wpp_cfg');
    if(c) window.wppCfg={...window.wppCfg,...JSON.parse(c.value)};
    const l=await window.storage?.get('wpp_log');
    if(l) window.wppLog=JSON.parse(l.value);
  }catch(e){/* sem dados salvos ainda */}
}
wppCarregar();

function wppAddLog(tipo,titulo,msg){
  window.wppLog.push({tipo,titulo,msg,hora:new Date().toLocaleString('pt-BR')});
}

async function wppEnviar(mensagem){
  const c=window.wppCfg;
  if(!c.instanceId||!c.instanceToken||!c.clientToken||!c.grupoId){
    throw new Error('Credenciais Z-API incompletas. Configure na aba Configuração.');
  }
  const url=`https://api.z-api.io/instances/${c.instanceId}/token/${c.instanceToken}/send-text`;
  const resp=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json','Client-Token':c.clientToken},
    body:JSON.stringify({phone:c.grupoId, message:mensagem})
  });
  if(!resp.ok){
    const txt=await resp.text().catch(()=>'');
    throw new Error(`Z-API respondeu ${resp.status}: ${txt.slice(0,120)}`);
  }
  return resp.json().catch(()=>({}));
}

function wppMontarMsg(tmpl,dados){
  let m=tmpl||'';
  Object.entries(dados).forEach(([k,v])=>{ m=m.replaceAll(`{${k}}`,v); });
  return m;
}

// Disparado ao confirmar check-in de uma loja (ver renderCI -> ci-confirmar)
window.wppDispararCheckin = async function({rota,motorista,placa,loja,total,estourados,pct}){
  const c=window.wppCfg;
  if(c.ativoCheckin===false) return;
  const limite=c.limiteCheckin||30;
  if(pct>=limite){
    const msg=wppMontarMsg(c.msgCheckin,{rota,motorista,placa,loja,total,estourados,pct,limite,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
    try{
      await wppEnviar(msg);
      wppAddLog('ok','Check-in — '+loja,msg.slice(0,140));
    }catch(e){
      wppAddLog('err','Check-in — '+loja,e.message);
    }
    await wppSalvarLog();
  }
};

// Disparado ao confirmar triagem de um caminhão (ver renderTriagemGrade -> btn-confirmar-triagem)
window.wppDispararTriagem = async function({placa,motorista,total,lixo,pct}){
  const c=window.wppCfg;
  if(c.ativoTriagem===false) return;
  const limite=c.limiteTriagem||30;
  if(pct>=limite){
    const msg=wppMontarMsg(c.msgTriagem,{placa,motorista,total,lixo,pct,limite,hora:new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})});
    try{
      await wppEnviar(msg);
      wppAddLog('ok','Triagem — '+placa,msg.slice(0,140));
    }catch(e){
      wppAddLog('err','Triagem — '+placa,e.message);
    }
    await wppSalvarLog();
  }
};
</script>
