/* ── Reset & Base ── */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F7F5;--surface:#FFFFFF;--border:#E5E4E0;--border-light:#EFEFED;
  --text:#1A1A18;--text2:#6B6B65;--text3:#A8A8A2;
  --green:#2C813B;--green-bg:#EEF9F0;--green-light:#D1EFD7;--green-lime:#87C245;
  --blue:#1A5FA8;--blue-bg:#EBF2FB;--blue-light:#C9DFF5;
  --orange:#B85C00;--orange-bg:#FDF0E5;--orange-light:#FAD9B4;
  --red:#B02020;--red-bg:#FDECEC;--red-light:#F5C0C0;
  --purple:#5040A8;--purple-bg:#F0EEFB;--purple-light:#CFC9F2;
  --teal:#0A6E5C;--teal-bg:#E8F5F2;--teal-light:#B8E0D8;
  --yellow:#8A6E00;--yellow-bg:#FDF8E5;--yellow-light:#F5E5A0;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.10),0 2px 4px rgba(0,0,0,.06);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}

/* ── Tela de Login ── */
#tela-login{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:1.5rem;
  background:linear-gradient(145deg,#0B3D26 0%,#2C813B 55%,#13432D 100%);
}
.login-logo-wrap{
  background:#fff;border-radius:20px;padding:1.1rem 1.5rem;margin-bottom:1.25rem;
  box-shadow:0 16px 40px rgba(0,0,0,.22);display:flex;align-items:center;justify-content:center;
}
.login-logo-img{width:100%;max-width:230px;height:auto;display:block}
.login-title{font-size:26px;font-weight:700;color:#fff;letter-spacing:-.5px;margin-bottom:4px;text-shadow:0 1px 4px rgba(0,0,0,.2)}
.login-sub{font-size:14px;color:rgba(255,255,255,.72);margin-bottom:2rem}
.login-card{
  width:100%;max-width:380px;background:#fff;
  border-radius:20px;padding:2rem;
  box-shadow:0 24px 64px rgba(0,0,0,.28);border:none;
}
.login-label{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block}
.login-input{
  width:100%;padding:13px 16px;
  border:2px solid var(--border);border-radius:12px;
  font-size:15px;font-family:inherit;color:var(--text);background:var(--bg);
  transition:all .15s;margin-bottom:14px;
}
.login-input:focus{outline:none;border-color:var(--green);background:#fff;box-shadow:0 0 0 4px rgba(29,122,79,.1)}
.btn-login{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#1D7A4F 0%,#0A6E5C 100%);
  color:#fff;border:none;border-radius:12px;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;
  transition:all .18s;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 16px rgba(29,122,79,.4);letter-spacing:.02em;
}
.btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(29,122,79,.45)}
.btn-login:active{transform:translateY(0)}
.login-erro{font-size:13px;color:var(--red);text-align:center;margin-top:10px;padding:10px;background:var(--red-bg);border-radius:10px;display:none;font-weight:500}
.login-hint{margin-top:1.5rem;border-top:1px solid var(--border-light);padding-top:1.25rem}
.login-hint p{font-size:11px;color:var(--text3);text-align:center;margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.hint-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.hint-item{
  background:var(--bg);border:1.5px solid var(--border);
  border-radius:10px;padding:9px 12px;cursor:pointer;transition:all .15s;
}
.hint-item:hover{border-color:var(--green);background:var(--green-bg);transform:translateY(-1px);box-shadow:0 4px 12px rgba(29,122,79,.12)}
.hint-item .hi-nome{font-size:12px;font-weight:700;color:var(--text)}
.hint-item .hi-cargo{font-size:10px;color:var(--text2);margin-top:1px}

/* ── App shell ── */
#app{display:none;flex-direction:column;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:10px}
.topbar-logo{height:30px;display:flex;align-items:center}
.topbar-logo-img{height:100%;width:auto;display:block;object-fit:contain}
.topbar-info h1{font-size:14px;font-weight:600;color:var(--text);line-height:1.2}
.topbar-info span{font-size:11px;color:var(--text2)}
.topbar-right{display:flex;align-items:center;gap:8px}
.btn-logout{padding:6px 10px;background:none;border:1px solid var(--border);border-radius:var(--radius-xs);font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.btn-logout:hover{background:var(--red-bg);border-color:var(--red-light);color:var(--red)}
.content-area{flex:1;padding:1rem;max-width:540px;margin:0 auto;width:100%}

/* ── Dashboard ── */
.dash-greeting{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px;letter-spacing:-.3px}
.dash-date{font-size:13px;color:var(--text2);margin-bottom:1.25rem}
.modules-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mod-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.mod-card:hover,.mod-card:active{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.mod-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.mod-card.verde::before{background:var(--green)}
.mod-card.azul::before{background:var(--blue)}
.mod-card.laranja::before{background:var(--orange)}
.mod-card.roxo::before{background:var(--purple)}
.mod-card.teal::before{background:var(--teal)}
.mod-card.amarelo::before{background:var(--yellow)}
.mod-card.vermelho::before{background:var(--red)}
.mod-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.mod-icon.verde{background:var(--green-bg);color:var(--green)}
.mod-icon.azul{background:var(--blue-bg);color:var(--blue)}
.mod-icon.laranja{background:var(--orange-bg);color:var(--orange)}
.mod-icon.roxo{background:var(--purple-bg);color:var(--purple)}
.mod-icon.teal{background:var(--teal-bg);color:var(--teal)}
.mod-icon.amarelo{background:var(--yellow-bg);color:var(--yellow)}
.mod-icon.vermelho{background:var(--red-bg);color:var(--red)}
.mod-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.mod-desc{font-size:11px;color:var(--text2);line-height:1.4}
.mod-badge{position:absolute;top:10px;right:10px;background:var(--red);color:#fff;border-radius:20px;padding:2px 7px;font-size:10px;font-weight:700}

/* ── Módulo header ── */
.mod-header{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--border-light)}
.mod-header-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.mod-header h2{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.2px}
.mod-header span{font-size:12px;color:var(--text2)}
.btn-back{background:none;border:1px solid var(--border);border-radius:var(--radius-xs);padding:6px 10px;font-size:12px;color:var(--text2);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px;margin-bottom:1rem}
.btn-back:hover{background:var(--bg)}

/* ── Toasts (substituem alert() nativo do navegador) ── */
.toast-wrap{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px);pointer-events:none}
.toast{padding:12px 14px;border-radius:var(--radius-sm);box-shadow:var(--shadow-md);font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;transition:opacity .2s,transform .2s;pointer-events:auto}
.toast i{font-size:16px;flex-shrink:0}
.toast-sucesso{background:var(--green-bg);color:var(--green);border:1px solid var(--green-light)}
.toast-erro{background:var(--red-bg);color:var(--red);border:1px solid var(--red-light)}
.toast-aviso{background:var(--orange-bg);color:var(--orange);border:1px solid var(--orange-light)}
.toast-info{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-light)}

/* ── Modal (confirmação e edição) ── */
.modal-overlay{position:fixed;inset:0;background:rgba(20,20,18,.5);display:flex;align-items:center;justify-content:center;z-index:10000;padding:16px}
.modal-box{background:var(--surface);border-radius:var(--radius);max-width:420px;width:100%;max-height:90vh;overflow-y:auto;padding:1.25rem;box-shadow:var(--shadow-md)}
.modal-box h3{font-size:16px;margin-bottom:6px}
.modal-box .modal-desc{font-size:13px;color:var(--text2);margin-bottom:14px;line-height:1.4}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.sel-bar{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin:10px 0;box-shadow:var(--shadow-md);flex-wrap:wrap}

/* ── Componentes comuns ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.badge.verde{background:var(--green-bg);color:var(--green)}
.badge.azul{background:var(--blue-bg);color:var(--blue)}
.badge.laranja{background:var(--orange-bg);color:var(--orange)}
.badge.vermelho{background:var(--red-bg);color:var(--red)}
.badge.roxo{background:var(--purple-bg);color:var(--purple)}
.badge.cinza{background:var(--bg);color:var(--text2)}
.section-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;margin-top:1rem}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border-light)}
.row:last-child{border-bottom:none}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1rem}
.stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:1rem}
.stat-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:1rem}
@media (max-width:640px){.stat-grid-4{grid-template-columns:repeat(2,1fr)}}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;text-align:center}
.stat-box .sv{font-size:20px;font-weight:700;color:var(--text)}
.stat-box .sl{font-size:10px;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.03em}
.stat-box.verde .sv{color:var(--green)}
.stat-box.azul .sv{color:var(--blue)}
.stat-box.laranja .sv{color:var(--orange)}
.stat-box.vermelho .sv{color:var(--red)}
.fin-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);font-size:13px}
.fin-row:last-child{border-bottom:none}
.fin-row .fl{color:var(--text2)}
.fin-row .fv{font-weight:600}
.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--orange)}
.alert{border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.alert.verde{background:var(--green-bg);border:1px solid var(--green-light);color:var(--green)}
.alert.azul{background:var(--blue-bg);border:1px solid var(--blue-light);color:var(--blue)}
.alert.laranja{background:var(--orange-bg);border:1px solid var(--orange-light);color:var(--orange)}
.alert.vermelho{background:var(--red-bg);border:1px solid var(--red-light);color:var(--red)}
.alert i{font-size:16px;flex-shrink:0;margin-top:1px}
.alert p{line-height:1.5}
.btn{padding:10px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:6px;touch-action:manipulation}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:#176040}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-light)}
.btn-block{width:100%;justify-content:center;padding:13px}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-dis{opacity:.4;pointer-events:none}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);transition:border .15s}
input:focus,select:focus{outline:none;border-color:var(--green);background:#fff}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap input{padding-left:36px}
.search-wrap i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:16px}
.list-box{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;max-height:280px;overflow-y:auto}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border-light);cursor:pointer;transition:background .1s;touch-action:manipulation}
.list-row:last-child{border-bottom:none}
.list-row:hover,.list-row:active{background:var(--bg)}
.list-row.sel{background:var(--green-bg)}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.avatar.verde{background:var(--green-bg);color:var(--green)}
.avatar.azul{background:var(--blue-bg);color:var(--blue)}
.avatar.cinza{background:var(--bg);color:var(--text2)}
.avatar.teal{background:var(--teal-bg);color:var(--teal)}
.avatar.laranja{background:var(--orange-bg);color:var(--orange)}

/* ── Grade triagem/vendas ── */
.grade-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -1rem;padding:0 1rem}
.grade{border-collapse:collapse;min-width:420px;width:100%}
.grade th{font-size:10px;font-weight:700;color:var(--text2);padding:7px 4px;text-align:center;border-bottom:2px solid var(--border);background:var(--surface);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
.grade th.lbl{text-align:left;padding-left:6px;min-width:90px}
.grade td{padding:3px 2px;border-bottom:1px solid var(--border-light);vertical-align:middle}
.grade .cell-inp{width:44px;height:44px;padding:0;text-align:center;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-weight:600;background:var(--surface);color:var(--text);-moz-appearance:textfield;touch-action:manipulation}
.grade .cell-inp::-webkit-inner-spin-button,.grade .cell-inp::-webkit-outer-spin-button{-webkit-appearance:none}
.grade .cell-inp:focus{outline:none;border-color:var(--green);background:var(--green-bg)}
.grade .cell-inp.tem{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.grade .cat-label{font-size:12px;font-weight:700;padding:6px 4px 6px 6px;white-space:nowrap}
.grade .tot-col{font-size:13px;font-weight:700;text-align:right;padding-right:6px}
.grade .tot-col.tem{color:var(--green)}
.grade .total-row td{font-size:11px;font-weight:600;color:var(--text2);text-align:center;padding:7px 3px;background:var(--bg);border-top:2px solid var(--border)}
.grade .total-row .geral{font-size:14px;color:var(--text);font-weight:700;text-align:right;padding-right:6px}
.grade .total-row .geral.ok{color:var(--green)}
.pag-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.pag-opt{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 4px;cursor:pointer;text-align:center;touch-action:manipulation;transition:all .15s;background:var(--surface)}
.pag-opt:active{background:var(--bg)}
.pag-opt.sel{border-color:var(--green);background:var(--green-bg)}
.pag-opt i{font-size:20px;display:block;margin-bottom:4px;color:var(--text2)}
.pag-opt.sel i{color:var(--green)}
.pag-opt span{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.02em}
.pag-opt.sel span{color:var(--green)}
.foto-slot{border:2px dashed var(--border);border-radius:var(--radius);padding:1.25rem;text-align:center;cursor:pointer;position:relative;margin-bottom:10px;transition:all .15s;background:var(--surface)}
.foto-slot input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.foto-slot i{font-size:28px;color:var(--text3);display:block;margin-bottom:6px}
.foto-slot p{font-size:13px;color:var(--text2)}
.foto-slot.done{border-style:solid;border-color:var(--green);background:var(--green-bg)}
.foto-slot.done i,.foto-slot.done p{color:var(--green);font-weight:600}
.prog-wrap{background:var(--bg);border-radius:20px;height:6px;overflow:hidden;margin:6px 0}
.prog-bar{height:6px;border-radius:20px;background:var(--green);transition:width .3s}
.prog-bar.warn{background:var(--orange)}
.prog-bar.err{background:var(--red)}
.steps-bar{display:flex;gap:4px;margin-bottom:1rem}
.step-dot{flex:1;height:3px;border-radius:2px;background:var(--border)}
.step-dot.done{background:var(--green)}
.step-dot.active{background:var(--green);opacity:.5}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--text2)}
.empty i{font-size:32px;display:block;margin-bottom:10px;opacity:.3}
.empty p{font-size:14px}
.sig-pad{border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:crosshair;display:block;width:100%;touch-action:none}
.cli-list{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius)}
.cli-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border-light);cursor:pointer;touch-action:manipulation}
.cli-row:last-child{border-bottom:none}
.cli-row:hover,.cli-row:active{background:var(--bg)}
.cli-row.sel{background:var(--green-bg)}

/* ── Motivo tags de vencimento ── */
.vc-vencido{background:var(--red-bg);color:var(--red)}
.vc-hoje{background:var(--red-bg);color:var(--red)}
.vc-amanha{background:var(--orange-bg);color:var(--orange)}
.vc-breve{background:var(--yellow-bg);color:var(--yellow)}
.vc-ok{background:var(--green-bg);color:var(--green)}
.vc-pago{background:var(--green-bg);color:var(--green)}
.vc-sem{background:var(--bg);color:var(--text2)}

/* ── Tabela de conferência ── */
.conf-table{width:100%;border-collapse:collapse}
.conf-table th{font-size:10px;font-weight:700;color:var(--text2);padding:5px 6px;border-bottom:2px solid var(--border);text-align:right;text-transform:uppercase}
.conf-table th:first-child{text-align:left}
.conf-table td{padding:7px 6px;border-bottom:1px solid var(--border-light);font-size:13px;vertical-align:middle}
.conf-table tr.div-row{background:var(--red-bg)}
.conf-table .conf-inp{width:64px;padding:5px 7px;text-align:right;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-weight:600}
.conf-table .conf-inp:focus{outline:none;border-color:var(--green)}
.conf-table .conf-inp.ok{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.conf-table .conf-inp.diverge{border-color:var(--red);background:var(--red-bg);color:var(--red)}
</style>
</head>
<body>

<script>
// ═══════════════════════════════════════════════════════════════════════════

const firebaseConfig = {
  apiKey: "AIzaSyDi-Gd4XqWeIciTcHyQdwmmsfo01QGv-Wg",
  authDomain: "tyre-eco.firebaseapp.com",
  projectId: "tyre-eco",

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

try{ db.enablePersistence({synchronizeTabs:true}); }catch(e){/* múltiplas abas ou navegador sem suporte */}

// Domínio interno usado para transformar "usuario" em e-mail de autenticação
const DOMINIO_LOGIN = 'tyreeco.app';
function emailDoLogin(u){ return u.includes('@') ? u.toLowerCase() : `${u.toLowerCase()}@${DOMINIO_LOGIN}`; }

// ── window.storage: shim compatível com a API de storage de artifacts, agora
// gravando de verdade no Firestore (coleção app_storage). Isso faz TODAS as
// funções salvar*/carregar* já existentes no arquivo virarem dados reais e
// compartilhados entre todos os usuários, sem precisar reescrevê-las.
window.storage = {
  async set(key, value){
    await db.collection('app_storage').doc(key).set({
      value,
      atualizadoPor: usuarioAtual?.nome || null,
      atualizadoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
    return {key, value, shared:true};
  },
  async get(key){
    const snap = await db.collection('app_storage').doc(key).get();
    if(!snap.exists) return null;
    const d = snap.data();
    return {key, value: d.value, shared:true};
  },
  async delete(key){
    await db.collection('app_storage').doc(key).delete();
    return {key, deleted:true, shared:true};
  },
  async list(prefix=''){
    const snap = await db.collection('app_storage').get();
    const keys = snap.docs.map(d=>d.id).filter(k=>k.startsWith(prefix));
    return {keys, prefix, shared:true};
  }
};

// Escuta mudanças em tempo real numa chave do app_storage e chama callback(valorOuNull)
// sempre que outro usuário salvar algo novo — permite colaboração ao vivo.
function escutarStorage(key, callback){
  return db.collection('app_storage').doc(key).onSnapshot(snap=>{
    if(!snap.exists){ callback(null); return; }
    callback(snap.data().value);
  }, err=>console.warn('escutarStorage', key, err));
}

// ── Usuários ──────────────────────────────────────────────────────────────────
let usuarioAtual = null;
let telaAtual = 'dashboard';
let unsubscribesAtivos = [];

// ── Pipeline operacional real: rota -> motorista -> conferente -> triagem ────
// Antes, CAMINHOES_CONF e ROTA_MOTORISTA eram constantes fixas (dados de
// demonstração) que nunca mudavam, mesmo quando o gestor criava rotas de
// verdade no Roteirizador. Agora os dois são derivados de rotState.rotasSalvas
// (a lista real de rotas criadas e salvas) e recalculados sempre que a tela
// que os usa é aberta — assim o motorista, o conferente, a triagem e o
// dashboard sempre refletem a operação real do dia, não mais dados de mentira.
let CAMINHOES_CONF = [];
const CUSTO_POR_KM=2.50; // R$/km — usado para estimar custo logístico real das rotas no Financeiro

let ROTA_MOTORISTA = null; // recalculado por sincronizarViagemMotorista() para o motorista logado

// Quantos pneus foram de fato registrados no check-in de uma loja (pneus de
// passeio + estourados). É a fonte real do "total de pneus" de uma rota —
// antes esse número vinha hardcoded, sem relação com o que o motorista coletou.
function pneusLoja(lojaId){
  const itens = motorState.checkins[lojaId]?.itens || {};
  return (parseInt(itens.pneus_passeio)||0) + (parseInt(itens.pneus_estourado)||0);
}
function totalPneusRota(rota){
  return (rota?.lojas||[]).reduce((s,l)=>s+pneusLoja(l.id),0);
}
// Compara nomes (motorista logado x motorista atribuído na rota) ignorando
// caixa e espaços nas pontas — é o único vínculo hoje entre um login de
// motorista e as rotas atribuídas a ele pelo gestor.
function nomesIguais(a,b){
  if(!a||!b) return false;
  const x=String(a).trim().toLowerCase();
  const y=String(b).trim().toLowerCase();
  if(x===y) return true;
  // O login geralmente tem só o primeiro nome (ex: "Herlon"), enquanto o cadastro de
  // Pessoas/a rota tem o nome completo (ex: "Herlon Carrera") — considera a mesma
  // pessoa quando um nome é o início do outro por palavra inteira, ou o primeiro
  // nome bate exatamente. Sem isso, a rota nunca aparecia pro motorista logado.
  if(x.startsWith(y+' ')||y.startsWith(x+' ')) return true;
  return x.split(' ')[0]===y.split(' ')[0];
}
// Recalcula ROTA_MOTORISTA: a rota do usuário motorista logado que ainda não
// foi finalizada (aguardando ou em andamento). Chamar sempre no início das
// telas do módulo motorista, antes de renderizar.
function sincronizarViagemMotorista(){
  const nome = usuarioAtual?.nome || '';
  ROTA_MOTORISTA = (rotState?.rotasSalvas||[]).find(r =>
    nomesIguais(r.motoristaNome, nome) && (!r.status||r.status==='aguardando'||r.status==='em_rota')
  ) || null;
}
// Recalcula CAMINHOES_CONF a partir das rotas salvas que já terminaram a
// viagem (motorista finalizou) — é o que o conferente e a triagem devem ver.
// Chamar sempre no início das telas de conferência/triagem/dashboard.
function sincronizarCaminhoesConf(){
  CAMINHOES_CONF = (rotState?.rotasSalvas||[])
    .filter(r => ['aguardando_conferencia','conferido','triado'].includes(r.status))
    .map(r => ({
      id: r.id,
      placa: r.placa || '',
      motorista: r.motoristaNome || '',
      rota: r.nome || '',
      chegada: r.finalizadaEm ? new Date(r.finalizadaEm).toLocaleString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '',
      totalPneus: totalPneusRota(r),
      status: r.status==='aguardando_conferencia' ? 'aguardando' : r.status, // 'conferido' | 'triado'
      km: Math.round(r.kmTotal||0),
      lojas: (r.lojas||[]).map(l => ({id:l.id, nome:l.nome, marca:l.marca, pneus:pneusLoja(l.id)})),
    }));

// Escapa texto livre digitado por usuarios antes de ir para innerHTML — evita que
// observacoes/textos gravados no Firestore virem HTML/JS executavel (XSS persistente).
function escapeHtml(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});
}
// Toast visual consistente com o design do app — substitui os alert()
// nativos do navegador, que quebravam a identidade visual do sistema.
// tipo: 'sucesso' | 'erro' | 'aviso' | 'info'
function mostrarToast(msg, tipo){
  tipo = tipo || 'sucesso';
  const icones = {sucesso:'ti-circle-check', erro:'ti-alert-circle', aviso:'ti-alert-triangle', info:'ti-info-circle'};
  let wrap = document.getElementById('toast-wrap');
  if(!wrap){
    wrap = document.createElement('div');
    wrap.id = 'toast-wrap';
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  const el = document.createElement('div');
  el.className = 'toast toast-'+tipo;
  el.innerHTML = `<i class="ti ${icones[tipo]||icones.sucesso}"></i><span>${escapeHtml(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{
    el.style.opacity='0'; el.style.transform='translateY(-6px)';
    setTimeout(()=>el.remove(), 220);
  }, 3600);
}

// ── Modal genérico (substitui confirm()/prompt() nativos em telas novas) ──
function fecharModal(){ document.getElementById('modal-overlay-root')?.remove(); }
function abrirModal(innerHtml){
  fecharModal();
  const ov=document.createElement('div');
  ov.id='modal-overlay-root';
  ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal-box">${innerHtml}</div>`;
  ov.addEventListener('click', e=>{ if(e.target===ov) fecharModal(); });
  document.body.appendChild(ov);
  return ov;
}
// Modal de confirmação (usado antes de excluir vendas, por exemplo). Retorna
// uma Promise<boolean> — true se o usuário confirmou, false se cancelou.
function confirmarAcao({titulo, mensagem, textoConfirmar='Confirmar', tipoBotao='danger'}){
  return new Promise(resolve=>{
    abrirModal(`
      <h3>${escapeHtml(titulo)}</h3>
      <p class="modal-desc">${escapeHtml(mensagem)}</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" style="flex:1;justify-content:center" id="modal-cancelar">Cancelar</button>
        <button class="btn ${tipoBotao==='danger'?'btn-danger':'btn-primary'}" style="flex:1;justify-content:center" id="modal-confirmar">${escapeHtml(textoConfirmar)}</button>
      </div>`);
    document.getElementById('modal-cancelar').addEventListener('click', ()=>{ fecharModal(); resolve(false); });
    document.getElementById('modal-confirmar').addEventListener('click', ()=>{ fecharModal(); resolve(true); });
  });
}

function calcDRE(d,periodo){
  const despesas=despesasPeriodo(periodo);

function statusVencimentoFin(d){
  const hoje=new Date();hoje.setHours(0,0,0,0);
  const alvo=new Date(d);alvo.setHours(0,0,0,0);
  const diff=Math.round((alvo-hoje)/86400000);
  if(diff<0)return 'vencido';
  if(diff===0)return 'hoje';
  if(diff===1)return 'amanha';
  if(diff<=7)return 'breve';
  return 'ok';
}

  const custoItens=+(receita*0.28).toFixed(2); // estimativa de custo de itens (28% da receita) — sem dado real disponível

  const horas=Object.keys(buckets).sort();
  const custoPorHora=horas.length?custoLog/horas.length:0;
  const chart=horas.length?horas.map(h=>({l:h,receita:buckets[h],custo:custoPorHora})):[{l:'Hoje',receita:0,custo:custoLog}];
  return{
    label:'Hoje · '+today()+' · dados reais',
    real:true,
    receita,custoLog,custoItens,chart,
    pagamentos:pagamentosReais.length?pagamentosReais:[{id:'dinheiro',valor:0}]
  };
}

function exibirErroLogin(msg){
  const err=document.getElementById('login-erro');
  err.textContent=msg;
  err.style.display='block';
  setTimeout(()=>err.style.display='none',4000);
}

function mapErroFirebase(err){
  const c=err?.code||'';
  if(c.includes('user-not-found')||c.includes('wrong-password')||c.includes('invalid-credential')) return 'Usuário ou senha incorretos.';
  if(c.includes('too-many-requests')) return 'Muitas tentativas seguidas. Aguarde alguns instantes.';
  if(c.includes('network')) return 'Sem conexão com o servidor. Verifique sua internet.';
  if(c.includes('user-disabled')) return 'Este usuário está desativado. Fale com o gestor.';
  return 'Não foi possível entrar. Tente novamente.';
}

async function fazerLogin(){
  const u=document.getElementById('inp-usuario').value.trim();
  const s=document.getElementById('inp-senha').value;
  const btn=document.getElementById('btn-entrar');
  if(!u||!s){ exibirErroLogin('Preencha usuário e senha.'); return; }
  const rotuloOriginal=btn.innerHTML;
  btn.disabled=true; btn.innerHTML='<i class="ti ti-loader-2"></i> Entrando...';
  try{
    await auth.signInWithEmailAndPassword(emailDoLogin(u), s);
    // onAuthStateChanged cuida de carregar o perfil e abrir o app
  }catch(err){
    exibirErroLogin(mapErroFirebase(err));
  }finally{
    btn.disabled=false; btn.innerHTML=rotuloOriginal;
  }
}

document.getElementById('btn-logout').addEventListener('click',()=>{ auth.signOut(); });

function pararListenersAtivos(){
  unsubscribesAtivos.forEach(unsub=>{ try{unsub();}catch(e){} });
  unsubscribesAtivos=[];
}

// ── Sincronização ao vivo entre sessões ─────────────────────────────────────
// Sem isso, cada sessão só carregava vendas/contas UMA vez (no login) — se a
// pessoa do Vendas lançasse uma venda com a pessoa do Financeiro já logada em
// outra aba/dispositivo, o Financeiro só via a venda nova depois de recarregar
// a página. Aqui a gente liga um listener em tempo real (onSnapshot, via
// escutarStorage) para cada coleção compartilhada: qualquer mudança feita por
// qualquer sessão atualiza o estado em memória e, se a tela atual mostra esse
// dado, re-renderiza na hora — sem precisar dar F5 nem relogar.
function rerenderizarTelaAtual(){
  // Não interrompe o usuário no meio de uma ação (modal aberto = formulário em uso)
  if(document.getElementById('modal-overlay-root')) return;
  const mapaTelas={
    'financeiro':renderFinanceiro,
    'financeiro_relatorios':renderRelatorioFinanceiro,
    'vendas_hist':renderVendasHist,
    'dashboard':renderDashboard,
    'conciliacao_bancaria':renderRelatorioFinanceiro,
  };
  mapaTelas[telaAtual]?.();
}
function iniciarSincronizacaoTempoReal(){
  const registrar=(key, aplicar)=>{
    const unsub=escutarStorage(key, valorJson=>{
      if(valorJson==null) return; // documento ainda não existe no Firestore, mantém os dados já carregados
      try{ aplicar(JSON.parse(valorJson)); }catch(e){ console.warn('sincronizacao', key, e); return; }
      rerenderizarTelaAtual();
    });
    unsubscribesAtivos.push(unsub);
  };
  registrar('vendas_historico', v=>{ vendasState.historico=v; });
  registrar('contas_receber', v=>{ CONTAS_RECEBER=v; });
  registrar('contas_pagar', v=>{ contasPagarState.itens=v; });
  registrar('contas_bancos', v=>{ BANCOS=v; });
  registrar('plano_contas', v=>{ planoContas=v; });
}

auth.onAuthStateChanged(async (user)=>{
  if(user){
    let perfilDoc;
    try{
      perfilDoc = await db.collection('usuarios').doc(user.uid).get();
    }catch(e){
      exibirErroLogin('Erro ao carregar perfil. Verifique sua conexão.');
      return;
    }
    if(!perfilDoc.exists){
      exibirErroLogin('Conta sem perfil configurado. Fale com o gestor.');
      await auth.signOut();
      return;
    }
    const p=perfilDoc.data();
    if(p.ativo===false){
      exibirErroLogin('Este usuário foi desativado. Fale com o gestor.');
      await auth.signOut();
      return;
    }
    usuarioAtual={uid:user.uid, login:p.login, nome:p.nome, perfil:p.perfil, cor:p.cor, permissoes:p.permissoes||null, escopoRede:p.escopoRede||null, escopoLojaId:p.escopoLojaId||null};
    document.getElementById('tela-login').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('topbar-titulo').textContent='Tyre Eco';
    document.getElementById('topbar-sub').textContent=usuarioAtual.nome;
    await carregarDadosColaborativos();
    iniciarSincronizacaoTempoReal();
    sincronizarCadastros().then(()=>renderDashboard());
  } else {
    usuarioAtual=null;
    pararListenersAtivos();
    document.getElementById('tela-login').style.display='flex';
    document.getElementById('app').style.display='none';
    document.getElementById('inp-usuario').value='';
    document.getElementById('inp-senha').value='';
  }
});

// Cria um login novo sem derrubar a sessão de quem está criando: abre um app
// Firebase secundário só para o createUser, depois descarta.
async function criarColaborador({login, senha, nome, perfil, cor, permissoes, escopoRede, escopoLojaId}){
  const email=emailDoLogin(login);
  const nomeApp='secundario-'+Date.now();
  const appSecundario=firebase.initializeApp(firebaseConfig, nomeApp);
  try{
    const cred=await appSecundario.auth().createUserWithEmailAndPassword(email, senha);
    await db.collection('usuarios').doc(cred.user.uid).set({
      login: login.toLowerCase(), nome, perfil, cor, email, ativo:true, permissoes: permissoes||null,
      escopoRede: escopoRede||null, escopoLojaId: escopoLojaId||null,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
      criadoPor: usuarioAtual?.nome || null
    });
    await appSecundario.auth().signOut();
  }finally{
    await appSecundario.delete();
  }
}

// Lista de módulos (id + nome/ícone/cor) que o usuário logado pode acessar,
// combinando as permissões individuais (se existirem) com o padrão do perfil.
// Usada tanto para montar os cards do dashboard quanto como barreira em
// abrirModulo() — sem isso, qualquer módulo podia ser aberto direto pelo
// console do navegador, mesmo sem permissão (a única "trava" era visual).
function modulosPermitidos(modsPorPerfil, perfil){
  if(!usuarioAtual.permissoes) return modsPorPerfil[perfil]||[];
  const flat={};
  Object.values(modsPorPerfil).forEach(arr=>arr.forEach(m=>{ if(!flat[m.id]) flat[m.id]=m; }));
  return Object.keys(usuarioAtual.permissoes)
    .filter(id=>usuarioAtual.permissoes[id])
    .map(id=>flat[id])
    .filter(Boolean);
}

// Helpers geográficos
function hav(a,b,c,d){const R=6371,dL=(c-a)*Math.PI/180,dO=(d-b)*Math.PI/180,e=Math.sin(dL/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dO/2)**2;return R*2*Math.atan2(Math.sqrt(e),Math.sqrt(1-e));}
function cityFallback(cidade){return({'CAMPINAS':{lat:-22.9056,lng:-47.0608},'OSASCO':{lat:-23.5329,lng:-46.7919},'BARRETOS':{lat:-20.5570,lng:-48.5655},'BATATAIS':{lat:-20.8908,lng:-47.5906},'MOGI GUACU':{lat:-22.3715,lng:-46.9424},'MOGI MIRIM':{lat:-22.4312,lng:-46.9557},'ITAJAI':{lat:-26.9072,lng:-48.6619},'CARAPICUIBA':{lat:-23.5224,lng:-46.8356}}[cidade])||{lat:-23.5505,lng:-46.6333};}
async function getCoords(cep,cidade){
  const k=cep.replace(/\D/g,'');
  if(rotCoordCache[k])return rotCoordCache[k];
  try{
    const vr=await fetch(`https://viacep.com.br/ws/${k}/json/`);
    const vd=await vr.json();
    if(vd.erro)throw new Error();
    const q=`${vd.logradouro||''} ${vd.localidade} ${vd.uf} Brasil`.trim();
    const nr=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`,{headers:{'Accept-Language':'pt-BR','User-Agent':'TyreEco/1.0'}});
    const nd=await nr.json();
    if(!nd.length)throw new Error();
    const c={lat:parseFloat(nd[0].lat),lng:parseFloat(nd[0].lon)};
    rotCoordCache[k]=c;return c;
  }catch(e){return cityFallback(cidade);}
}
function kMeans(pts,k,iters=20){
  if(pts.length<=k)return pts.map((_,i)=>i%k);
  let cents=[pts[Math.floor(Math.random()*pts.length)]];
  while(cents.length<k){const ds=pts.map(p=>Math.min(...cents.map(c=>hav(p.lat,p.lng,c.lat,c.lng))));const tot=ds.reduce((a,b)=>a+b,0);let r=Math.random()*tot,cum=0;for(let i=0;i<pts.length;i++){cum+=ds[i];if(cum>=r){cents.push(pts[i]);break;}}}
  let cls=new Array(pts.length).fill(0);
  for(let it=0;it<iters;it++){pts.forEach((p,i)=>{let best=0,bd=Infinity;cents.forEach((c,ci)=>{const d=hav(p.lat,p.lng,c.lat,c.lng);if(d<bd){bd=d;best=ci;}});cls[i]=best;});cents=Array.from({length:k},(_,ci)=>{const g=pts.filter((_,i)=>cls[i]===ci);if(!g.length)return cents[ci];return{lat:g.reduce((s,p)=>s+p.lat,0)/g.length,lng:g.reduce((s,p)=>s+p.lng,0)/g.length};});}
  return cls;
}
function nearestNeighbor(origem,pts){
  let resto=[...pts],rota=[],atual=origem;
  while(resto.length){let mi=0,md=Infinity;resto.forEach((p,i)=>{const d=hav(atual.lat,atual.lng,p.lat,p.lng);if(d<md){md=d;mi=i;}});const prox=resto.splice(mi,1)[0];prox._dist=hav(atual.lat,atual.lng,prox.lat,prox.lng);rota.push(prox);atual=prox;}
  return rota;
}
function calcKmRota(rota){const kmIda=rota.reduce((s,p)=>s+(p._dist||0),0);const kmVolta=rota.length?hav(rota[rota.length-1].lat,rota[rota.length-1].lng,BASE_ROT.lat,BASE_ROT.lng):0;return{kmIda,kmVolta,kmTotal:kmIda+kmVolta};}

// Vencimento
function isUtil(d){return d.getDay()!==0&&d.getDay()!==6;}
function addDU(ds,n){let d=new Date(ds+'T12:00:00'),a=0;while(a<n){d.setDate(d.getDate()+1);if(isUtil(d))a++;}return d;}
function duEntre(ds,d2){let d=new Date(ds+'T12:00:00'),c=0,cur=new Date(d);cur.setDate(cur.getDate()+1);while(cur<=d2){if(isUtil(cur))c++;cur.setDate(cur.getDate()+1);}return c;}
function getVenc(f){
  if(!f.uc)return{status:'sem',label:'—',diff:99};
  const prox=addDU(f.uc,f.ciclo),hj=new Date();hj.setHours(12,0,0,0);
  const diff=prox>=hj?duEntre(new Date().toISOString().split('T')[0],prox):-duEntre(prox.toISOString().split('T')[0],hj);
  if(diff<0)return{status:'vencido',label:`Venc.${Math.abs(diff)}du`,diff};
  if(diff===0)return{status:'hoje',label:'Hoje',diff:0};
  if(diff===1)return{status:'amanha',label:'Amanhã',diff:1};
  if(diff<=5)return{status:'breve',label:`${diff}du`,diff};
  return{status:'ok',label:`${diff}du`,diff};
}

function _bindListaLojas(){
  document.getElementById('rot-todos-wrap')?.addEventListener('click',()=>{const s=rotState;const b=s.busca.toLowerCase();const lista=FORNS_ROT.filter(f=>(s.filtroUF==='Todos'||f.uf===s.filtroUF)&&(!b||f.nome.toLowerCase().includes(b)||f.cidade.toLowerCase().includes(b)||(f.codLoja||'').toLowerCase().includes(b)));const todosOn=lista.every(f=>s.sel.has(f.id));lista.forEach(f=>todosOn?s.sel.delete(f.id):s.sel.add(f.id));_atualizarListaLojas();});
  document.querySelectorAll('.rot-forn-row').forEach(el=>el.addEventListener('click',()=>{const id=el.dataset.fid;rotState.sel.has(id)?rotState.sel.delete(id):rotState.sel.add(id);_atualizarListaLojas();}));

  const el=document.getElementById('rot-lista-container');

  el.innerHTML=_gerarHTMLLista(rotState);
  _bindListaLojas();

  const nSel=rotState.sel.size;
  const btnCalc=document.getElementById('rot-calcular');
  if(btnCalc) btnCalc.textContent='🗺️ Gerar '+rotState.nRotas+' rota'+(rotState.nRotas>1?'s':'')+' com '+nSel+' loja'+(nSel!==1?'s':'');
}

    document.getElementById('rot-minus')?.addEventListener('click',()=>{rotState.nRotas=Math.max(1,rotState.nRotas-1);_renderRoteizador();});

async function calcularRotas(){
  const fornsSel=FORNS_ROT.filter(f=>rotState.sel.has(f.id));
  rotState.tela='calculando'; rotState.loadMsg=`Geocodificando 1/${fornsSel.length}...`; _renderRoteizador();
  const pontos=[];
  for(let i=0;i<fornsSel.length;i++){
    rotState.loadMsg=`Geocodificando ${i+1}/${fornsSel.length}: ${fornsSel[i].cidade}...`; _renderRoteizador();
    const c=await getCoords(fornsSel[i].cep,fornsSel[i].cidade);
    pontos.push({...fornsSel[i],...c});
    await new Promise(r=>setTimeout(r,320));
  }
  rotState.loadMsg='Agrupando por proximidade...'; _renderRoteizador();
  const k=Math.min(rotState.nRotas,pontos.length);
  const cls=kMeans(pontos,k);
  const grupos=Array.from({length:k},()=>[]);
  pontos.forEach((p,i)=>grupos[cls[i]].push(p));
  rotState.loadMsg='Otimizando sequência...'; _renderRoteizador();
  rotState.rotasSugeridas=grupos.filter(g=>g.length>0).map(grupo=>{
    const otimizada=nearestNeighbor(BASE_ROT,grupo);
    const {kmIda,kmVolta,kmTotal}=calcKmRota(otimizada);
    return{lojas:otimizada,kmIda,kmVolta,kmTotal,mapsUrl:buildMapsUrl(otimizada)};
  }).sort((a,b)=>a.kmTotal-b.kmTotal);
  rotState.atribuicoes={};
  rotState.tela='resultado'; _renderRoteizador();
}

function salvarTodasRotas(){
  // Custo por km calculado pela placa atribuída ou média da frota
  const getCkmRota=(ri)=>{
    const placa=rotState.atribuicoes[ri]?.veiculo||'';
    return placa?parseFloat(getCustoKmPlaca(placa)):parseFloat(rotState.custoKm)||1.5;
  };
  const ckm=parseFloat(rotState.custoKm)||1.5;
  rotState.rotasSugeridas.forEach((rota,ri)=>{
    const a=rotState.atribuicoes[ri]||{};
    const mot=MOTORISTAS_ROT.find(m=>m.id===a.motorista);
    const rotaId='r'+Date.now()+ri;
    rotState.rotasSalvas.push({
      id:rotaId, nome:a.nome||`Rota ${ri+1}`,
      nLojas:rota.lojas.length, kmIda:rota.kmIda, kmVolta:rota.kmVolta, kmTotal:rota.kmTotal,
      custoLog:rota.kmTotal*ckm, frete:parseFloat(a.frete)||0,
      placa:a.veiculo||'', motoristaNome:mot?.nome||'', ajudante:a.ajudante||'', mapsUrl:rota.mapsUrl,
      criadaEm:new Date().toISOString(), iniciadaEm:null, finalizadaEm:null,
      // status percorre: aguardando (motorista ainda nao saiu) -> em_rota ->
      // aguardando_conferencia (motorista finalizou, falta conferente) ->
      // conferido (pronto para triagem) -> triado (ciclo completo)
      status:'aguardando', distVolta:Math.round(rota.kmVolta||0),
      // ids compostos (rota+loja) evitam que o check-in de uma visita antiga
      // à mesma loja "vaze" para uma rota nova futura na mesma loja
      lojas: rota.lojas.map(f=>({id:`${rotaId}_${f.id}`, nome:f.nome, cidade:f.cidade, marca:f.marca, endereco:f.endereco, dist:Math.round(f._dist||0)})),
    });
  });
  salvarRotasSalvas();
  rotState.sel.clear(); rotState.rotasSugeridas=[];
  rotState.tela='salvas'; _renderRoteizador();
  setTimeout(()=>mostrarToast(`${rotState.rotasSalvas.length} rota(s) criada(s)! Motoristas notificados.`,'sucesso'),100);
}

// ── LOGÍSTICA: Painel de acompanhamento dos motoristas ──────────────────────
// ── Portal do cliente: histórico de coletas por rede ou por loja ────────────
// Extrai o id estável do fornecedor (Cadastros → Fornecedores) a partir do id
// composto usado nas rotas: "${rotaId}${fornecedorId}" tem exatamente um "_"
// no meio, sempre entre o id da rota e o id do fornecedor.
function extrairFornecedorId(lojaCompostaId){
  const idx=(lojaCompostaId||'').indexOf('_');
  return idx>=0?lojaCompostaId.slice(idx+1):lojaCompostaId;
}
// Monta a lista de coletas (uma linha por loja/parada com check-in feito),
// cruzando as rotas salvas com os check-ins registrados pelos motoristas.
// filtro = {rede} para portal de gestor de rede, ou {fornecedorId} para
// portal de gerente de loja (uma loja só).
function listarHistoricoColetas(filtro){
  const registros=[];
  (rotState.rotasSalvas||[]).forEach(rota=>{
    (rota.lojas||[]).forEach(loja=>{
      const ci=motorState.checkins[loja.id];
      if(!ci?.done) return;
      const fornecedorId=extrairFornecedorId(loja.id);
      const rede=loja.rede||loja.marca||'';
      if(filtro.rede&&normalizarTexto(rede)!==normalizarTexto(filtro.rede)) return;
      if(filtro.fornecedorId&&fornecedorId!==filtro.fornecedorId) return;
      registros.push({
        lojaNome:loja.nome, lojaCidade:loja.cidade||'', rede,
        rotaNome:rota.nome, motorista:rota.motoristaNome||'',
        data:ci.hora?.split(' ')[0]||'', hora:ci.hora||'',
        itens:ci.itens||{}, nf:ci.nf||'', responsavel:ci.responsavel||'',
      });
    });
  });
  return registros.sort((a,b)=>(b.hora||'').localeCompare(a.hora||''));
}
function renderHistoricoColetas(){
  const perfil=usuarioAtual?.perfil;
  const filtro=perfil==='gestor_rede'?{rede:usuarioAtual.escopoRede}:{fornecedorId:usuarioAtual.escopoLojaId};
  const registros=listarHistoricoColetas(filtro);
  const tituloEscopo=perfil==='gestor_rede'?`Rede ${usuarioAtual.escopoRede||''}`:(FORNS_ROT.find(f=>f.id===usuarioAtual.escopoLojaId)?.nome||'Sua loja');
  const totalItens=registros.reduce((s,r)=>s+Object.values(r.itens).reduce((ss,v)=>ss+(parseInt(v)||0),0),0);

  document.getElementById('content-area').innerHTML=`
    ${btnBack('Dashboard')}
    <div class="mod-header"><div class="mod-header-icon azul"><i class="ti ti-history"></i></div><div><h2>Histórico de Coletas</h2><span>${escapeHtml(tituloEscopo)}</span></div></div>
    <div class="stat-grid-3">
      <div class="stat-box verde"><div class="sv">${registros.length}</div><div class="sl">Coletas</div></div>
      <div class="stat-box azul"><div class="sv">${totalItens}</div><div class="sl">Itens coletados</div></div>
      <div class="stat-box"><div class="sv">${new Set(registros.map(r=>r.lojaNome)).size}</div><div class="sl">Loja${new Set(registros.map(r=>r.lojaNome)).size!==1?'s':''}</div></div>
    </div>
    ${registros.length===0?`<div class="empty"><i class="ti ti-history-off"></i><p>Nenhuma coleta registrada ainda.</p></div>`:''}
    ${registros.map(r=>{
      const itensTexto=Object.entries(r.itens).filter(([,v])=>parseInt(v)>0).map(([k,v])=>`${v} ${ITENS_CI.find(it=>it.id===k)?.nome||k}`).join(', ');
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <strong style="font-size:14px">${escapeHtml(r.lojaNome)}</strong>
          <span style="font-size:11px;color:var(--text2)">${r.data} ${r.hora?'· '+r.hora:''}</span>
        </div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:6px">${escapeHtml(r.lojaCidade)}${r.rotaNome?' · Rota: '+escapeHtml(r.rotaNome):''}${r.motorista?' · '+escapeHtml(r.motorista):''}</div>
        <div style="font-size:13px">${itensTexto||'—'}</div>
        ${r.nf?`<div style="font-size:11px;color:var(--text3);margin-top:4px">NF: ${escapeHtml(r.nf)}</div>`:''}
      </div>`;
    }).join('')}`;
  bindBack();
}
// ── Painel de Frota: visão geral de todas as placas, com filtro por placa e motorista ──
let frotaState={filtroPlaca:'',filtroMotorista:''};
const FROTA_STATUS_LABEL={aguardando:'Aguardando saída',em_rota:'Em rota',aguardando_conferencia:'Aguard. conferência',conferido:'Conferido',triado:'Triado'};
const FROTA_STATUS_COR={aguardando:'laranja',em_rota:'azul',aguardando_conferencia:'roxo',conferido:'teal',triado:'verde'};
// Soma das contas a pagar vinculadas à placa (Multa/IPVA/Manutenção etc,
// qualquer categoria marcada como veiculo:true no plano de contas) num mês
// específico (formato 'YYYY-MM') — usada no Painel de Frota pra mostrar
// quanto cada caminhão deu de gasto extra naquele mês.
function gastoVeiculoMes(placa, mesISO){
  return contasPagarState.itens
    .filter(c=>c.placa===placa && (vencimentoISOConta(c)||'').slice(0,7)===mesISO)
    .reduce((s,c)=>s+valorTotalConta(c),0);
}

  let registros=placasUnicas.map(placa=>{
    const rotasVeiculo=[...rotState.rotasSalvas].filter(r=>r.placa===placa).sort((a,b)=>(b.criadaEm||'').localeCompare(a.criadaEm||''));
    const atual=rotasVeiculo[0]||null;

  if(frotaState.filtroPlaca) registros=registros.filter(r=>r.placa===frotaState.filtroPlaca);

      <div class="stat-box"><div class="sv">${semRotaAtiva}</div><div class="sl">Sem rota ativa</div></div>
    </div>

      <select class="login-input" id="frota-filtro-placa" style="flex:1">
        <option value="">Todas as placas</option>
        ${placasUnicas.map(p=>`<option value="${p}" ${frotaState.filtroPlaca===p?'selected':''}>${p}</option>`).join('')}
      </select>

        ${motoristasUnicos.map(m=>`<option value="${escapeHtml(m)}" ${frotaState.filtroMotorista===m?'selected':''}>${escapeHtml(m)}</option>`).join('')}
      </select>
    </div>
    ${(frotaState.filtroPlaca||frotaState.filtroMotorista)?`<button class="btn btn-secondary btn-sm btn-block" id="frota-limpar-filtro" style="margin-bottom:1rem"><i class="ti ti-x"></i> Limpar filtros</button>`:''}
    ${registros.length===0?`<div class="empty"><i class="ti ti-truck-off"></i><p>Nenhuma placa encontrada com esse filtro.</p></div>`:''}
    ${registros.map(r=>`<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <strong style="font-size:15px;letter-spacing:.04em">${r.placa}</strong>

      ${r.motorista?`<div style="font-size:13px;margin-bottom:4px"><i class="ti ti-user" style="font-size:12px;color:var(--text2)"></i> ${escapeHtml(r.motorista)}</div>`:'<div style="font-size:12px;color:var(--text3);margin-bottom:4px">Nenhum motorista atribuído</div>'}

    </div>`).join('')}`;
  bindBack();
  document.getElementById('frota-filtro-placa')?.addEventListener('change',e=>{frotaState.filtroPlaca=e.target.value;renderPainelFrota();});

        <span class="badge verde">${{aguardando:'Aguardando',em_rota:'Em rota',aguardando_conferencia:'Aguard. conferência',conferido:'Conferido',triado:'Triado'}[r.status]||'Criada'}</span>
      </div>
      <div style="background:var(--bg);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:2px 0"><span>Ida</span><strong>~${Math.round(r.kmIda)} km</strong></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);padding:2px 0"><span>Volta</span><strong>~${Math.round(r.kmVolta)} km</strong></div>
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding-top:5px;margin-top:3px;border-top:1px solid var(--border)"><span>Total</span><span>~${Math.round(r.kmTotal)} km</span></div>
        ${r.custoLog>0?`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--orange);padding-top:3px"><span>Custo logístico (aprox.)</span><strong>${fmtM(r.custoLog)}</strong></div>`:''}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
        ${r.placa?`<span class="badge azul"><i class="ti ti-truck" style="font-size:10px"></i> ${r.placa}</span>`:''}
        ${r.motoristaNome?`<span class="badge verde"><i class="ti ti-user" style="font-size:10px"></i> ${r.motoristaNome}</span>`:''}
        <span class="badge cinza"><i class="ti ti-map-pin" style="font-size:10px"></i> ${(r.lojas||[]).length} parada${(r.lojas||[]).length!==1?'s':''}</span>
      </div>
      ${r.mapsUrl?`<a href="${r.mapsUrl}" target="_blank" style="text-decoration:none;display:block;margin-bottom:8px"><button class="btn btn-block" style="background:#1A73E8;color:#fff;border:none;font-size:12px;padding:8px"><i class="ti ti-map-pin"></i> Google Maps</button></a>`:''}
      <div style="display:flex;gap:8px">
        <button class="btn btn-secondary btn-sm" style="flex:1;justify-content:center" data-editar-rota="${r.id}"><i class="ti ti-pencil"></i> Editar paradas</button>
        <button class="btn btn-secondary btn-sm" style="color:var(--red)" data-excluir-rota="${r.id}"><i class="ti ti-trash"></i></button>
      </div>
    </div>`).join('')}`;
  document.getElementById('btn-back-mod')?.addEventListener('click',renderDashboard);
  document.getElementById('rot-nova')?.addEventListener('click',()=>{rotState.tela='selecao';rotState.rotasSugeridas=[];_renderRoteizador();});
  document.querySelectorAll('[data-excluir-rota]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const id=btn.dataset.excluirRota;
      const rota=rotState.rotasSalvas.find(r=>r.id===id);
      if(!rota)return;
      const ok=await confirmarAcao({titulo:'Excluir rota?',mensagem:`A rota "${rota.nome}" (${(rota.lojas||[]).length} paradas) será removida permanentemente, junto com o vínculo ao motorista e veículo.`,textoConfirmar:'Excluir'});
      if(!ok)return;
      const idx=rotState.rotasSalvas.findIndex(r=>r.id===id);
      if(idx>=0) rotState.rotasSalvas.splice(idx,1);
      salvarRotasSalvas();
      mostrarToast('Rota excluída.','sucesso');
      _renderSalvas();
    });
  });
  document.querySelectorAll('[data-editar-rota]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      rotEditState.rotaId=btn.dataset.editarRota;
      rotEditState.buscaLoja='';
      _renderEditarRota();
    });
  });
}

// ── Editar paradas de uma rota já salva (mesmo depois de iniciada) ──────────
let rotEditState={rotaId:null,buscaLoja:''};
function _renderEditarRota(){
  const rota=rotState.rotasSalvas.find(r=>r.id===rotEditState.rotaId);
  if(!rota){ _renderSalvas(); return; }
  const emAndamento=rota.status==='em_rota'||rota.status==='aguardando_conferencia';
  const busca=(rotEditState.buscaLoja||'').toLowerCase();
  const idsNaRota=new Set((rota.lojas||[]).map(l=>l.nome+'|'+l.cidade));
  const sugestoes=busca?FORNS_ROT.filter(f=>!idsNaRota.has(f.nome+'|'+f.cidade)&&(f.nome.toLowerCase().includes(busca)||f.cidade.toLowerCase().includes(busca))).slice(0,15):[];

  document.getElementById('content-area').innerHTML=`
    <button class="btn btn-secondary btn-sm" id="btn-voltar-editar-rota" style="margin-bottom:1rem"><i class="ti ti-arrow-left"></i> Rotas salvas</button>
    <div class="mod-header"><div class="mod-header-icon verde"><i class="ti ti-pencil"></i></div><div><h2>${escapeHtml(rota.nome)}</h2><span>Editar paradas</span></div></div>
    ${emAndamento?`<div class="alert laranja"><i class="ti ti-alert-triangle"></i><p>Essa rota já está em andamento. Dá pra adicionar ou remover paradas, mas o <strong>km e custo logístico calculados não são recalculados automaticamente</strong> — revise-os manualmente se mudar muita coisa.</p></div>`:''}
    <div class="section-title">Paradas atuais (${(rota.lojas||[]).length})</div>
    <div class="card" style="padding:.25rem 1rem">
      ${(rota.lojas||[]).length===0?'<p class="dash-date" style="padding:.5rem 0">Nenhuma parada nessa rota.</p>':(rota.lojas||[]).map(l=>{
        const coletada=!!motorState.checkins?.[l.id]?.done;
        return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light)">
          <div style="flex:1;min-width:0">
            <strong style="font-size:13px;display:block">${escapeHtml(l.nome)}</strong>
            <span style="font-size:11px;color:var(--text2)">${escapeHtml(l.cidade||'')}${l.marca?' · '+escapeHtml(l.marca):''}${coletada?' · <span style="color:var(--green)">já coletada</span>':''}</span>
          </div>
          <button class="btn-icon-sm" data-remover-parada="${l.id}" style="border:none;background:transparent;color:${coletada?'var(--text3)':'var(--red)'};padding:4px" title="${coletada?'Já coletada — remover mesmo assim':'Remover parada'}"><i class="ti ti-trash"></i></button>
        </div>`;
      }).join('')}
    </div>

    <div class="section-title" style="margin-top:1rem">Adicionar parada</div>
    <div class="search-wrap" style="margin-bottom:.5rem"><i class="ti ti-search"></i><input id="busca-parada" type="text" placeholder="Buscar loja por nome ou cidade..." value="${escapeHtml(rotEditState.buscaLoja||'')}" autocomplete="off" autocorrect="off"></div>
    ${sugestoes.length?`<div class="card" style="padding:.25rem 1rem;margin-bottom:1rem">
      ${sugestoes.map(f=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-light)">
        <div style="flex:1;min-width:0"><strong style="font-size:13px;display:block">${escapeHtml(f.nome)}</strong><span style="font-size:11px;color:var(--text2)">${escapeHtml(f.cidade||'')}${f.marca?' · '+escapeHtml(f.marca):''}</span></div>
        <button class="btn btn-primary btn-sm" data-add-parada="${f.id}"><i class="ti ti-plus"></i></button>
      </div>`).join('')}
    </div>`:busca?'<p class="dash-date" style="margin-bottom:1rem">Nenhuma loja encontrada.</p>':''}
  `;
  document.getElementById('btn-voltar-editar-rota')?.addEventListener('click',()=>{rotEditState.rotaId=null;_renderSalvas();});
  document.getElementById('busca-parada')?.addEventListener('input',e=>{rotEditState.buscaLoja=e.target.value;_renderEditarRota();});
  document.querySelectorAll('[data-remover-parada]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const lojaId=btn.dataset.removerParada;
      const loja=(rota.lojas||[]).find(l=>l.id===lojaId);
      const coletada=!!motorState.checkins?.[lojaId]?.done;
      const ok=await confirmarAcao({
        titulo:'Remover parada?',
        mensagem:coletada
          ?`Atenção: "${loja?.nome}" já tem check-in de coleta registrado. Remover a parada NÃO apaga o check-in já feito, só tira essa loja da lista da rota.`
          :`A loja "${loja?.nome}" será removida desta rota.`,
        textoConfirmar:'Remover'
      });
      if(!ok)return;
      const idx=rota.lojas.findIndex(l=>l.id===lojaId);
      if(idx>=0) rota.lojas.splice(idx,1);
      rota.nLojas=rota.lojas.length;
      salvarRotasSalvas();
      mostrarToast('Parada removida.','sucesso');
      _renderEditarRota();
    });
  });
  document.querySelectorAll('[data-add-parada]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const forn=FORNS_ROT.find(f=>f.id===btn.dataset.addParada);
      if(!forn)return;
      if(!rota.lojas) rota.lojas=[];
      rota.lojas.push({id:`${rota.id}_${forn.id}`,nome:forn.nome,cidade:forn.cidade,marca:forn.rede||forn.marca,endereco:forn.endereco,dist:0});
      rota.nLojas=rota.lojas.length;
      salvarRotasSalvas();
      mostrarToast('Parada adicionada.','sucesso');
      rotEditState.buscaLoja='';
      _renderEditarRota();
    });
  });
}

function _bindEmail(){
  document.getElementById('email-salvar')?.addEventListener('click',()=>{
    window.wppCfg.emailPublicKey=document.getElementById('email-publickey').value.trim();
    window.wppCfg.emailServiceId=document.getElementById('email-serviceid').value.trim();
    window.wppCfg.emailTemplateId=document.getElementById('email-templateid').value.trim();
    window.wppCfg.emailGestorTyre=document.getElementById('email-gestor').value.trim();
    window.wppCfg.emailAtivo=document.getElementById('email-ativo').checked;
    document.querySelectorAll('.email-rede-inp').forEach(inp=>{
      const rede=inp.dataset.rede;
      const val=inp.value.trim();
      if(!REDES_CONTATO[rede]) REDES_CONTATO[rede]={};
      REDES_CONTATO[rede].email=val;
    });
    wppSalvarCfg();
    salvarRedesContato();
    mostrarToast('Configuração de e-mail salva!','sucesso');
  });
}

function _wppMsgs(c){
  const varsCI=['{rota}','{motorista}','{placa}','{loja}','{total}','{estourados}','{pct}','{limite}','{hora}'];
  const varsTR=['{placa}','{motorista}','{total}','{lixo}','{pct}','{limite}','{hora}'];
  function preview(tmpl,dados){
    let m=tmpl;Object.entries(dados).forEach(([k,v])=>{m=m.replaceAll(`{${k}}`,v);});
    return m.replace(/\*(.*?)\*/g,'<strong>$1</strong>').replace(/_(.*?)_/g,'<em style="color:var(--text2)">$1</em>').replace(/\n/g,'<br>');
  }
  const dci={rota:'Rota Barretos',motorista:'Herlon Carrera',placa:'FPW-9J58',loja:'DPASCHOAL BARRETOS',total:'317',estourados:'108',pct:'34',limite:c.limiteCheckin||30,hora:'14:35'};
  const dtr={placa:'FPW-9J58',motorista:'Herlon Carrera',total:'459',lixo:'156',pct:'34',limite:c.limiteTriagem||30,hora:'16:20'};
  return `
  <div class="section-title">Mensagem check-in</div>
  <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">${varsCI.map(v=>`<span class="wpp-var" data-v="${v}" data-t="wpp-mci" style="font-size:10px;padding:2px 7px;border-radius:20px;background:var(--bg);border:0.5px solid var(--border);cursor:pointer;color:var(--text2)">${v}</span>`).join('')}</div>
  <textarea id="wpp-mci" style="font-size:12px;line-height:1.6" rows="6">${c.msgCheckin||''}</textarea>
  <div style="background:#E7F8DC;border-radius:12px 12px 2px 12px;padding:10px 12px;margin:6px 0;font-size:12px;line-height:1.6;border:0.5px solid #C5E8A3" id="prev-ci">${preview(c.msgCheckin||'',dci)}</div>

function _wppLog(log){
  if(!log.length) return `<div class="empty"><i class="ti ti-inbox"></i><p>Nenhum envio registrado.</p></div>`;
  const ok=log.filter(l=>l.tipo!=='err').length, err=log.filter(l=>l.tipo==='err').length;
  return `
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
    <div class="stat-box"><div class="sv">${log.length}</div><div class="sl">Total</div></div>
    <div class="stat-box verde"><div class="sv">${ok}</div><div class="sl">Enviados</div></div>
    <div class="stat-box vermelho"><div class="sv">${err}</div><div class="sl">Erros</div></div>
  </div>
  <div class="card" style="padding:.75rem 1rem">
    ${[...log].reverse().map(l=>`<div style="display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-light)">
      <div style="width:32px;height:32px;border-radius:50%;background:${l.tipo==='err'?'var(--red-bg)':l.tipo==='warn'?'var(--orange-bg)':'var(--green-bg)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <i class="ti ti-${l.tipo==='err'?'alert-circle':l.tipo==='warn'?'alert-triangle':'circle-check'}" style="font-size:15px;color:${l.tipo==='err'?'var(--red)':l.tipo==='warn'?'var(--orange)':'var(--green)'}"></i>
      </div>
      <div style="flex:1;min-width:0">
        <strong style="font-size:13px;display:block">${l.titulo}</strong>
        <span style="font-size:11px;color:var(--text2)">${l.hora}</span>
        <div style="font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.msg}</div>
      </div>
    </div>`).join('')}
  </div>
  <button class="btn btn-danger btn-sm btn-block" id="wpp-limpar-log"><i class="ti ti-trash"></i> Limpar log</button>`;
}

function bindAbaCustosRede(){
  document.getElementById('custo-rede-sel')?.addEventListener('change',e=>{
    cadastrosState.custoRede=e.target.value;
    renderCadastros();
  });
  document.getElementById('btn-usar-nova-rede')?.addEventListener('click',()=>{
    const nome=document.getElementById('custo-nova-rede').value.trim().toUpperCase();
    if(!nome)return;
    cadastrosState.custoRede=nome;
    if(!CUSTOS_REDE[nome]) CUSTOS_REDE[nome]=[];
    renderCadastros();
  });
  document.getElementById('btn-nova-vigencia')?.addEventListener('click',()=>{
    cadastrosState.custoVigenciaId='nova';
    renderCadastros();
  });
  document.getElementById('btn-vigencia-cancelar')?.addEventListener('click',()=>{
    cadastrosState.custoVigenciaId=null;
    renderCadastros();
  });
  document.querySelectorAll('[data-editar-vigencia]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      cadastrosState.custoVigenciaId=btn.dataset.editarVigencia;
      renderCadastros();
    });
  });
  document.querySelectorAll('[data-remover-vigencia]').forEach(btn=>{
    btn.addEventListener('click',async()=>{
      const rede=cadastrosState.custoRede;
      const id=btn.dataset.removerVigencia;
      const ok=await confirmarAcao({titulo:'Remover vigência?',mensagem:'Essa vigência de custo será removida permanentemente.',textoConfirmar:'Remover'});
      if(!ok)return;
      CUSTOS_REDE[rede]=(CUSTOS_REDE[rede]||[]).filter(v=>v.id!==id);
      salvarCustosRede();
      renderCadastros();
    });
  });
  document.getElementById('btn-salvar-vigencia')?.addEventListener('click',()=>{
    const rede=cadastrosState.custoRede;
    const inicio=document.getElementById('vig-inicio').value;
    const fim=document.getElementById('vig-fim').value;
    const erroEl=document.getElementById('vig-erro');
    erroEl.style.display='none';
    if(!inicio){
      erroEl.textContent='Informe a data de início da vigência.';
      erroEl.style.display='block';return;
    }
    if(fim&&fim<inicio){
      erroEl.textContent='A data de término não pode ser antes do início.';
      erroEl.style.display='block';return;
    }
    const custos={};
    document.querySelectorAll('.custo-item-inp').forEach(inp=>{custos[inp.dataset.item]=parseFloat(inp.value)||0;});
    if(!CUSTOS_REDE[rede]) CUSTOS_REDE[rede]=[];
    const editandoId=cadastrosState.custoVigenciaId;
    if(editandoId&&editandoId!=='nova'){
      const v=CUSTOS_REDE[rede].find(x=>x.id===editandoId);
      if(v){ v.vigenciaInicio=inicio; v.vigenciaFim=fim; v.custos=custos; }
    } else {
      CUSTOS_REDE[rede].push({id:'vig'+Date.now(),vigenciaInicio:inicio,vigenciaFim:fim,custos});
    }
    salvarCustosRede();
    cadastrosState.custoVigenciaId=null;
    renderCadastros();
    mostrarToast('Vigência de custo salva.','sucesso');
  });
}

    const nome=document.getElementById('loja-nome').value.trim();
    const cidade=document.getElementById('loja-cidade').value.trim().toUpperCase();
    const uf=document.getElementById('loja-uf').value.trim().toUpperCase();
    const rede=document.getElementById('loja-rede').value.trim().toUpperCase();
    const codLoja=document.getElementById('loja-codloja').value.trim().toUpperCase();
    const cep=document.getElementById('loja-cep').value.trim();
    const endereco=document.getElementById('loja-endereco').value.trim();
    const periodicidade=parseInt(document.getElementById('loja-periodicidade').value)||30;
    const observacao=document.getElementById('loja-observacao').value.trim();
    const erroEl=document.getElementById('loja-erro');
    erroEl.style.display='none';
    if(!nome||!cidade||!uf){
      erroEl.textContent='Preencha loja, cidade e UF.';
      erroEl.style.display='block'; return;
    }
    FORNS_ROT.push({id:'loja'+Date.now(),nome,cidade,uf,rede,marca:inferMarcaCode(rede),codLoja,cep,endereco,observacao,uc:'',ciclo:periodicidade});

    renderCadastros();
  });

    btn.addEventListener('click',()=>{
      const i=parseInt(btn.dataset.removerCliente);
      if(!confirm(`Remover ${CLIENTES_VND[i].nome}?`))return;
      CLIENTES_VND.splice(i,1);
      salvarClientesCad();
      renderCadastros();
    });

    if(!nome){ erroEl.textContent='Digite o nome do cliente.'; erroEl.style.display='block'; return; }
    CLIENTES_VND.push({id:String(Date.now()),nome});
    salvarClientesCad();
    renderCadastros();
  });
}

// ── GESTOR/FINANCEIRO: Financeiro (dados reais de vendas e rotas) ────────────
function svgChartFinanceiro(data){
  const w=340,h=170,padL=6,padR=6,padB=22,padT=14;
  const max=Math.max(1,...data.map(p=>Math.max(p.receita,p.custo)))*1.15;
  const bw=(w-padL-padR)/data.length;
  const barW=Math.min(20,bw*0.32);
  const usableH=h-padT-padB;
  let bars='',grid='',pontosMargem=[];
  // Linhas de grade horizontais (25/50/75/100%) para facilitar leitura
  [0.25,0.5,0.75,1].forEach(f=>{
    const y=padT+usableH-usableH*f;
    grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#EFEFED" stroke-width="1"/>`;
  });
  data.forEach((p,i)=>{
    const cx=padL+i*bw+bw/2;
    const hR=(p.receita/max)*usableH;
    const hC=(p.custo/max)*usableH;
    const xR=cx-barW-2, xC=cx+2;
    bars+=`<rect x="${xR}" y="${padT+usableH-hR}" width="${barW}" height="${hR}" rx="2" fill="#1D7A4F"/>`;
    bars+=`<rect x="${xC}" y="${padT+usableH-hC}" width="${barW}" height="${hC}" rx="2" fill="#B85C00"/>`;
    bars+=`<text x="${cx}" y="${h-6}" font-size="9" text-anchor="middle" fill="#6B6B65" font-family="-apple-system,sans-serif">${p.l}</text>`;
    const margem=p.receita-p.custo;
    const hM=padT+usableH-(margem/max)*usableH;
    pontosMargem.push(`${cx},${hM}`);
  });
  const linhaMargem=pontosMargem.length>1?`<polyline points="${pontosMargem.join(' ')}" fill="none" stroke="#1A5FA8" stroke-width="2" stroke-dasharray="4,3"/>`:'';
  const marcadores=pontosMargem.map(pt=>{const[x,y]=pt.split(',');return `<circle cx="${x}" cy="${y}" r="2.5" fill="#1A5FA8"/>`;}).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    ${grid}
    <line x1="${padL}" y1="${padT+usableH}" x2="${w-padR}" y2="${padT+usableH}" stroke="#E5E4E0" stroke-width="1"/>
    ${bars}
    ${linhaMargem}
    ${marcadores}
  </svg>`;
}

// ── Gráfico comparativo (período atual x período anterior) ───────────────────
function svgChartComparativo(itens){
  const w=340,h=170,padL=6,padR=6,padB=28,padT=14;
  const valores=itens.flatMap(i=>[i.atual,i.anterior]);
  const max=Math.max(1,...valores.map(v=>Math.abs(v)))*1.15;
  const bw=(w-padL-padR)/itens.length;
  const barW=Math.min(26,bw*0.32);
  const usableH=h-padT-padB;
  const zeroY=padT+usableH; // assume valores não-negativos nesta visão
  let bars='',grid='';
  [0.25,0.5,0.75,1].forEach(f=>{
    const y=padT+usableH-usableH*f;
    grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#EFEFED" stroke-width="1"/>`;
  });
  itens.forEach((it,i)=>{
    const cx=padL+i*bw+bw/2;
    const hA=(Math.abs(it.anterior)/max)*usableH;
    const hAt=(Math.abs(it.atual)/max)*usableH;
    const xA=cx-barW-2, xAt=cx+2;
    bars+=`<rect x="${xA}" y="${zeroY-hA}" width="${barW}" height="${hA}" rx="2" fill="#A8A8A2"/>`;
    bars+=`<rect x="${xAt}" y="${zeroY-hAt}" width="${barW}" height="${hAt}" rx="2" fill="${it.atual>=it.anterior?'#1D7A4F':'#B02020'}"/>`;
    bars+=`<text x="${cx}" y="${h-14}" font-size="9" text-anchor="middle" fill="#6B6B65" font-family="-apple-system,sans-serif">${it.l}</text>`;
    const delta=it.anterior?((it.atual-it.anterior)/Math.abs(it.anterior)*100):0;
    const cor=delta>=0?'#1D7A4F':'#B02020';
    bars+=`<text x="${cx}" y="${h-4}" font-size="8" font-weight="700" text-anchor="middle" fill="${cor}" font-family="-apple-system,sans-serif">${delta>=0?'▲':'▼'} ${Math.abs(delta).toFixed(0)}%</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    ${grid}
    <line x1="${padL}" y1="${zeroY}" x2="${w-padR}" y2="${zeroY}" stroke="#E5E4E0" stroke-width="1"/>
    ${bars}
  </svg>`;
}

function linhaComparativo(label,atual,anterior,inverso){
  if(anterior==null) return '';
  const delta=anterior?((atual-anterior)/Math.abs(anterior)*100):(atual>0?100:0);
  const subiu=delta>0.05, desceu=delta<-0.05;
  const bom=inverso?!subiu:subiu;
  const cor=(!subiu&&!desceu)?'var(--text2)':(bom?'var(--green)':'var(--red)');
  const seta=(!subiu&&!desceu)?'—':(subiu?'▲':'▼');
  return `<div class="fin-row"><span class="fl">${label}</span><span class="fv" style="display:flex;align-items:center;gap:6px"><span>${fmtM(atual)}</span><span style="font-size:11px;color:${cor};font-weight:700">${seta} ${Math.abs(delta).toFixed(0)}%</span></span></div>`;
}

function renderPedidoFinanceiro(p){
  const ui=finPedidoUI[p.id]||{};
  const total=valorTotalPedido(p),pago=valorPagoPedido(p),saldo=saldoPedido(p);
  const status=statusPedido(p);
  const statusInfo={pago:{label:'Pago',cor:'verde'},parcial:{label:'Parcial',cor:'laranja'},pendente:{label:'Pendente',cor:'vermelho'}}[status];
  const nfs=p.notasFiscais||[];
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
      <div style="min-width:0">
        <strong style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px">${escapeHtml(p.cliente.split(' ').slice(0,4).join(' '))}</strong>
        <span style="font-size:11px;color:var(--text2)">${p.hora} · ${p.pneus} pneus · ${escapeHtml(p.pagamento||'')}${p.filial?' · '+escapeHtml(p.filial):''}</span>
        ${(p.numeroNF||p.numeroBoleto)?`<div style="font-size:10px;color:var(--text3)">${p.numeroNF?'NF '+escapeHtml(p.numeroNF):''}${p.numeroNF&&p.numeroBoleto?' · ':''}${p.numeroBoleto?'Boleto '+escapeHtml(p.numeroBoleto):''}</div>`:''}
      </div>
      <span class="badge ${statusInfo.cor}" style="flex-shrink:0">${statusInfo.label}</span>
    </div>
    <div class="fin-row"><span class="fl">Valor total (a pagar)</span><span class="fv">${fmtM(total)}</span></div>
    <div class="fin-row"><span class="fl">Valor pago</span><span class="fv pos">${fmtM(pago)}</span></div>
    <div class="fin-row"><span class="fl">Saldo em aberto</span><span class="fv ${saldo>0.009?'neg':'pos'}">${fmtM(Math.max(0,saldo))}</span></div>

    <div style="margin-top:8px">
      <div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px">Notas fiscais vinculadas</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${nfs.length?nfs.map((nf,i)=>`<span class="badge azul" style="gap:6px">NF ${nf.numero}${nf.valor?` · ${fmtM(nf.valor)}`:''} <i class="ti ti-x" data-rm-nf="${p.id}|${i}" style="cursor:pointer;font-size:11px;margin-left:2px"></i></span>`).join(''):'<span style="font-size:12px;color:var(--text3)">Nenhuma NF vinculada</span>'}
      </div>
    </div>

    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-secondary btn-sm" data-nf-toggle="${p.id}"><i class="ti ti-file-invoice"></i> Vincular NF</button>
      ${saldo>0.009?`<button class="btn btn-primary btn-sm" data-pag-toggle="${p.id}"><i class="ti ti-cash"></i> Registrar pagamento</button>`:''}
    </div>

    ${ui.nfAberto?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light);display:flex;gap:6px;align-items:end">
      <div style="flex:1"><label style="font-size:10px;color:var(--text2);display:block;margin-bottom:3px">Número da NF</label><input type="text" id="nf-num-${p.id}" placeholder="Ex: 12345"></div>
      <div style="width:96px"><label style="font-size:10px;color:var(--text2);display:block;margin-bottom:3px">Valor</label><input type="number" step="0.01" min="0" id="nf-val-${p.id}" placeholder="0,00"></div>
      <button class="btn btn-primary btn-sm" data-nf-add="${p.id}"><i class="ti ti-plus"></i></button>
    </div>`:''}

    ${ui.pagAberto?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-light)">
      <div style="display:flex;gap:6px;align-items:end;margin-bottom:8px">
        <div style="flex:1"><label style="font-size:10px;color:var(--text2);display:block;margin-bottom:3px">Valor pago agora</label><input type="number" step="0.01" min="0" id="pag-val-${p.id}" placeholder="${saldo.toFixed(2)}"></div>
        <div style="width:110px"><label style="font-size:10px;color:var(--text2);display:block;margin-bottom:3px">Forma</label>
          <select id="pag-forma-${p.id}">${PAGS.map(pg=>`<option value="${pg.nome}">${pg.nome}</option>`).join('')}</select>
        </div>
        <button class="btn btn-primary btn-sm" data-pag-add="${p.id}"><i class="ti ti-check"></i></button>
      </div>
      ${p.pagamentos&&p.pagamentos.length?`<div style="font-size:11px;color:var(--text2)">Já pago: ${p.pagamentos.map(pg=>`${pg.forma} ${fmtM(pg.valor)} (${pg.hora})`).join(' · ')}</div>`:''}
    </div>`:''}
  </div>`;
}

function renderFinanceiro(){
  sincronizarCaminhoesConf();
  const d=financeiroState.periodo==='dia'?getFinanceiroDia():FIN_DATA[financeiroState.periodo];
  const dre=calcDRE(d,financeiroState.periodo);

// ── FINANCEIRO: Relatórios filtráveis (vendas, pagamentos, NFs) ───────────────
function pedidosFiltrados(){
  return vendasState.historico.filter(p=>{
    if(relatorioState.cliente && !p.cliente.toLowerCase().includes(relatorioState.cliente.toLowerCase()))return false;
    if(relatorioState.dataDe && p.dataISO<relatorioState.dataDe)return false;
    if(relatorioState.dataAte && p.dataISO>relatorioState.dataAte)return false;
    if(relatorioState.pagamento && p.pagamento!==relatorioState.pagamento)return false;
    if(relatorioState.situacao==='aberto' && saldoPedido(p)<=0.009)return false;
    if(relatorioState.situacao==='pago' && saldoPedido(p)>0.009)return false;
    if(relatorioState.nf){
      const achou=(p.notasFiscais||[]).some(nf=>nf.numero.toLowerCase().includes(relatorioState.nf.toLowerCase()));
      if(!achou)return false;
    }
    return true;
  }).slice().reverse();
}

// Agrupa os pedidos em aberto por cliente, somando o saldo devedor de cada um — usado na
// visão "Em aberto" pra facilitar a cobrança (quem deve mais aparece primeiro).
function agruparSaldoPorCliente(lista){
  const map={};
  lista.forEach(p=>{
    const saldo=Math.max(0,saldoPedido(p));
    if(saldo<=0.009)return;
    if(!map[p.cliente]) map[p.cliente]={cliente:p.cliente,totalAberto:0,qtdPedidos:0,maisAntiga:p.dataISO||''};
    map[p.cliente].totalAberto+=saldo;
    map[p.cliente].qtdPedidos+=1;
    if(p.dataISO&&(!map[p.cliente].maisAntiga||p.dataISO<map[p.cliente].maisAntiga)) map[p.cliente].maisAntiga=p.dataISO;
  });
  return Object.values(map).sort((a,b)=>b.totalAberto-a.totalAberto);
}

// ── Exportação de relatórios para Excel real (.xlsx) ──────────────────────────
function exportarRelatorioExcel(lista,porCliente){
  const wb=XLSX.utils.book_new();

  // Aba 1: pedidos detalhados
  const linhasPedidos=[
    ['Cliente','Data','Hora','Pagamento','Filial','Total','Pago','Saldo','NFs emitidas']
  ];
  lista.forEach(p=>{
    linhasPedidos.push([
      p.cliente, p.data||'', p.hora||'', p.pagamento||'', p.filial||'',
      valorTotalPedido(p), valorPagoPedido(p), Math.max(0,saldoPedido(p)),
      (p.notasFiscais||[]).map(nf=>nf.numero).join(', ')
    ]);
  });
  const totalValor=lista.reduce((s,p)=>s+valorTotalPedido(p),0);
  const totalPago=lista.reduce((s,p)=>s+valorPagoPedido(p),0);
  const totalSaldo=lista.reduce((s,p)=>s+Math.max(0,saldoPedido(p)),0);
  linhasPedidos.push([]);
  linhasPedidos.push(['TOTAL',...Array(4).fill(''),totalValor,totalPago,totalSaldo,'']);
  const wsPedidos=XLSX.utils.aoa_to_sheet(linhasPedidos);
  wsPedidos['!cols']=[{wch:28},{wch:12},{wch:8},{wch:14},{wch:16},{wch:12},{wch:12},{wch:12},{wch:20}];
  XLSX.utils.book_append_sheet(wb,wsPedidos,'Pedidos');

  // Aba 2: cobrança por cliente (só quando o filtro "Em aberto" está ativo)
  if(porCliente&&porCliente.length){
    const linhasCobranca=[['Cliente','Pedidos em aberto','Em aberto desde','Total a receber']];
    porCliente.forEach(c=>{
      linhasCobranca.push([c.cliente,c.qtdPedidos,c.maisAntiga?c.maisAntiga.split('-').reverse().join('/'):'',c.totalAberto]);
    });
    const wsCobranca=XLSX.utils.aoa_to_sheet(linhasCobranca);
    wsCobranca['!cols']=[{wch:28},{wch:16},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb,wsCobranca,'Cobrança por cliente');
  }

  const nomeArquivo=`relatorio-financeiro-${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb,nomeArquivo);
}
