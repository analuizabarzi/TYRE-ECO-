// ── FINANCEIRO: Relatórios filtráveis (vendas, pagamentos, NFs) ───────────────
function pedidosFiltrados(){
  return vendasState.historico.filter(p=>{
    if(relatorioState.cliente && !p.cliente.toLowerCase().includes(relatorioState.cliente.toLowerCase()))return false;
    if(relatorioState.dataDe && p.dataISO<relatorioState.dataDe)return false;
    if(relatorioState.dataAte && p.dataISO>relatorioState.dataAte)return false;
    if(relatorioState.pagamento && p.pagamento!==relatorioState.pagamento)return false;
    if(relatorioState.situacao==='aberto' && saldoPedido(p)<=0.009)return false;
    if(relatorioState.situacao==='pago' && saldoPedido(p)>0.009)return false;
    if(relatorioState.nf){
      const achou=(p.notasFiscais||[]).some(nf=>nf.numero.toLowerCase().includes(relatorioState.nf.toLowerCase()));
      if(!achou)return false;
    }
    return true;
  }).slice().reverse();
}

// Agrupa os pedidos em aberto por cliente, somando o saldo devedor de cada um — usado na
// visão "Em aberto" pra facilitar a cobrança (quem deve mais aparece primeiro).
function agruparSaldoPorCliente(lista){
  const map={};
  lista.forEach(p=>{
    const saldo=Math.max(0,saldoPedido(p));
    if(saldo<=0.009)return;
    if(!map[p.cliente]) map[p.cliente]={cliente:p.cliente,totalAberto:0,qtdPedidos:0,maisAntiga:p.dataISO||''};
    map[p.cliente].totalAberto+=saldo;
    map[p.cliente].qtdPedidos+=1;
    if(p.dataISO&&(!map[p.cliente].maisAntiga||p.dataISO<map[p.cliente].maisAntiga)) map[p.cliente].maisAntiga=p.dataISO;
  });
  return Object.values(map).sort((a,b)=>b.totalAberto-a.totalAberto);
}

// ── Exportação de relatórios para Excel real (.xlsx) ──────────────────────────
function exportarRelatorioExcel(lista,porCliente){
  const wb=XLSX.utils.book_new();

  // Aba 1: pedidos detalhados
  const linhasPedidos=[
    ['Cliente','Data','Hora','Pagamento','Filial','Total','Pago','Saldo','NFs emitidas']
  ];
  lista.forEach(p=>{
    linhasPedidos.push([
      p.cliente, p.data||'', p.hora||'', p.pagamento||'', p.filial||'',
      valorTotalPedido(p), valorPagoPedido(p), Math.max(0,saldoPedido(p)),
      (p.notasFiscais||[]).map(nf=>nf.numero).join(', ')
    ]);
  });
  const totalValor=lista.reduce((s,p)=>s+valorTotalPedido(p),0);
  const totalPago=lista.reduce((s,p)=>s+valorPagoPedido(p),0);
  const totalSaldo=lista.reduce((s,p)=>s+Math.max(0,saldoPedido(p)),0);
  linhasPedidos.push([]);
  linhasPedidos.push(['TOTAL',...Array(4).fill(''),totalValor,totalPago,totalSaldo,'']);
  const wsPedidos=XLSX.utils.aoa_to_sheet(linhasPedidos);
  wsPedidos['!cols']=[{wch:28},{wch:12},{wch:8},{wch:14},{wch:16},{wch:12},{wch:12},{wch:12},{wch:20}];
  XLSX.utils.book_append_sheet(wb,wsPedidos,'Pedidos');

  // Aba 2: cobrança por cliente (só quando o filtro "Em aberto" está ativo)
  if(porCliente&&porCliente.length){
    const linhasCobranca=[['Cliente','Pedidos em aberto','Em aberto desde','Total a receber']];
    porCliente.forEach(c=>{
      linhasCobranca.push([c.cliente,c.qtdPedidos,c.maisAntiga?c.maisAntiga.split('-').reverse().join('/'):'',c.totalAberto]);
    });
    const wsCobranca=XLSX.utils.aoa_to_sheet(linhasCobranca);
    wsCobranca['!cols']=[{wch:28},{wch:16},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb,wsCobranca,'Cobrança por cliente');
  }

  const nomeArquivo=`relatorio-financeiro-${new Date().toISOString().slice(0,10)}.xlsx`;
  XLSX.writeFile(wb,nomeArquivo);
}

function imprimirRelatorioFiltrado(lista){
  const totalValor=lista.reduce((s,p)=>s+valorTotalPedido(p),0);
  const totalPago=lista.reduce((s,p)=>s+valorPagoPedido(p),0);
  const totalSaldo=lista.reduce((s,p)=>s+Math.max(0,saldoPedido(p)),0);
  const win=window.open('','_blank');
  if(!win)return;
  win.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório Financeiro — Tyre Eco</title>
    <style>
      body{font-family:-apple-system,Arial,sans-serif;padding:32px;color:#1A1A18;max-width:760px;margin:0 auto}
      h1{font-size:19px;margin-bottom:2px}
      h2{font-size:12px;color:#6B6B65;font-weight:400;margin-bottom:18px}
      table{width:100%;border-collapse:collapse;margin-bottom:6px}
      td,th{padding:6px 4px;border-bottom:1px solid #E5E4E0;font-size:12px;text-align:left}
      th{color:#6B6B65;font-size:10px;text-transform:uppercase}
      td:not(:first-child),th:not(:first-child){text-align:right}
      .tot td{font-weight:700;border-top:2px solid #1A1A18;border-bottom:none}
      @media print{body{padding:12px}}
    </style></head><body>
    <h1>Relatório Financeiro — Tyre Eco</h1>
    <h2>Filtros: cliente="${relatorioState.cliente||'todos'}" · situação="${relatorioState.situacao==='aberto'?'em aberto':relatorioState.situacao==='pago'?'pago':'todas'}" · período="${relatorioState.dataDe||'início'} a ${relatorioState.dataAte||'hoje'}" · pagamento="${relatorioState.pagamento||'todas'}" · NF="${relatorioState.nf||'todas'}" · Gerado em ${today()} ${now()}</h2>
    <table><tr><th>Cliente</th><th>Data</th><th>Pagamento</th><th>Total</th><th>Pago</th><th>Saldo</th><th>NFs</th></tr>
      ${lista.map(p=>`<tr><td>${escapeHtml(p.cliente)}</td><td>${p.data||'—'}</td><td>${escapeHtml(p.pagamento||'')}</td><td>${fmtM(valorTotalPedido(p))}</td><td>${fmtM(valorPagoPedido(p))}</td><td>${fmtM(Math.max(0,saldoPedido(p)))}</td><td>${(p.notasFiscais||[]).map(nf=>escapeHtml(nf.numero)).join(', ')||'—'}</td></tr>`).join('')||'<tr><td colspan="7">Nenhum pedido encontrado com esses filtros.</td></tr>'}
      <tr class="tot"><td colspan="3">Total (${lista.length} pedido${lista.length!==1?'s':''})</td><td>${fmtM(totalValor)}</td><td>${fmtM(totalPago)}</td><td>${fmtM(totalSaldo)}</td><td></td></tr>
    </table>
  </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(()=>win.print(),200);
}

// ── Excluir / editar vendas (individual e em grupo) ───────────────────────────
async function excluirVenda(id){
  const v=vendasState.historico.find(x=>x.id===id);
  if(!v)return;
  const ok=await confirmarAcao({
    titulo:'Excluir venda?',
    mensagem:`A venda de ${v.cliente} (${fmtM(valorTotalPedido(v))}, ${v.data||'sem data'}) será removida permanentemente. Essa ação não pode ser desfeita.`,
    textoConfirmar:'Excluir venda'
  });
  if(!ok)return;
  vendasState.historico=vendasState.historico.filter(x=>x.id!==id);
  relatorioSel.delete(id);
  await salvarVendasHistorico();
  mostrarToast('Venda excluída.','sucesso');
  renderRelatorioFinanceiro();
}

async function excluirVendasSelecionadas(){
  const ids=[...relatorioSel];
  if(ids.length===0)return;
  const totalSel=vendasState.historico.filter(v=>ids.includes(v.id)).reduce((s,v)=>s+valorTotalPedido(v),0);
  const ok=await confirmarAcao({
    titulo:`Excluir ${ids.length} venda${ids.length>1?'s':''}?`,
    mensagem:`${ids.length} venda${ids.length>1?'s selecionadas somam':' selecionada soma'} ${fmtM(totalSel)} e ${ids.length>1?'serão removidas':'será removida'} permanentemente. Essa ação não pode ser desfeita.`,
    textoConfirmar:`Excluir ${ids.length} venda${ids.length>1?'s':''}`
  });
  if(!ok)return;
  vendasState.historico=vendasState.historico.filter(x=>!ids.includes(x.id));
  relatorioSel.clear();
  await salvarVendasHistorico();
  mostrarToast(`${ids.length} venda${ids.length>1?'s excluídas':' excluída'}.`,'sucesso');
  renderRelatorioFinanceiro();
}

// Edição individual: cliente, forma de pagamento, valor total, NF/boleto e
// observação. O mix de pneus por medida não é editado aqui (fica só na venda
// original) — é um ajuste rápido para corrigir erros de lançamento.
function abrirEditarVenda(id){
  const v=vendasState.historico.find(x=>x.id===id);
  if(!v)return;
  abrirModal(`
    <h3>Editar venda</h3>
    <p class="modal-desc">${v.data||''} ${v.hora?'· '+v.hora:''} · ${v.pneus||0} pneus (mix não é editável aqui)</p>
    <div class="form-group"><label class="login-label">Cliente</label><input class="login-input" id="edit-vnd-cliente" value="${escapeHtml(v.cliente||'')}"></div>
    <div class="form-group"><label class="login-label">Forma de pagamento</label>
      <select class="login-input" id="edit-vnd-pagamento">
        ${PAGS.map(p=>`<option value="${p.nome}" ${v.pagamento===p.nome?'selected':''}>${p.nome}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label class="login-label">Valor total (R$)</label><input class="login-input" id="edit-vnd-valor" type="number" step="0.01" min="0" value="${valorTotalPedido(v)}"></div>
    <div class="form-group"><label class="login-label">Nº NF/boleto (opcional)</label><input class="login-input" id="edit-vnd-nf" value="${escapeHtml(v.numeroNF||'')}"></div>
    <div class="form-group"><label class="login-label">Observação</label><input class="login-input" id="edit-vnd-obs" value="${escapeHtml(v.obs||'')}"></div>
    <div class="login-erro" id="edit-vnd-erro"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1;justify-content:center" id="edit-vnd-cancelar">Cancelar</button>
      <button class="btn btn-primary" style="flex:1;justify-content:center" id="edit-vnd-salvar"><i class="ti ti-device-floppy"></i> Salvar</button>
    </div>`);
  document.getElementById('edit-vnd-cancelar').addEventListener('click', fecharModal);
  document.getElementById('edit-vnd-salvar').addEventListener('click', async ()=>{
    const cliente=document.getElementById('edit-vnd-cliente').value.trim();
    const pagamento=document.getElementById('edit-vnd-pagamento').value;
    const valorNovo=parseFloat(document.getElementById('edit-vnd-valor').value);
    const nf=document.getElementById('edit-vnd-nf').value.trim();
    const obs=document.getElementById('edit-vnd-obs').value;
    const erroEl=document.getElementById('edit-vnd-erro');
    if(!cliente||!(valorNovo>=0)||isNaN(valorNovo)){
      erroEl.textContent='Preencha o cliente e um valor válido.';
      erroEl.style.display='block';
      return;
    }
    // Se a venda já tinha um pagamento único "à vista", mantém o valor/forma
    // sincronizados para o saldo (valorTotal - pago) continuar correto.
    if(v.pagamentos&&v.pagamentos.length===1){
      v.pagamentos[0].valor=valorNovo;
      v.pagamentos[0].forma=pagamento;
    }
    v.cliente=cliente;
    v.pagamento=pagamento;
    v.valor=valorNovo;
    v.valorTotal=valorNovo;
    v.numeroNF=nf;
    v.obs=obs;
    if(nf && v.notasFiscais && v.notasFiscais.length===1){ v.notasFiscais[0].numero=nf; v.notasFiscais[0].valor=valorNovo; }
    await salvarVendasHistorico();
    fecharModal();
    mostrarToast('Venda atualizada.','sucesso');
    renderRelatorioFinanceiro();
  });
}

function _renderPlanoContasModal(){
  const receitas=planoContas.filter(c=>c.tipo==='receita');
  const despesas=planoContas.filter(c=>c.tipo==='despesa');
  abrirModal(`
    <h3>Plano de contas</h3>

        <option value="despesa">Despesa</option>
        <option value="receita">Receita</option>
      </select>
      <button class="btn btn-primary btn-sm" id="pc-add"><i class="ti ti-plus"></i></button>
    </div>
    <div class="modal-actions"><button class="btn btn-secondary" style="flex:1;justify-content:center" id="pc-fechar">Fechar</button></div>
  `);
  document.getElementById('pc-fechar').addEventListener('click', fecharModal);
  document.getElementById('pc-add').addEventListener('click', async ()=>{
    const nome=document.getElementById('pc-novo-nome').value.trim();
    const tipo=document.getElementById('pc-novo-tipo').value;

  });
  document.querySelectorAll('[data-pc-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id=btn.dataset.pcDel;
      const emUso=CONTAS_RECEBER.some(c=>c.contaId===id)||contasPagarState.itens.some(c=>c.contaId===id);
      if(emUso){ mostrarToast('Essa categoria está em uso em alguma conta e não pode ser excluída.','erro'); return; }
      planoContas=planoContas.filter(c=>c.id!==id);

    });
  });
}

// ── Contas a receber: adicionar, editar, excluir, registrar recebimento ─────
// ── Parcelamento (usado tanto em Contas a Receber quanto em Contas a Pagar) ──
// Cada parcela vira uma conta independente (própria data, valor e pagamentos),
// só marcada com {numero, total, grupoId} pra aparecer ligada na lista.
function addMesesISO(iso, n){
  const d=new Date(iso+'T12:00:00');
  d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}
function _htmlParcelamento(prefixo){
  return `
    <label style="display:flex;align-items:center;gap:8px;margin:2px 0 12px;font-size:13px">
      <input type="checkbox" id="${prefixo}-parcelar"> Parcelar esta conta
    </label>
    <div id="${prefixo}-bloco-parcelas" class="hidden">
      <div style="display:flex;gap:8px">
        <div class="form-group" style="flex:1"><label class="login-label">Nº de parcelas</label><input class="login-input" id="${prefixo}-nparc" type="number" min="2" step="1" value="2"></div>
        <div class="form-group" style="flex:1"><label class="login-label">Valor total (R$)</label><input class="login-input" id="${prefixo}-valor-total" type="number" step="0.01" min="0"></div>
      </div>
      <div class="form-group"><label class="login-label">Vencimento da 1ª parcela</label><input class="login-input" id="${prefixo}-primeiro-venc" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <button class="btn btn-secondary btn-sm" id="${prefixo}-gerar-parcelas" type="button"><i class="ti ti-list-numbers"></i> Gerar parcelas</button>
      <div id="${prefixo}-parcelas-lista" style="margin-top:10px"></div>
    </div>`;
}
// Liga o checkbox "Parcelar" (mostra/esconde os blocos) e o botão "Gerar
// parcelas" (monta N linhas editáveis de valor+vencimento, distribuindo o
// valor total igualmente e sugerindo vencimentos mensais a partir da 1ª data
// — mas o usuário pode alterar cada valor/data individualmente depois).
function _bindParcelamentoToggle(prefixo){
  const chk=document.getElementById(`${prefixo}-parcelar`);
  const blocoUnico=document.getElementById(`${prefixo}-bloco-unico`);
  const blocoParcelas=document.getElementById(`${prefixo}-bloco-parcelas`);
  chk.addEventListener('change', ()=>{
    blocoUnico.classList.toggle('hidden', chk.checked);
    blocoParcelas.classList.toggle('hidden', !chk.checked);
  });
  document.getElementById(`${prefixo}-gerar-parcelas`).addEventListener('click', ()=>{
    const n=Math.max(2,parseInt(document.getElementById(`${prefixo}-nparc`).value)||2);
    const total=parseFloat(document.getElementById(`${prefixo}-valor-total`).value)||0;
    const primeiroVenc=document.getElementById(`${prefixo}-primeiro-venc`).value||new Date().toISOString().slice(0,10);
    const base=Math.floor((total/n)*100)/100;
    let somaParcial=0;
    const linhas=[];
    for(let i=0;i<n;i++){
      const valorParc=(i===n-1)?+(total-somaParcial).toFixed(2):base;
      somaParcial+=valorParc;
      linhas.push({valor:valorParc, venc:addMesesISO(primeiroVenc,i)});
    }
    document.getElementById(`${prefixo}-parcelas-lista`).innerHTML=linhas.map((l,i)=>`
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <span style="font-size:11px;color:var(--text2);width:22px">${i+1}ª</span>
        <input class="${prefixo}-parc-valor" type="number" step="0.01" min="0" data-i="${i}" value="${l.valor}" style="flex:1;margin-bottom:0">
        <input class="${prefixo}-parc-venc" type="date" data-i="${i}" value="${l.venc}" style="flex:1;margin-bottom:0">
      </div>`).join('');
  });
}
// Lê as linhas de parcela já geradas na tela (usado ao salvar).
function _lerParcelasForm(prefixo){
  const valores=[...document.querySelectorAll(`.${prefixo}-parc-valor`)];
  const vencs=[...document.querySelectorAll(`.${prefixo}-parc-venc`)];
  return valores.map((inp,i)=>({valor:parseFloat(inp.value)||0, vencISO:vencs[i]?.value||''}));
}

      <div class="form-group"><label class="login-label">Vencimento</label><input class="login-input" id="cr-vencimento" type="date" value="${c?vencimentoISOConta(c):''}"></div>

      </select>

    <div class="login-erro" id="cr-erro"></div>`;

function abrirNovaContaReceber(){
  abrirModal(`<h3>Nova conta a receber</h3>${_formContaReceber(null, true)}
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1;justify-content:center" id="cr-cancelar">Cancelar</button>
      <button class="btn btn-primary" style="flex:1;justify-content:center" id="cr-salvar"><i class="ti ti-device-floppy"></i> Salvar</button>
    </div>`);
  document.getElementById('cr-cancelar').addEventListener('click', fecharModal);
  _bindParcelamentoToggle('cr');
  document.getElementById('cr-salvar').addEventListener('click', async ()=>{
    const cliente=document.getElementById('cr-cliente').value.trim();
    const tipo=document.getElementById('cr-tipo').value;
    const contaId=document.getElementById('cr-conta').value;
    const erroEl=document.getElementById('cr-erro');
    const parcelar=document.getElementById('cr-parcelar').checked;
    if(!cliente){ erroEl.textContent='Preencha o cliente.'; erroEl.style.display='block'; return; }
    if(parcelar){
      const parcelas=_lerParcelasForm('cr');
      if(parcelas.length<2||parcelas.some(p=>!(p.valor>0)||!p.vencISO)){
        erroEl.textContent='Clique em "Gerar parcelas" e preencha valor e vencimento de todas.'; erroEl.style.display='block'; return;
      }
      const grupoId='grp'+Date.now();
      parcelas.forEach((p,i)=>{
        CONTAS_RECEBER.push({id:'cr'+Date.now()+'_'+i, cliente, valor:p.valor, vencimento:fmtDataBr(p.vencISO), vencISO:p.vencISO, tipo, contaId, pagamentos:[], parcela:{numero:i+1, total:parcelas.length, grupoId}});
      });
    } else {
      const valor=parseFloat(document.getElementById('cr-valor').value);
      const vencISO=document.getElementById('cr-vencimento').value;
      if(!(valor>0)||!vencISO){ erroEl.textContent='Preencha valor e vencimento.'; erroEl.style.display='block'; return; }
      CONTAS_RECEBER.push({id:'cr'+Date.now(), cliente, valor, vencimento:fmtDataBr(vencISO), vencISO, tipo, contaId, pagamentos:[]});
    }
    await salvarContasReceber();
    fecharModal();
    mostrarToast(parcelar?'Conta parcelada adicionada.':'Conta a receber adicionada.','sucesso');
    renderRelatorioFinanceiro();
  });
}

  const c=CONTAS_RECEBER.find(x=>x.id===id);

  abrirModal(`<h3>Editar conta a receber</h3>${_formContaReceber(c, false)}

    </div>`);

  document.getElementById('cr-salvar').addEventListener('click', async ()=>{
    const cliente=document.getElementById('cr-cliente').value.trim();
    const valor=parseFloat(document.getElementById('cr-valor').value);
    const vencISO=document.getElementById('cr-vencimento').value;
    const tipo=document.getElementById('cr-tipo').value;
    const contaId=document.getElementById('cr-conta').value;

async function excluirContaReceber(id){
  const c=CONTAS_RECEBER.find(x=>x.id===id);
  if(!c)return;
  const ok=await confirmarAcao({titulo:'Excluir conta a receber?', mensagem:`A conta de ${c.cliente} (${fmtM(valorTotalConta(c))}) será removida permanentemente.`, textoConfirmar:'Excluir'});
  if(!ok)return;
  CONTAS_RECEBER=CONTAS_RECEBER.filter(x=>x.id!==id);

function abrirLancarVendaManual(){
  abrirModal(`
    <h3>Lançar venda manual</h3>
    <p class="modal-desc">Registra uma venda direto no sistema, sem passar pela grade de pneus. Use para lançamentos retroativos ou correções.</p>

    <div class="form-group"><label class="login-label">Quantidade de pneus</label><input class="login-input" id="vm-pneus" type="number" min="0" step="1" value="0"></div>
    <div class="form-group"><label class="login-label">Valor total (R$)</label><input class="login-input" id="vm-valor" type="number" min="0" step="0.01"></div>
    <div class="form-group"><label class="login-label">Forma de pagamento</label>
      <select class="login-input" id="vm-pagamento">${PAGS.map(p=>`<option value="${p.id}">${p.nome}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label class="login-label">Data da venda</label><input class="login-input" id="vm-data" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="form-group"><label class="login-label">Nº NF/boleto (opcional)</label><input class="login-input" id="vm-nf" placeholder="Ex: 12345"></div>
    <div class="form-group"><label class="login-label">Observação (opcional)</label><input class="login-input" id="vm-obs"></div>
    <div class="login-erro" id="vm-erro"></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" style="flex:1;justify-content:center" id="vm-cancelar">Cancelar</button>
      <button class="btn btn-primary" style="flex:1;justify-content:center" id="vm-salvar"><i class="ti ti-device-floppy"></i> Lançar venda</button>
    </div>`);
  document.getElementById('vm-cancelar').addEventListener('click', fecharModal);
  document.getElementById('vm-salvar').addEventListener('click', async ()=>{
    const cliente=document.getElementById('vm-cliente').value.trim();
    const pneus=parseInt(document.getElementById('vm-pneus').value)||0;
    const valor=parseFloat(document.getElementById('vm-valor').value);
    const pagId=document.getElementById('vm-pagamento').value;
    const dataISO=document.getElementById('vm-data').value;
    const nf=document.getElementById('vm-nf').value.trim();
    const obs=document.getElementById('vm-obs').value;
    const erroEl=document.getElementById('vm-erro');
    if(!cliente||!(valor>0)||!dataISO){ erroEl.textContent='Preencha cliente, valor e data.'; erroEl.style.display='block'; return; }
    const pagMeta=PAGS.find(p=>p.id===pagId);
    const formaNome=pagMeta?.nome||'';
    // Mesma regra usada no fluxo guiado: pagamentos "à vista" já entram como
    // recebidos; boleto/fiado ficam como saldo em aberto no Financeiro.
    const pagoAVista=['dinheiro','pix','credito','debito','cheque'].includes(pagId);
    vendasState.historico.push({
      id:'vm'+Date.now(), cliente, cliId:'', pneus,
      pagamento:formaNome, valor, valorTotal:valor, obs, hora:now(),
      data:fmtDataBr(dataISO), dataISO,
      qtds:{}, dev:null, numeroNF:nf, numeroBoleto:'',
      pagamentos:pagoAVista?[{valor,forma:formaNome,hora:now(),data:dataISO}]:[],
      notasFiscais:nf?[{numero:nf,valor}]:[]
    });
    await salvarVendasHistorico();
    fecharModal();
    mostrarToast('Venda lançada manualmente.','sucesso');
    renderRelatorioFinanceiro();
  });
}

function _bindRelTabVendas(){
  const lista=pedidosFiltrados();
  const porCliente=relatorioState.situacao==='aberto'?agruparSaldoPorCliente(lista):[];
  document.getElementById('btn-lancar-venda-manual')?.addEventListener('click', abrirLancarVendaManual);
  document.getElementById('rel-sel-todos')?.addEventListener('change', e=>{
    if(e.target.checked) lista.forEach(p=>relatorioSel.add(p.id));
    else lista.forEach(p=>relatorioSel.delete(p.id));
    renderRelatorioFinanceiro();
  });
  document.querySelectorAll('.rel-sel-item').forEach(chk=>{
    chk.addEventListener('change', ()=>{
      if(chk.checked) relatorioSel.add(chk.dataset.id);
      else relatorioSel.delete(chk.dataset.id);
      renderRelatorioFinanceiro();
    });
  });
  document.getElementById('btn-lote-pagamento')?.addEventListener('click', abrirTrocarPagamentoLote);
  document.getElementById('btn-lote-excluir')?.addEventListener('click', excluirVendasSelecionadas);
  document.getElementById('btn-lote-limpar')?.addEventListener('click', ()=>{ relatorioSel.clear(); renderRelatorioFinanceiro(); });
  document.querySelectorAll('[data-editar-venda]').forEach(btn=>{

// ── Filtro de período genérico (usado pelo Consolidado e Pagos/Recebidos) ───
function _dentroPeriodo(iso, de, ate){
  if(!de && !ate) return true;
  if(!iso) return false;
  if(de && iso<de) return false;
  if(ate && iso>ate) return false;
  return true;
}

// ── Aba "Consolidado" — a receber + a pagar numa lista só, filtrável por período ──
function _linhasConsolidado(){
  const {dataDe:de, dataAte:ate, tipo, situacao} = consolState;
  let receber = tipo==='pagar' ? [] : CONTAS_RECEBER.filter(c=>_dentroPeriodo(vencimentoISOConta(c), de, ate));
  let pagar = tipo==='receber' ? [] : contasPagarState.itens.filter(c=>_dentroPeriodo(vencimentoISOConta(c), de, ate));
  if(situacao==='aberto'){ receber=receber.filter(c=>saldoConta(c)>0.009); pagar=pagar.filter(c=>saldoConta(c)>0.009); }
  else if(situacao==='pago'){ receber=receber.filter(c=>saldoConta(c)<=0.009); pagar=pagar.filter(c=>saldoConta(c)<=0.009); }
  else if(situacao==='vencido'){ receber=receber.filter(c=>statusConta(c)==='vencido'); pagar=pagar.filter(c=>statusConta(c)==='vencido'); }
  const linhas=[
    ...receber.map(c=>({tipo:'receber', item:c, nome:c.cliente, venc:vencimentoISOConta(c)})),
    ...pagar.map(c=>({tipo:'pagar', item:c, nome:c.fornecedor, venc:vencimentoISOConta(c)})),
  ];
  linhas.sort((a,b)=>(a.venc||'9999').localeCompare(b.venc||'9999'));
  return linhas;
}

// ── Aba "Pagos/Recebidos" — ledger de transações reais, filtrável por período/dia ──
function _eventosPagamento(){
  const eventos=[];
  CONTAS_RECEBER.forEach(c=>{
    (c.pagamentos||[]).forEach(pg=>{
      eventos.push({tipo:'recebido', nome:c.cliente, data:pg.data||'', forma:pg.forma||'', valor:parseFloat(pg.valor)||0, hora:pg.hora||''});
    });
  });
  contasPagarState.itens.forEach(c=>{
    (c.pagamentos||[]).forEach(pg=>{
      eventos.push({tipo:'pago', nome:c.fornecedor, data:pg.data||'', forma:pg.forma||'', valor:parseFloat(pg.valor)||0, hora:pg.hora||''});
    });
  });
  return eventos;
}
function _eventosPagamentoFiltrados(){
  const {dataDe:de, dataAte:ate} = pagosState;
  return _eventosPagamento()
    .filter(e=>_dentroPeriodo(e.data, de, ate))
    .sort((a,b)=>(a.data||'').localeCompare(b.data||'') || (a.hora||'').localeCompare(b.hora||''));
}

    if(e.tipo==='recebido') porDia[k].recebido+=e.valor; else porDia[k].pago+=e.valor;
    porDia[k].itens.push(e);
  });
  const dias=Object.keys(porDia).sort((a,b)=>b.localeCompare(a));
  return `

      <div class="section-title" style="margin-top:0">Período</div>

        ${temFiltro?`<button class="btn btn-secondary" id="btn-pagos-limpar"><i class="ti ti-x"></i> Limpar</button>`:''}
      </div>
    </div>

      <div class="stat-box verde"><div class="sv">${fmtM(totalRecebido)}</div><div class="sl">Recebido</div></div>
      <div class="stat-box vermelho"><div class="sv">${fmtM(totalPago)}</div><div class="sl">Pago</div></div>
      <div class="stat-box ${saldoPeriodo>=0?'verde':'vermelho'}"><div class="sv">${fmtM(saldoPeriodo)}</div><div class="sl">Saldo do período</div></div>

function _bindRelTabPagosRecebidos(){
  document.getElementById('pagos-data-de')?.addEventListener('change', e=>{ const el=document.getElementById('pagos-data-ate'); if(el) el.min=e.target.value; });
  document.getElementById('pagos-data-ate')?.addEventListener('change', e=>{ const el=document.getElementById('pagos-data-de'); if(el) el.max=e.target.value; });
  document.getElementById('btn-pagos-hoje')?.addEventListener('click', ()=>{
    const hoje=new Date().toISOString().slice(0,10);
    pagosState.dataDe=hoje; pagosState.dataAte=hoje;
    renderRelatorioFinanceiro();
  });
  document.getElementById('btn-pagos-mes')?.addEventListener('click', ()=>{
    const d=new Date();
    const de=new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10);
    const ate=new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10);
    pagosState.dataDe=de; pagosState.dataAte=ate;
    renderRelatorioFinanceiro();
  });
  document.getElementById('btn-pagos-filtrar')?.addEventListener('click', ()=>{
    pagosState.dataDe=document.getElementById('pagos-data-de').value;
    pagosState.dataAte=document.getElementById('pagos-data-ate').value;
    renderRelatorioFinanceiro();
  });
  document.getElementById('btn-pagos-limpar')?.addEventListener('click', ()=>{
    pagosState={dataDe:'',dataAte:''};
    renderRelatorioFinanceiro();
  });
}

    </div>
    ${tab==='vendas'?_relTabVendas():tab==='receber'?_relTabReceber():tab==='pagar'?_relTabPagar():tab==='consolidado'?_relTabConsolidado():_relTabPagosRecebidos()}
  `;
  bindBack();
  document.getElementById('btn-plano-contas')?.addEventListener('click', abrirPlanoContas);

  return`━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

CCM:          ${prestadorNF.ccm||'—'}

E-MAIL NF:    ${f.email||'—'}

DISCRIMINAÇÃO:${discriminacao}

RPS:          Nº ${rps} — Série ${f.serieRps||'A'}
DATA EMISSÃO: ${hoje}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;
}

function copiarTexto(txt){

}

// ── Volumes m³ por item (editável em Cadastros) ───────────────────────────────
let VOLUMES_M3 = {
  pneus_passeio:  0.05,
  pneus_estourado:0.05,
  amortecedor:    0.02,
  bandeja:        0.01,
  disco:          0.01,
  filtro_oleo:    0.00, // por kg — não computa volume
  frascos_oleo:   0.00,
  mola:           0.01,
  papelao:        0.00, // por kg — não computa volume
  pastilha:       0.00,
  plasticos:      0.00, // por kg — não computa volume
  roda:           0.04,
  sucata:         0.00, // por kg — não computa volume
};

// ── Capacidade do baú por veículo m³ (editável em Cadastros) ─────────────────
let CAPACIDADE_BAU = {
  'FPW-9J58': 45,
  'DEU-8A98': 40,
  'GGA-0262': 50,
  'EEK-1A92': 18,
  'TJX-4G17': 55,
  'FNY-0G23': 18,
};

// Calcula m³ ocupado de um objeto {id: quantidade}
function calcM3(itens){
  return Object.entries(itens||{}).reduce((s,[id,qtd])=>{
    return s + (VOLUMES_M3[id]||0) * (parseFloat(qtd)||0);
  }, 0);
}

// Calcula m³ acumulado de todas as lojas já coletadas numa rota
function calcM3Rota(rota){
  return (rota?.lojas||[]).reduce((s,l)=>s+calcM3(l.itens||{}),0);
}

function attachSig(){
  const c=document.getElementById('sig-canvas');if(!c||sigCtx)return;
  sigCtx=c.getContext('2d');sigCtx.strokeStyle='#1A5FA8';sigCtx.lineWidth=2.5;sigCtx.lineCap='round';
  const pos=(e)=>{const r=c.getBoundingClientRect();const s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*(c.width/r.width),y:(s.clientY-r.top)*(c.height/r.height)};};
  c.addEventListener('mousedown',e=>{drawing=true;const p=pos(e);lx=p.x;ly=p.y;});
  c.addEventListener('mousemove',e=>{if(!drawing)return;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(lx,ly);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();lx=p.x;ly=p.y;ciSigned=true;});
  c.addEventListener('mouseup',()=>drawing=false);
  c.addEventListener('touchstart',e=>{e.preventDefault();drawing=true;const p=pos(e);lx=p.x;ly=p.y;},{passive:false});
  c.addEventListener('touchmove',e=>{e.preventDefault();if(!drawing)return;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(lx,ly);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();lx=p.x;ly=p.y;ciSigned=true;},{passive:false});
  c.addEventListener('touchend',()=>drawing=false);
}

function renderMotoristaHist(){
  const nome=usuarioAtual?.nome||'';

  const minhasViagens=(rotState.rotasSalvas||[])

    .sort((a,b)=>new Date(b.finalizadaEm)-new Date(a.finalizadaEm));
  const doMes=minhasViagens.filter(r=>{

        <strong style="font-size:15px;letter-spacing:.04em;display:block">${c.placa}</strong>
        <span style="font-size:12px;color:var(--text2)">${c.motorista} · ${c.rota}</span>
        <div style="font-size:12px;color:var(--text2);margin-top:3px">${c.lojas.length} lojas · ${c.totalPneus} pneus · ${c.chegada}</div>
      </div>
      <span class="badge laranja">Aguardando</span>
    </div>`).join('')}
    ${CAMINHOES_CONF.filter(c=>c.status!=='aguardando').length>0?`
    <div class="section-title">Já conferidos</div>
    ${CAMINHOES_CONF.filter(c=>c.status!=='aguardando').map(c=>`<div class="card" style="display:flex;align-items:center;gap:12px;opacity:.65">
      <div class="mod-icon verde"><i class="ti ti-circle-check"></i></div>
      <div style="flex:1"><strong style="font-size:15px;display:block">${c.placa}</strong><span style="font-size:12px;color:var(--text2)">${c.motorista}</span></div>
      <span class="badge verde">${c.status==='triado'?'Triado':'Conferido'}</span>
    </div>`).join('')}`:''}`;
  bindBack();
  CAMINHOES_CONF.filter(c=>c.status==='aguardando').forEach(c=>{
    document.getElementById(`cam-conf-${c.id}`)?.addEventListener('click',()=>renderConferenciaNotas(c.id));
  });
}

function renderConferenciaNotas(camId){
  const cam=CAMINHOES_CONF.find(c=>c.id===camId);
  if(!confState.conferencias[camId]){
    confState.conferencias[camId]={};
    cam.lojas.forEach(l=>{confState.conferencias[camId][l.nome]={fechada:false,itens:{},aberta:false};});
  }
  const conf=confState.conferencias[camId];
  const fechadas=Object.values(conf).filter(c=>c.fechada).length;
  const todas=fechadas===cam.lojas.length;
  document.getElementById('content-area').innerHTML=`
    <button class="btn btn-secondary btn-sm" id="btn-back-conf" style="margin-bottom:1rem"><i class="ti ti-arrow-left"></i> Caminhões</button>
    <div class="mod-header"><div class="mod-header-icon laranja"><i class="ti ti-clipboard-list"></i></div><div><h2>${cam.placa}</h2><span>${cam.motorista} · ${cam.rota}</span></div></div>
    <div class="prog-wrap"><div class="prog-bar" style="width:${Math.round(fechadas/cam.lojas.length*100)}%"></div></div>
    <p style="font-size:12px;color:var(--text2);margin-bottom:12px">${fechadas} de ${cam.lojas.length} notas conferidas</p>
    ${todas?`<div class="alert verde"><i class="ti ti-circle-check"></i><p>Todas as notas conferidas! Caminhão liberado para triagem.</p></div>`:''}
    ${cam.lojas.map(l=>{
      const lConf=conf[l.nome];
      const pneusMot=l.pneus;
      const isOpen=lConf.aberta;
      return `<div style="border:1.5px solid ${lConf.fechada?'var(--green)':'var(--border)'};border-radius:var(--radius);overflow:hidden;margin-bottom:8px">
        <div style="padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:${lConf.fechada?'var(--green-bg)':'var(--bg)'}" id="nota-toggle-${l.nome.replace(/\s/g,'_')}">
          <div style="flex:1;min-width:0">
            <strong style="font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${l.nome}</strong>
            <span style="font-size:11px;color:var(--text2)">${l.marca} · Motorista lançou: ${pneusMot} pneus</span>
            ${lConf.fechada?`<div style="font-size:11px;color:var(--green);margin-top:2px">✓ Conferido</div>`:''}
          </div>
          ${!lConf.fechada?`<button class="btn btn-primary btn-sm" id="btn-conferir-${l.nome.replace(/\s/g,'_')}">Conferir</button>`:''}
          <i class="ti ti-chevron-${isOpen?'up':'down'}" style="font-size:14px;color:var(--text2)"></i>
        </div>
        ${isOpen?`<div style="padding:14px;border-top:1px solid var(--border-light)">
          <table class="conf-table" style="width:100%">
            <thead><tr><th style="text-align:left">Item</th><th>Motorista</th><th>Conferido</th></tr></thead>
            <tbody>
              ${ITENS_CI.map(it=>{
                // Antes era um número aleatório (Math.random) — agora usa o
                // que o motorista realmente lançou no check-in dessa loja.
                const qMot=parseInt(motorState.checkins[l.id]?.itens?.[it.id])||0;
                const qConf=lConf.itens[it.id]||'';
                const diverge=qConf!==''&&parseInt(qConf)!==qMot;
                const ok=qConf!==''&&!diverge;
                return `<tr class="${diverge?'div-row':''}">
                  <td>${it.nome}</td>
                  <td style="text-align:right;font-weight:600">${qMot}</td>
                  <td style="text-align:right"><input class="conf-inp${diverge?' diverge':ok?' ok':''}" type="number" min="0" placeholder="${qMot}" value="${qConf}" data-loja="${l.nome}" data-item="${it.id}" style="width:60px"></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button class="btn btn-secondary btn-sm" id="btn-igual-${l.nome.replace(/\s/g,'_')}">Tudo igual</button>
            <button class="btn btn-primary" style="flex:1;justify-content:center" id="btn-salvar-${l.nome.replace(/\s/g,'_')}"><i class="ti ti-device-floppy"></i> Salvar nota</button>
          </div>
        </div>`:``}
      </div>`;
    }).join('')}
    ${todas?`<button class="btn btn-primary btn-block" id="btn-finalizar-conf"><i class="ti ti-flag-check"></i> Finalizar conferência</button>`:''}`;

  document.getElementById('btn-back-conf')?.addEventListener('click',renderConferenteLista);
  cam.lojas.forEach(l=>{
    const key=l.nome.replace(/\s/g,'_');
    document.getElementById(`nota-toggle-${key}`)?.addEventListener('click',()=>{conf[l.nome].aberta=!conf[l.nome].aberta;renderConferenciaNotas(camId);});
    document.getElementById(`btn-conferir-${key}`)?.addEventListener('click',e=>{e.stopPropagation();conf[l.nome].aberta=true;renderConferenciaNotas(camId);});
    document.getElementById(`btn-igual-${key}`)?.addEventListener('click',()=>{conf[l.nome].fechada=true;conf[l.nome].aberta=false;salvarConferencias();renderConferenciaNotas(camId);});
    document.getElementById(`btn-salvar-${key}`)?.addEventListener('click',()=>{conf[l.nome].fechada=true;conf[l.nome].aberta=false;salvarConferencias();renderConferenciaNotas(camId);});
  });
  document.querySelectorAll('.conf-inp').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const loja=inp.dataset.loja;
      if(!confState.conferencias[camId][loja]) confState.conferencias[camId][loja]={fechada:false,itens:{},aberta:true};
      confState.conferencias[camId][loja].itens[inp.dataset.item]=inp.value;
      const qMot=parseInt(inp.placeholder)||0;
      const qConf=parseInt(inp.value)||0;
      inp.className='conf-inp'+(qConf&&qConf!==qMot?' diverge':qConf?'ok':'');
    });
  });
  document.getElementById('btn-finalizar-conf')?.addEventListener('click',()=>{
    // O status precisa ser gravado na rota real (rotState.rotasSalvas), não
    // só no array derivado CAMINHOES_CONF — senão a mudança some no próximo
    // render (que recalcula CAMINHOES_CONF do zero a partir das rotas salvas).
    const rota=rotState.rotasSalvas.find(r=>r.id===camId);
    if(rota) rota.status='conferido';
    salvarRotasSalvas();
    sincronizarCaminhoesConf();
    mostrarToast('Conferência finalizada! Caminhão liberado para triagem.','sucesso');
    renderConferenteLista();
  });
}

// ── TRIAGEM ───────────────────────────────────────────────────────────────────
let triagemNavState={camId:null};
function renderTriagemLista(){
  sincronizarCaminhoesConf();
  if(triagemNavState.camId) return renderTriagemLojas(triagemNavState.camId);
  const conf=CAMINHOES_CONF.filter(c=>c.status==='conferido'||c.status==='triado');
  document.getElementById('content-area').innerHTML=`
    ${btnBack()}
    <div class="mod-header"><div class="mod-header-icon teal"><i class="ti ti-filter"></i></div><div><h2>Triagem de pneus</h2><span>Por loja, categoria e aro</span></div></div>
    ${conf.length===0?`<div class="empty"><i class="ti ti-truck-off"></i><p>Nenhum caminhão conferido disponível.</p></div>`:''}
    ${conf.map(c=>{
      const totalLojas=(c.lojas||[]).length;
      const lojasTriadas=(c.lojas||[]).filter(l=>triagemState.salvas[l.id]).length;
      const completo=totalLojas>0&&lojasTriadas===totalLojas;
      return `<div class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer" id="triagem-cam-${c.id}">
      <div class="mod-icon teal"><i class="ti ti-filter"></i></div>
      <div style="flex:1">
        <strong style="font-size:15px;letter-spacing:.04em;display:block">${c.placa}</strong>
        <span style="font-size:12px;color:var(--text2)">${c.motorista} · ${c.rota}</span>
        <div style="font-size:13px;font-weight:600;color:var(--teal);margin-top:4px">${c.totalPneus} pneus · ${lojasTriadas}/${totalLojas} loja${totalLojas!==1?'s':''} triada${totalLojas!==1?'s':''}</div>
      </div>
      ${completo?'<span class="badge verde">Completo</span>':''}
      <i class="ti ti-chevron-right" style="color:var(--text3);font-size:16px"></i>
    </div>`;}).join('')}`;
  bindBack();
  conf.forEach(c=>{
    document.getElementById(`triagem-cam-${c.id}`)?.addEventListener('click',()=>{triagemNavState.camId=c.id;renderTriagemLojas(c.id);});
  });
}

function renderTriagemLojas(camId){
  sincronizarCaminhoesConf();
  const cam=CAMINHOES_CONF.find(c=>c.id===camId);
  if(!cam){ triagemNavState.camId=null; renderTriagemLista(); return; }
  document.getElementById('content-area').innerHTML=`
    <button class="btn btn-secondary btn-sm" id="btn-voltar-triagem-cam" style="margin-bottom:1rem"><i class="ti ti-arrow-left"></i> Caminhões</button>
    <div class="mod-header"><div class="mod-header-icon teal"><i class="ti ti-filter"></i></div><div><h2>${cam.placa}</h2><span>${cam.motorista} · ${cam.rota}</span></div></div>
    ${(cam.lojas||[]).length===0?`<div class="empty"><i class="ti ti-building-store"></i><p>Essa rota não tem lojas registradas.</p></div>`:''}
    ${(cam.lojas||[]).map(l=>{
      const salva=triagemState.salvas[l.id];
      return `<div class="card" style="display:flex;align-items:center;gap:12px;cursor:pointer" id="triagem-loja-${l.id}">
      <div class="mod-icon ${salva?'verde':'teal'}"><i class="ti ti-${salva?'circle-check':'building-store'}"></i></div>
      <div style="flex:1;min-width:0">
        <strong style="font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(l.nome)}</strong>
        <span style="font-size:12px;color:var(--text2)">${l.marca?escapeHtml(l.marca)+' · ':''}${l.pneus} pneus para triar</span>
      </div>
      <span class="badge ${salva?'verde':'laranja'}">${salva?'Triada':'Pendente'}</span>
      <i class="ti ti-chevron-right" style="color:var(--text3);font-size:16px"></i>
    </div>`;}).join('')}`;
  document.getElementById('btn-voltar-triagem-cam')?.addEventListener('click',()=>{triagemNavState.camId=null;renderTriagemLista();});
  (cam.lojas||[]).forEach(l=>{
    document.getElementById(`triagem-loja-${l.id}`)?.addEventListener('click',()=>renderTriagemGrade(l.id,camId));
  });
}

function renderTriagemGrade(lojaId,camId){
  const cam=CAMINHOES_CONF.find(c=>c.id===camId);
  const loja=cam?.lojas?.find(l=>l.id===lojaId);
  if(!cam||!loja){ triagemNavState.camId=null; renderTriagemLista(); return; }
  if(!triagemGrade[lojaId]) triagemGrade[lojaId]={};
  CATS_TRIAGEM.forEach(cat=>{
    if(!triagemGrade[lojaId][cat.id]) triagemGrade[lojaId][cat.id]={};
    AROS_FULL.forEach(a=>{if(!triagemGrade[lojaId][cat.id][a]) triagemGrade[lojaId][cat.id][a]=0;});
  });
  const tot=CATS_TRIAGEM.reduce((s,c)=>s+AROS_FULL.reduce((ss,a)=>ss+(parseInt(triagemGrade[lojaId][c.id][a])||0),0),0);
  const totalLoja=loja.pneus;
  const valido=tot===totalLoja;
  const pct=totalLoja>0?Math.min(100,Math.round(tot/totalLoja*100)):0;

  document.getElementById('content-area').innerHTML=`
    <button class="btn btn-secondary btn-sm" id="btn-back-triagem" style="margin-bottom:1rem"><i class="ti ti-arrow-left"></i> ${cam.placa}</button>
    <div class="mod-header"><div class="mod-header-icon teal"><i class="ti ti-filter"></i></div><div><h2>${escapeHtml(loja.nome)}</h2><span>${totalLoja} pneus para triar</span></div></div>
    <div class="prog-wrap"><div class="prog-bar${tot>totalLoja?' err':valido?'':' warn'}" id="triagem-prog-bar" style="width:${pct}%"></div></div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:12px">
      <span>Lançado: <strong style="color:var(--text)" id="triagem-lancado">${tot}</strong> de <strong>${totalLoja}</strong></span>
      <span style="font-weight:600;color:${tot>totalLoja?'var(--red)':valido?'var(--green)':'var(--orange)'}" id="triagem-faltam">${tot>totalLoja?`${tot-totalLoja} a mais — corrija`:valido?'✓ Completo':`Faltam ${totalLoja-tot}`}</span>
    </div>
    <div id="triagem-alerta-completo">${valido?`<div class="alert verde"><i class="ti ti-circle-check"></i><p>Total confere! Pronto para confirmar.</p></div>`:''}</div>
    <div class="grade-scroll">
      <table class="grade" id="triagem-grade">
        <thead><tr>
          <th class="lbl">Categoria</th>
          ${AROS.map(a=>`<th>${a}</th>`).join('')}
          <th style="text-align:right;padding-right:6px">Total</th>
        </tr></thead>
        <tbody>
          ${CATS_TRIAGEM.map(cat=>{
            const catTot=AROS_FULL.reduce((s,a)=>s+(parseInt(triagemGrade[lojaId][cat.id][a])||0),0);
            return `<tr>
              <td class="cat-label" style="color:${cat.cor}">${cat.nome}</td>
              ${AROS_FULL.map(a=>{
                const v=parseInt(triagemGrade[lojaId][cat.id][a])||0;
                return `<td style="text-align:center;padding:2px"><input class="cell-inp${v>0?' tem':''}" type="number" inputmode="numeric" min="0" max="999" value="${v||''}" placeholder="·" data-loja="${lojaId}" data-cat="${cat.id}" data-aro="${a}"></td>`;
              }).join('')}
              <td class="tot-col${catTot>0?' tem':''}" id="tcat-${cat.id}">${catTot||'—'}</td>
            </tr>`;
          }).join('')}
          <tr class="total-row">
            <td style="text-align:left;padding-left:6px;font-size:10px;text-transform:uppercase;letter-spacing:.04em">Total aro</td>
            ${AROS_FULL.map(a=>{
              const t=CATS_TRIAGEM.reduce((s,c)=>s+(parseInt(triagemGrade[lojaId][c.id][a])||0),0);
              return `<td id="taro-${a}">${t||'—'}</td>`;
            }).join('')}
            <td class="geral${valido?' ok':''}" id="tgeral">${tot||'—'}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <button class="btn btn-primary btn-block${valido?'':' btn-dis'}" id="btn-confirmar-triagem" style="margin-top:12px;font-size:15px;padding:13px">
      <i class="ti ti-${valido?'device-floppy':'lock'}"></i> ${valido?'Confirmar triagem':`Preencha a grade — faltam ${totalLoja-tot}`}
    </button>`;

  document.getElementById('btn-back-triagem')?.addEventListener('click',()=>renderTriagemLojas(camId));
  document.querySelectorAll('.cell-inp[data-loja]').forEach(inp=>{
    inp.addEventListener('focus',()=>inp.select());
    inp.addEventListener('input',()=>{
      const {loja:lId,cat,aro}=inp.dataset;
      const val=Math.max(0,parseInt(inp.value)||0);
      triagemGrade[lId][cat][aro]=val;
      inp.value=val||'';
      inp.className='cell-inp'+(val>0?' tem':'');
      const catTot=AROS_FULL.reduce((s,a)=>s+(parseInt(triagemGrade[lId][cat][a])||0),0);
      const aroTot=CATS_TRIAGEM.reduce((s,c)=>s+(parseInt(triagemGrade[lId][c.id][aro])||0),0);
      const geral=CATS_TRIAGEM.reduce((s,c)=>s+AROS_FULL.reduce((ss,a)=>ss+(parseInt(triagemGrade[lId][c.id][a])||0),0),0);
      const lojaTot=totalLoja;
      const ok=geral===lojaTot;
      const elC=document.getElementById(`tcat-${cat}`);if(elC){elC.textContent=catTot||'—';elC.className='tot-col'+(catTot>0?' tem':'');}
      const elA=document.getElementById(`taro-${aro}`);if(elA)elA.textContent=aroTot||'—';
      const elG=document.getElementById('tgeral');if(elG){elG.textContent=geral||'—';elG.className='geral'+(ok?' ok':'');}
      const btn=document.getElementById('btn-confirmar-triagem');
      if(btn){if(ok){btn.innerHTML=`<i class="ti ti-device-floppy"></i> Confirmar triagem`;btn.classList.remove('btn-dis');}else{btn.innerHTML=`<i class="ti ti-lock"></i> Preencha a grade — faltam ${Math.max(0,lojaTot-geral)}`;btn.classList.add('btn-dis');}}
      const elLanc=document.getElementById('triagem-lancado');if(elLanc)elLanc.textContent=geral;
      const elFaltam=document.getElementById('triagem-faltam');
      if(elFaltam){
        elFaltam.textContent=geral>lojaTot?`${geral-lojaTot} a mais — corrija`:ok?'✓ Completo':`Faltam ${lojaTot-geral}`;
        elFaltam.style.color=geral>lojaTot?'var(--red)':ok?'var(--green)':'var(--orange)';
      }
      const elBar=document.getElementById('triagem-prog-bar');
      if(elBar){
        elBar.style.width=(lojaTot>0?Math.min(100,Math.round(geral/lojaTot*100)):0)+'%';
        elBar.className='prog-bar'+(geral>lojaTot?' err':ok?'':' warn');
      }

// Estrutura: { 'CAMPNEUS': [ {id, vigenciaInicio:'YYYY-MM-DD', vigenciaFim:'YYYY-MM-DD'|'', custos:{itemId:valor}} ], ... }
let CUSTOS_REDE={};
async function salvarCustosRede(){ try{ await window.storage?.set('cad_custos_rede', JSON.stringify(CUSTOS_REDE)); }catch(e){console.warn('salvarCustosRede',e);} }
function vigenciaStatus(v){
  const hoje=new Date().toISOString().slice(0,10);
  if(v.vigenciaInicio&&hoje<v.vigenciaInicio) return {status:'futura',label:'Futura'};
  if(v.vigenciaFim&&hoje>v.vigenciaFim) return {status:'expirada',label:'Expirada'};
  return {status:'vigente',label:'Vigente agora'};
}
function custoVigenteRede(rede,dataISO){
  const lista=CUSTOS_REDE[rede]||[];
  const validas=lista.filter(v=>v.vigenciaInicio&&dataISO>=v.vigenciaInicio&&(!v.vigenciaFim||dataISO<=v.vigenciaFim));
  if(!validas.length)return null;
  return validas.sort((a,b)=>b.vigenciaInicio.localeCompare(a.vigenciaInicio))[0];
}
// Gera automaticamente uma conta a pagar (no mesmo sistema de Contas a Pagar do Financeiro)
// a partir dos itens coletados num check-in, usando a vigência de custo ativa da rede da loja.
async function gerarContaPagarCheckin(loja,itens){
  if(!loja)return;
  const rede=loja.rede||loja.marca||'';
  const agora=new Date();
  const dataISO=agora.toISOString().slice(0,10);
  const vig=rede?custoVigenteRede(rede,dataISO):null;
  let valor=0;
  if(vig){
    Object.keys(itens||{}).forEach(itemId=>{
      const qtd=parseFloat(itens[itemId])||0;
      const custoUnit=vig.custos?.[itemId]||0;
      valor+=qtd*custoUnit;
    });
  }
  const vencDate=new Date(agora); vencDate.setDate(vencDate.getDate()+30);
  const vencISO=vencDate.toISOString().slice(0,10);
  const semTabela=!vig||!rede;
  contasPagarState.itens.push({
    id:'cp'+Date.now(),
    fornecedor:loja.nome+(rede?` (${rede})`:'')+(semTabela?' ⚠️ sem tabela de custo':''),
    valor:Math.round(valor*100)/100,
    vencimento:fmtDataBr(vencISO),vencISO,
    contaId:'pc8', // "Compra de pneus / insumos" no plano de contas padrão
    pagamentos:[],
    origem:'coleta',rede,loja:loja.nome,lojaId:loja.id,
    dataColeta:fmtDataBr(dataISO),dataColetaISO:dataISO,
    itensColetados:{...itens},
    semTabela,
  });
  await salvarContasPagar();
}

// ── Mix helpers ───────────────────────────────────────────────────────────────
// ── Regra de mix de venda (limites recomendados por aro, sobre o total de pneus) ──
// Aro 13 e 14 têm limite de participação no mix; os demais aros são livres.
// A regra é apenas um alerta (não bloqueia a venda). Limites configuráveis em Alertas → Alertas.
function checarRegraMix(qtds){
  const mix=calcMixVnd(qtds);
  const limites={'13':window.wppCfg?.limiteMixAro13??20,'14':window.wppCfg?.limiteMixAro14??30};
  return mix.map(m=>{
    const limite=limites[m.aro]??null;
    return {...m,limite,excedeu:limite!=null&&m.pct>limite};
  });
}
// Itens de uma venda no nível de detalhe original — por MEDIDA específica quando o
// cliente usa tabela detalhada por medida, por ARO quando usa tabela simples por aro.
// Usado na devolução: agregar tudo por aro (como fazia antes) perdia a medida
// específica devolvida sempre que o cliente tinha preços diferentes por medida no
// mesmo aro, o que tornava o crédito calculado impreciso.
function itensDetalheVnd(v){
  const cad=vndCad[v.cliId];
  const qtds=v.qtds||{};
  return Object.entries(qtds)
    .filter(([,q])=>(parseInt(q)||0)>0)
    .map(([key,q])=>{
      const qtd=parseInt(q)||0;
      if(key.includes('|')){
        const[aro,idx]=key.split('|');
        const nomeMedida=cad?.tabela?.[aro]?.[parseInt(idx)]?.m||MEDIDAS[aro]?.[parseInt(idx)]||'';
        const preco=cad?.tabela?.[aro]?.[parseInt(idx)]?.p||0;
        return{key,aro,label:nomeMedida?`Aro ${aro} — ${nomeMedida}`:`Aro ${aro}`,qtd,preco};
      } else {
        const preco=parseFloat(cad?.precos?.[key])||0;
        return{key,aro:key,label:`Aro ${key}`,qtd,preco};
      }
    })
    .sort((a,b)=>a.aro.localeCompare(b.aro,undefined,{numeric:true})||a.label.localeCompare(b.label));
}
function calcMixVnd(qtds){
  const porAro={};
  Object.entries(qtds||{}).forEach(([k,v])=>{
    const aro=k.includes('|')?k.split('|')[0]:k;
    porAro[aro]=(porAro[aro]||0)+(parseInt(v)||0);
  });
  const total=Object.values(porAro).reduce((s,v)=>s+v,0);
  return Object.entries(porAro).filter(([,q])=>q>0)
    .map(([aro,qtd])=>({aro,qtd,pct:total?Math.round(qtd/total*100):0}))
    .sort((a,b)=>b.qtd-a.qtd);
}

function calcValorDevVnd(v,qtdsDev){
  if(!qtdsDev)return 0;
  const cad=vndCad[v.cliId];if(!cad)return 0;
  let tot=0;
  if(cad.tipo==='medidas'){
    Object.entries(qtdsDev).forEach(([k,qtd])=>{
      const[aro,idx]=k.split('|');
      const preco=cad.tabela?.[aro]?.[parseInt(idx)]?.p||0;
      tot+=qtd*preco;
    });
  } else {
    Object.entries(qtdsDev).forEach(([aro,qtd])=>{
      tot+=qtd*(parseFloat(cad.precos?.[aro])||0);
    });
  }
  return tot;
}

function arrayBufferParaBase64(buf){
  let binary='';
  const bytes=new Uint8Array(buf);
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}

// ── Parsers tolerantes a formato brasileiro (vírgula decimal, datas DD/MM/AAAA) ──
function parseValorBR(v){
  if(v==null||v==='')return NaN;
  if(typeof v==='number')return v;
  let s=String(v).trim().replace(/^R\$\s?/i,'');
  // Se tem vírgula E ponto, assume ponto como separador de milhar (padrão BR: 1.234,56)
  if(s.includes(',')&&s.includes('.')) s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(',')) s=s.replace(',','.');
  const n=parseFloat(s);
  return isNaN(n)?NaN:n;
}
function parseDataBR(v){
  if(v==null||v==='')return null;
  const s=String(v).trim();
  let m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/); // DD/MM/AAAA
  if(m){
    let[,d,mo,y]=m; if(y.length===2)y='20'+y;
    return{iso:`${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`,br:`${d.padStart(2,'0')}/${mo.padStart(2,'0')}/${y}`};
  }
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); // AAAA-MM-DD
  if(m){
    let[,y,mo,d]=m;
    return{iso:`${y}-${mo.padStart(2,'0')}-${d.padStart(2,'0')}`,br:`${d.padStart(2,'0')}/${mo.padStart(2,'0')}/${y}`};
  }
  // Serial de data do Excel (número de dias desde 1899-12-30)
  if(/^\d+$/.test(s)){
    const dt=new Date(Date.UTC(1899,11,30)+parseInt(s)*86400000);
    const y=dt.getUTCFullYear(),mo=String(dt.getUTCMonth()+1).padStart(2,'0'),d=String(dt.getUTCDate()).padStart(2,'0');
    return{iso:`${y}-${mo}-${d}`,br:`${d}/${mo}/${y}`};
  }
  return null;
}
function matchFormaPagamento(v){
  if(!v)return'';
  const s=String(v).trim().toLowerCase();
  const achado=PAGS.find(p=>p.nome.toLowerCase()===s||p.id===s||s.includes(p.id)||p.nome.toLowerCase().includes(s));
  return achado?achado.nome:String(v).trim();
}
function normalizarTexto(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
}
// ── Aliases de auto-detecção — cada campo tem palavras-chave (em ordem de prioridade)
// e palavras que DESQUALIFICAM uma coluna (para não confundir "Valor NF" com "Valor Pago", por ex.)
const IMPORT_ALIASES={
  cliente:{inclui:['cliente','razaosocial','nomecliente','nome'],exclui:[]},
  data:{inclui:['datavenda','dataemissao','datanf','data'],exclui:['pgto','pagamento','vencimento']},
  valor:{inclui:['valornf','totalnf','valortotal','valor'],exclui:['pago','saldo','peso']},
  numeroNF:{inclui:['numeronf','notafiscal','numeronota','nnf','nf'],exclui:['valor','total']},
  numeroBoleto:{inclui:['numeroboleto','nboleto','boleto'],exclui:[]},
  valorPago:{inclui:['valorpago','pago'],exclui:['saldo']},
  dataPagamento:{inclui:['datapgto','datapagamento'],exclui:[]},
  pagamento:{inclui:['formapagamento','condpagamento','pagamento'],exclui:['valor','data']},
  pneus:{inclui:['pneus','quantidade','qtd'],exclui:['peso']},
  filial:{inclui:['filial','loja','unidade'],exclui:[]},
  endereco:{inclui:['enderecocompleto','endereco','logradouro','rua'],exclui:[]},
  vencimento:{inclui:['vencimento'],exclui:[]},
  tipo:{inclui:['tipo'],exclui:[]},
  nome:{inclui:['nomeloja','razaosocial','loja','fornecedor','nome'],exclui:[]},
  cidade:{inclui:['cidade','municipio'],exclui:[]},
  uf:{inclui:['uf','estado'],exclui:[]},
  cep:{inclui:['cep'],exclui:[]},
  ciclo:{inclui:['ciclo','periodicidade','frequencia'],exclui:[]},
  ultimaColeta:{inclui:['ultimacoleta','dataultimacoleta','ultimavisita'],exclui:[]},
  rede:{inclui:['rede','bandeira','marca'],exclui:[]},
  codLoja:{inclui:['codloja','codigoloja','coddaloja','codigo'],exclui:[]},
  observacao:{inclui:['observacao','obs','notas'],exclui:[]},
};
function autoMapearColuna(headers,campoId){
  const aliases=IMPORT_ALIASES[campoId];
  if(!aliases)return -1;
  for(const kw of aliases.inclui){
    const idx=headers.findIndex(h=>{
      const hs=h.replace(/\s/g,'');
      if(!hs.includes(kw))return false;
      return !aliases.exclui.some(ex=>hs.includes(ex));
    });
    if(idx>=0)return idx;
  }
  return -1;
}

    <button class="btn btn-secondary btn-sm" id="imp-voltar-tipo" style="margin-bottom:1rem"><i class="ti ti-arrow-left"></i> Trocar tipo</button>
    <div class="mod-header"><div class="mod-header-icon azul"><i class="ti ${t.icon}"></i></div><div><h2>${t.nome}</h2><span>Passo 1 de 3 — Enviar arquivo</span></div></div>
    <div class="foto-slot" id="imp-drop" style="padding:2rem">
      <input type="file" accept=".csv,.xlsx,.xls" id="imp-file-input">
      <i class="ti ti-file-spreadsheet"></i>
      <p>Toque para selecionar o arquivo .csv ou .xlsx exportado do Sygecom</p>
    </div>
    <div id="imp-status"></div>`;
  document.getElementById('imp-voltar-tipo')?.addEventListener('click',()=>{importState.etapa='tipo';renderImportarDados();});
  document.getElementById('imp-file-input')?.addEventListener('change',async e=>{
    const file=e.target.files[0];if(!file)return;
    document.getElementById('imp-status').innerHTML=`<p style="font-size:13px;color:var(--text2);margin-top:10px"><i class="ti ti-loader-2"></i> Lendo arquivo...</p>`;
    try{
      const data=await file.arrayBuffer();
      const wb=XLSX.read(data,{type:'array'});
      const sheet=wb.Sheets[wb.SheetNames[0]];
      // raw:true é essencial aqui: com raw:false o SheetJS formata números (ex: valores em R$)
      // usando separadores no padrão americano por padrão, mesmo em células brasileiras,
      // o que corrompe o valor antes mesmo do nosso parser entrar em ação.
      const linhas=XLSX.utils.sheet_to_json(sheet,{header:1,raw:true,defval:''});
      if(!linhas.length||linhas.length<2){
        document.getElementById('imp-status').innerHTML=`<div class="alert vermelho"><i class="ti ti-alert-triangle"></i><p>Arquivo vazio ou sem linhas de dados.</p></div>`;
        return;
      }
      importState.linhas=linhas;
      importState.arquivoNome=file.name;
      importState.arquivoTamanho=file.size;
      importState.arquivoMime=file.type||'application/octet-stream';
      // Guarda o arquivo original em base64 para o histórico de importações — só até um
      // limite de tamanho, pra não inflar o documento salvo no Firestore.
      try{
        importState.arquivoBase64=file.size<=IMPORT_ARQUIVO_LIMITE_BYTES ? arrayBufferParaBase64(data) : '';
      }catch(e){ importState.arquivoBase64=''; }
      // Pré-mapeamento automático com aliases + exclusões (evita confundir colunas parecidas)
      const headers=linhas[0].map(h=>normalizarTexto(h));
      const auto={};
      CAMPOS_IMPORT[importState.tipo].forEach(campo=>{
        const idx=autoMapearColuna(headers,campo.id);
        if(idx>=0) auto[campo.id]=idx;
      });
      importState.mapeamento=auto;
      importState.etapa='mapear';
      renderImportarDados();
    }catch(err){
      document.getElementById('imp-status').innerHTML=`<div class="alert vermelho"><i class="ti ti-alert-triangle"></i><p>Não consegui ler este arquivo. Confira se é um .csv ou .xlsx válido. (${err.message})</p></div>`;
    }
  });
}

function _renderImportMapear(){
  const s=importState;
  const headers=s.linhas[0];
  const campos=CAMPOS_IMPORT[s.tipo];
  const nLinhasDados=s.linhas.length-1;
  const todosObrigOk=campos.filter(c=>c.obrigatorio).every(c=>s.mapeamento[c.id]!==undefined&&s.mapeamento[c.id]!=='');
  const amostraLinhas=s.linhas.slice(1,4); // 3 primeiras linhas de dados, para conferência visual

  function previewColuna(campoId){
    const idx=s.mapeamento[campoId];
    if(idx===undefined||idx==='') return '<span style="color:var(--text3)">— nenhuma coluna selecionada —</span>';
    const valores=amostraLinhas.map(l=>l[idx]===undefined||l[idx]===''?'∅':l[idx]);
    return valores.join(' · ');
  }

  document.getElementById('content-area').innerHTML=`
    <button class="btn btn-secondary btn-sm" id="imp-voltar-upload" style="margin-bottom:1rem"><i class="ti ti-arrow-left"></i> Trocar arquivo</button>
    <div class="mod-header"><div class="mod-header-icon azul"><i class="ti ti-arrows-left-right"></i></div><div><h2>Mapear colunas</h2><span>Passo 2 de 3 — ${s.arquivoNome} · ${nLinhasDados} linha${nLinhasDados!==1?'s':''}</span></div></div>
    <div class="alert azul"><i class="ti ti-info-circle"></i><p>Diga qual coluna do seu arquivo corresponde a cada campo do Tyre Eco. Tentei adivinhar automaticamente — <strong>confira a prévia abaixo de cada campo</strong> antes de continuar, pra garantir que não pegou a coluna errada.</p></div>
    <div class="card">
      ${campos.map(c=>`<div style="padding:10px 0;border-bottom:1px solid var(--border-light)">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
          <div style="flex:1">
            <strong style="font-size:13px">${c.label}</strong>${c.obrigatorio?'<span style="color:var(--red)"> *</span>':''}
          </div>
          <select class="imp-map-sel" data-campo="${c.id}" style="width:180px">
            <option value="">— não usar —</option>
            ${headers.map((h,i)=>`<option value="${i}" ${s.mapeamento[c.id]===i?'selected':''}>${h||'(coluna '+(i+1)+')'}</option>`).join('')}
          </select>
        </div>
        <div class="imp-preview" data-preview="${c.id}" style="font-size:11px;color:var(--text2);background:var(--bg);border-radius:6px;padding:5px 8px;font-family:'SF Mono',Consolas,monospace">${previewColuna(c.id)}</div>
      </div>`).join('')}
    </div>
    <p style="font-size:11px;color:var(--text2);margin-bottom:1rem">* campos obrigatórios · a prévia mostra as 3 primeiras linhas de dados da coluna escolhida</p>
    <button class="btn btn-primary btn-block${todosObrigOk?'':' btn-dis'}" id="imp-ir-preview"><i class="ti ti-eye"></i> Ver prévia da importação</button>`;

  document.getElementById('imp-voltar-upload')?.addEventListener('click',()=>{importState.etapa='upload';renderImportarDados();});
  document.querySelectorAll('.imp-map-sel').forEach(sel=>{
    sel.addEventListener('change',()=>{
      const campo=sel.dataset.campo;
      s.mapeamento[campo]=sel.value===''?undefined:parseInt(sel.value);
      const prevEl=document.querySelector(`[data-preview="${campo}"]`);
      if(prevEl) prevEl.textContent=previewColuna(campo).replace(/<[^>]+>/g,'');
      const btn=document.getElementById('imp-ir-preview');
      const ok=campos.filter(c=>c.obrigatorio).every(c=>s.mapeamento[c.id]!==undefined&&s.mapeamento[c.id]!=='');
      if(btn) btn.classList.toggle('btn-dis',!ok);
    });
  });
  document.getElementById('imp-ir-preview')?.addEventListener('click',()=>{
    if(!todosObrigOk)return;
    importState.etapa='preview';renderImportarDados();
  });
}

// Converte as linhas brutas em registros prontos para o campo escolhido, com validação
// Converte as linhas brutas em registros prontos para o campo escolhido, com validação.
// Detecta duplicados tanto contra o que já existe no sistema quanto duplicidade dentro do
// próprio arquivo (a mesma linha exportada 2x): usa nº de documento (NF/boleto) quando
// disponível e, na ausência dele, uma chave composta (cliente + data + valor) como
// identificador — assim uma planilha sem número de documento também é protegida.
function processarLinhasImport(){
  const s=importState;
  const dados=s.linhas.slice(1); // pula cabeçalho
  const registros=[],erros=[],duplicados=[];
  const substituir=s.duplicadosSubstituir||new Set();

  // Mapa chave -> registro já existente no sistema (permite excluir e substituir depois)
  const existentesPorChave=new Map();
  if(s.tipo==='vendas'){
    vendasState.historico.forEach(v=>{
      const chave=v.numeroNF||v.numeroBoleto||`${normalizarTexto(v.cliente)}|${v.dataISO||''}|${(parseFloat(v.valor)||0).toFixed(2)}`;
      if(!existentesPorChave.has(chave)) existentesPorChave.set(chave, v);
    });
  } else if(s.tipo==='contas'){
    CONTAS_RECEBER.forEach(c=>{
      const chave=c.numeroBoleto||`${normalizarTexto(c.cliente)}|${vencimentoISOConta(c)}|${(parseFloat(c.valor)||0).toFixed(2)}`;
      if(!existentesPorChave.has(chave)) existentesPorChave.set(chave, c);
    });
  } else if(s.tipo==='fornecedores'){
    FORNS_ROT.forEach(f=>{
      const chave=`${normalizarTexto(f.nome)}|${normalizarTexto(f.cidade)}`;
      if(!existentesPorChave.has(chave)) existentesPorChave.set(chave, f);
    });
  }
  const chavesVistasNoArquivo=new Set();
  const existentesParaExcluir=[];

  dados.forEach((linha,i)=>{
    const nLinha=i+2; // +2 porque linha 1 é cabeçalho e arrays são 0-indexed
    const get=campo=>{const idx=s.mapeamento[campo];return idx!==undefined?linha[idx]:undefined;};
    if(s.tipo==='vendas'){
      const cliente=String(get('cliente')||'').trim();
      const valor=parseValorBR(get('valor'));
      const dataObj=parseDataBR(get('data'));
      if(!cliente||isNaN(valor)||!dataObj){erros.push({linha:nLinha,motivo:'Cliente, valor ou data inválidos/ausentes'});return;}
      // Valor pago é um campo separado do valor total da NF — só existe pagamento se a planilha
      // trouxer um valor pago > 0. Sem essa checagem, tudo era importado como "pago", o que é errado
      // sempre que o cliente ainda deve (valor pago = 0,00 na planilha original).
      const valorPagoRaw=get('valorPago');
      const valorPago=valorPagoRaw!==undefined?parseValorBR(valorPagoRaw):NaN;
      const houvePagamento=!isNaN(valorPago)&&valorPago>0;
      const dataPagObj=parseDataBR(get('dataPagamento'));
      const formaPag=matchFormaPagamento(get('pagamento'))||'Importado';
      const filial=String(get('filial')||'').trim();
      const numeroNF=String(get('numeroNF')||'').trim();
      const numeroBoletoRaw=String(get('numeroBoleto')||'').trim();
      const numeroBoleto=(numeroBoletoRaw&&numeroBoletoRaw!=='-')?numeroBoletoRaw:'';
      const chave=numeroNF||numeroBoleto||`${normalizarTexto(cliente)}|${dataObj.iso}|${valor.toFixed(2)}`;

      if(chavesVistasNoArquivo.has(chave)){
        duplicados.push({linha:nLinha, chave, cliente, valor, data:dataObj.br, origem:'arquivo', existenteId:null});
        return;
      }
      const existente=existentesPorChave.get(chave);
      if(existente){
        if(!substituir.has(chave)){
          duplicados.push({linha:nLinha, chave, cliente, valor, data:dataObj.br, origem:'existente', existenteId:existente.id});
          return;
        }
        existentesParaExcluir.push(existente.id);
      }
      chavesVistasNoArquivo.add(chave);

      registros.push({
        id:'imp'+Date.now()+i,cliente,cliId:'',pneus:parseInt(get('pneus'))||0,
        pagamento:formaPag,filial,numeroNF,numeroBoleto,
        valor,valorTotal:valor,obs:'Importado do Sygecom',hora:'--:--',
        data:dataObj.br,dataISO:dataObj.iso,
        qtds:{},dev:null,
        pagamentos:houvePagamento?[{valor:valorPago,forma:formaPag,hora:'--:--',data:dataPagObj?.br||''}]:[],
        notasFiscais:numeroNF?[{numero:numeroNF,valor}]:[]
      });
    } else if(s.tipo==='contas'){
      const cliente=String(get('cliente')||'').trim();
      const valor=parseValorBR(get('valor'));
      const vencObj=parseDataBR(get('vencimento'));
      if(!cliente||isNaN(valor)||!vencObj){erros.push({linha:nLinha,motivo:'Cliente, valor ou vencimento inválidos/ausentes'});return;}
      const numeroBoleto=String(get('numeroBoleto')||'').trim();
      const chave=numeroBoleto||`${normalizarTexto(cliente)}|${vencObj.iso}|${valor.toFixed(2)}`;

      if(chavesVistasNoArquivo.has(chave)){
        duplicados.push({linha:nLinha, chave, cliente, valor, data:vencObj.br, origem:'arquivo', existenteId:null});
        return;
      }
      const existente=existentesPorChave.get(chave);
      if(existente){
        if(!substituir.has(chave)){
          duplicados.push({linha:nLinha, chave, cliente, valor, data:vencObj.br, origem:'existente', existenteId:existente.id});
          return;
        }
        existentesParaExcluir.push(existente.id);
      }
      chavesVistasNoArquivo.add(chave);

      registros.push({
        id:'impc'+Date.now()+i,cliente,valor,vencimento:vencObj.br,vencISO:vencObj.iso,
        tipo:String(get('tipo')||'Boleto').trim()||'Boleto',
        numeroBoleto,
        filial:String(get('filial')||'').trim(),
        contaId:'',pagamentos:[]
      });
    } else if(s.tipo==='fornecedores'){
      const nome=String(get('nome')||'').trim();
      const cidade=String(get('cidade')||'').trim().toUpperCase();
      const uf=String(get('uf')||'').trim().toUpperCase().slice(0,2);
      if(!nome||!cidade||!uf){erros.push({linha:nLinha,motivo:'Loja, cidade ou UF inválidos/ausentes'});return;}
      const chave=`${normalizarTexto(nome)}|${normalizarTexto(cidade)}`;

      if(chavesVistasNoArquivo.has(chave)){
        duplicados.push({linha:nLinha, chave, cliente:nome, valor:0, data:'', origem:'arquivo', existenteId:null});
        return;
      }
      const existente=existentesPorChave.get(chave);
      if(existente){
        if(!substituir.has(chave)){
          duplicados.push({linha:nLinha, chave, cliente:nome, valor:0, data:'', origem:'existente', existenteId:existente.id});
          return;
        }
        existentesParaExcluir.push(existente.id);
      }
      chavesVistasNoArquivo.add(chave);

      const ultimaColetaObj=parseDataBR(get('ultimaColeta'));
      const rede=String(get('rede')||'').trim().toUpperCase();
      registros.push({
        id:'loja'+Date.now()+i,
        nome,cidade,uf,
        rede,marca:inferMarcaCode(rede),
        codLoja:String(get('codLoja')||'').trim().toUpperCase(),
        cep:String(get('cep')||'').trim(),
        endereco:String(get('endereco')||'').trim(),
        observacao:String(get('observacao')||'').trim(),
        uc:ultimaColetaObj?.iso||'',
        ciclo:parseInt(get('ciclo'))||30,
        valor:0,
      });
    }
  });
  return{registros,erros,duplicados,existentesParaExcluir};

}
